  # G-5 (FR10) NO estaba en el corte original: se descubrió midiendo al contextualizar G-4a. El `event_store`
  # conserva el id real del sujeto a perpetuidad (aggregate_id de 6 eventos + payload de SessionStarted y los
  # seis Invitation*), ningún routing lo cambia y la cadena de erasure no toca la tabla — luego G-4a persigue la
  # fuga MENOR. No se abrió issue (decisión de Sergio, 2026-07-30: el contador ya está saturado); vive aquí y en
  # epics-gdpr-hardening.md. La decisión de ESTRATEGIA DE PERSISTENCIA está TOMADA (Sergio, 2026-08-01) y
  # registrada en D12 de docs/adr/event-store-and-projections.md: el log pasa a append-only CON UN CONJUNTO
  # CERRADO DE MUTACIONES SANCIONADAS —hoy una, el borrado GDPR—, igual que su hermano audit_log. Un único
  # UPDATE reescribe el id del sujeto con un UUID aleatorio nuevo acuñado en el borrado, EN LA COLUMNA Y EN LAS
  # CLAVES DE PAYLOAD, dentro de la transacción que FulfilIdentityErasure ya posee.
  # Tres premisas del corte cedieron al medirlas: (1) la vía que llamaba "única viable" —aggregate_id nacido
  # como sustituto DERIVADO— está VETADA por el mismo D4 que veta el crosswalk (prohíbe la tabla de mapeo Y la
  # derivación determinista, con esas palabras); (2) la UNIQUE de stream no restringe nada mientras tenant_id se
  # escriba NULL (Postgres usa NULLS DISTINCT); (3) NINGUNA consulta de src/ lee aggregate_id de vuelta.
  # El inventario de FR10 se dejaba SessionRevoked, corregido.
  # LOS DOS EJES SE CIERRAN JUNTOS: una historia que solo reescriba aggregate_id deja su propio test falsable en
  # verde mientras el id sigue vivo en el payload de al lado — NFR3 fallando dentro de la historia que lo instala.
  # Sigue en backlog por falta de artefacto de contexto, no por decisión abierta.
  # Mientras G-5 no cierre, la épica NO puede declararse completada.
  g-5-ids-de-persona-fuera-del-event-store: backlog
