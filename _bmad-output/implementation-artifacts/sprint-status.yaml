# DEFINICIONES DE ESTADO:
# =======================
# Estado de épica:
#   - backlog: Épica aún no iniciada
#   - in-progress: Épica en desarrollo activo
#   - done: Todas las historias de la épica completadas
#
# Transiciones de estado de épica:
#   - backlog → in-progress: Automática al crear la primera historia (vía create-story)
#   - in-progress → done: Manual cuando todas las historias alcanzan 'done'
#
# Estado de historia:
#   - backlog: La historia solo existe en el fichero de épicas
#   - ready-for-dev: Fichero de historia creado en la carpeta de historias
#   - in-progress: Desarrollador trabajando activamente en la implementación
#   - review: Lista para revisión de código (vía workflow code-review del Dev)
#   - done: Historia completada
#
# Estado de retrospectiva:
#   - optional: Puede realizarse pero no es obligatoria
#   - done: Retrospectiva realizada
#
# NOTAS DE WORKFLOW:
# ==================
# - La épica pasa a 'in-progress' automáticamente al crear su primera historia
# - Las historias pueden trabajarse en paralelo si la capacidad del equipo lo permite
# - El desarrollador suele crear la siguiente historia tras cerrar la anterior en 'done' para incorporar aprendizajes
# - El Dev mueve la historia a 'review' y luego ejecuta code-review (contexto fresco, LLM distinto recomendado)

