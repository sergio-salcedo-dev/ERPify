- id: "mfa-1"
  title: Second-factor port, sealed aggregate and enrolment
  description: >-
    CAP-1 and the persistence half of CAP-6 and CAP-9: the TOTP port and RFC 6238 adapter, the state-oriented
    aggregate with the sealed secret, enrol and confirm routes, erasure and person-reference registration.
  invoke_dev_with: >-
    Seal under a random per-factor scope id held on the identity's factor row (never a scope derived from the
    person's id: the tombstone and the erasure evidence outlive the person) with an identity-bound AAD; join
    EraseIdentitySubject (row delete plus key destroy, evidence scope on GDPR_SUBJECT_ERASED),
    .person-reference-policy, a PersonReferenceSource, .audit-evidence-actions and .route-manifest.json; classify
    the enrol route in .credential-proof-policy; test the adapter with the RFC 6238 vectors. Create
    docs/adr/two-step-verification.md (owner, 2026-11-28) and list it in docs/index.md; later stories amend it. The
    confirmation stays ordinary (owner, option 1b): a pending factor closes after PT10M or 5 wrong codes counted on
    its row under its lock and committed although the request fails, answering 409 second-factor-not-enrolled; only
    a new enrolment restarts it. On activation revoke every session, re-authenticate the asking device and mail the
    owner post-commit, as change-password does.
- id: "mfa-2"
  title: Second step on every session-minting path
  description: >-
    CAP-2: pending-login state, the code step, and the gate over login, reset-password, invitation accept,
    change-password and recovery redeem, with uniform failures and structural indistinguishability tests.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Read integration-points.md first. The gate sits above priority -64 on LoginSuccessEvent and in
    ReauthenticateDevice; clear the firewall token when withholding the mint; code attempts use their own limiter
    and never the email-keyed lockout. That limiter is only an attenuator, so add a persisted per-factor
    consecutive-failure counter for the enabled factor (owner, 2026-11-28): on the factor row, counted under its lock,
    committed even when the request fails, reset only by an accepted code (TOTP or recovery), never by a correct
    password, a deploy or time, never touching failed_attempts or locked_until, bounding a sustained 30-day attack
    to at most 1e-3; settle at the spec checkpoint whether its lock notifies the owner and whether the disable route
    spends it. Close the PRODUCTION_SECURITY_CHECKLIST section 7 item on guessing an enabled factor's code.
- id: "mfa-3"
  title: Recovery codes and disabling the factor
  description: >-
    CAP-3 and CAP-4: ten single-use recovery codes at activation, accepted at the second step, and the disable
    route that requires a valid app or recovery code.
  invoke_dev_with: >-
    Classify the code-authenticated disable route with a new code-proof class of the credential-proof gate
    (owner, 2026-11-28): extend .credential-proof-policy and the gate so the action must spend its own
    per-identity second-factor code budget and verify the code before invoking the use case, as a mechanism a
    WebAuthn assertion also fits, never a pinned exception, and move the enrolment's confirmation into that class.
    Accepting a recovery code at the second step mails the identity's owner post-commit, outside the login
    request's timing, with nothing exercisable in it. Add a recovery-code generation and regeneration route behind a
    password re-proof that also serves factors enabled before this story (owner, 2026-11-28). Disabling deletes the
    factor row and destroys its key in the same transaction, and either writes evidence the subject-erasure
    reconciler accepts or makes the reconciler exclude non-erasure TotpFactor: tombstones (decide which). Store
    digests only and consume atomically; amend docs/adr/two-step-verification.md.
- id: "mfa-4"
  title: Administrator reset and operator console command
  description: >-
    CAP-5: the admin reset route with caller password re-proof and self-reset refusal, audited, plus the console
    command for the last-administrator case.
  spec_checkpoint: true
  invoke_dev_with: >-
    Follow UnlockUserAccount for the self-target refusal and ProveActorPassword for the caller proof; model the
    command on organization:administrator:create and add its parameters to .person-address-parameter-policy. A
    reset deletes the factor row and destroys its key in the same transaction, with the evidence or reconciler
    treatment mfa-3 settles for non-erasure TotpFactor: tombstones.
- id: "mfa-5"
  title: Privileged-lockout alert to administrators
  description: >-
    CAP-7: a maintenance-tick notice to the other active administrators when an ADMIN identity is locked, once per
    identity per day, with nothing exercisable in the mail.
  invoke_dev_with: >-
    Extend the NotifyLockedIdentities pattern on the identity_maintenance schedule; never filter locked_until in
    DoctrineActiveAdministratorDirectory; no mail work in the failing login request.
- id: "mfa-6"
  title: PWA second step and profile panel
  description: >-
    CAP-8: the login second-step state, and the profile panel to enrol, show recovery codes once and disable,
    following the existing form and error-surface patterns.
  invoke_dev_with: >-
    Add a second-step outcome to LoginOutcomeKind routed by problem.type; model the panel on ChangePasswordForm
    and the recovery-secret panel; register endpoints in API_ENDPOINTS; secret displays follow the PasswordInput
    and CopyButton rules.
