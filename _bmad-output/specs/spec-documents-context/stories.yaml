- id: "doc-1"
  title: Stream-oriented envelope encryption in Shared/Crypto
  description: >-
    Add the stream sibling of EnvelopeEncryptor so a multi-gigabyte original can be sealed
    without buffering (CAP-3), and close the destroy-before-mint hole in the keystore. Pure
    Shared/Crypto, no Documents code yet. No dependency.
  spec_checkpoint: true
  invoke_dev_with: >-
    Reuse EncryptionScopeId, Keystore and destroyScope(); do not change the string-oriented
    encrypt/decrypt contract. Sealing under a destroyed scope must throw DekDestroyed: test
    seal, destroy, seal again. DbalKeystore::destroy() writes no tombstone for a scope never
    minted (it updates zero rows), so a late writer mints a live key: destroying an unminted
    scope must leave a tombstone, tested by destroy-unminted, seal, expect DekDestroyed, and the
    boolean it returns must never decide erasure. The stream seal authenticates truncation (a
    final-chunk marker in the associated data). Measure peak memory on a large input rather than
    asserting it.
- id: "doc-2"
  title: Documents bounded context skeleton and storage port
  description: >-
    Create the context, the Document aggregate shell and its own stream-writing storage port
    with a first filesystem adapter (CAP-1 groundwork): the document snapshot table and the
    append-only document_custody table. Depends on doc-1. Blocked on the host-context decision
    and on the actor pseudonymisation question.
  spec_checkpoint: true
  invoke_dev_with: >-
    State-oriented Document plus document_custody in one transaction. Load the aggregate under
    the lock (PESSIMISTIC_WRITE or re-read after SELECT ... FOR UPDATE), compute seq inside it,
    UNIQUE (document_id, seq) as second defence with a violation mapped to a retry; seq 1 shares
    the document insert's transaction. A source gate over api/src in the style of
    SanctionedLogMutationGateTest refuses update/delete of custody rows (no database role,
    GRANT or trigger exists, and none is part of this story). Custody stays readable after key
    destruction and is not claimed tamper-proof against a PostgreSQL administrator. Each
    version is its own aggregate; the first migration carries series_id (the first version's
    own id) and predecessor_id with a partial UNIQUE on predecessor_id. Decide here which scope
    seals each free-text field (filename, title, uploader) or forbid it as free text. The port
    declares no WORM guarantee. Do not reuse ImageStorage or any generic storage port. Register
    every person-id column (person-reference policy, attribute, detective source) and the
    Document resource type in the same PR that adds it.
- id: "doc-3"
  title: UploadEvidence ingest
  description: >-
    Accept an evidence upload through the Symfony 8.1 resolver and the transport-only
    denormalizer, store it sealed and untransformed via staging, and end in Received with
    digest, metadata and the first custody record (CAP-1). Depends on doc-2. Exposes no read
    route.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    No transport type or caller-supplied path past Infrastructure; add the scan and regression
    test ADR invariant 6 asks for. Staging on the same mount as the final namespace, synced,
    row inserted in the transaction that mints the key, then rename; orphan reaper with a
    liveness lease and a sweep of the final namespace. Idempotency key: the same key with
    different bytes is a conflict, a replay after Erased returns the tombstone; the key column is
    a person reference. This story owns the production precondition: before its output holds
    real documents the stored bytes need an encrypted offsite backup, digest verification and a
    proven restore of originals and metadata (SPEC Constraints); record who proved it. Needs the
    retention and legal-basis vocabulary decided. Put the misfiling question to the user.
- id: "doc-4"
  title: Scan and readiness gate
  description: >-
    Scan after ingest through a leased, retried post-commit message, move to Ready,
    Quarantined or ScanFailed, and fail closed while the scanner is unavailable (CAP-2).
    Depends on doc-3.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Needs the scanner, scan-versus-seal and retry-cap decisions. Compare-and-set on every
    transition, carrying the lease token or attempt number so a verdict from a superseded lease
    is dropped. Count retries on the snapshot; custody records the lease claim and the verdict,
    not each failed attempt. The scanner gets a decrypt stream only, never a file or spool;
    measure its size limit against the largest supported original and end in ScanFailed, never
    Ready, beyond it. Add the stuck-document alarm. A schedule is dead until a worker consumes it.
- id: "doc-5"
  title: Audited read path
  description: >-
    Serve a Ready document through a route that declares its voter, refuses other states and
    writes an audit row (CAP-9). Depends on doc-4. Not served for real documents before doc-3's
    backup and restore proof exists.
  invoke_dev_with: >-
    Mirror the hardening of ImageGetController (nosniff, locked-down CSP, no media type taken
    on trust). The route is a conscious frontier decision: voter, not a public route. A Ready
    document whose bytes are missing or fail digest verification fails closed with a defined
    problem type and an alarm.
- id: "doc-6"
  title: Custody trail listing and document metadata
  description: >-
    List the ordered states and metadata of a document (CAP-6). Depends on doc-2 and doc-3;
    lands before erasure, which depends on it. The decision to seal or forbid free-text fields
    is taken in doc-2 and doc-3, not here.
- id: "doc-7"
  title: Erasure by key destruction
  description: >-
    Erase a document from any non-terminal state by destroyScope(), keeping digest and custody
    (CAP-4); record the digest residual in the security checklist. Depends on doc-6 and on
    doc-1's tombstone fix. Blocked on the key-resurrection question.
  done_checkpoint: true
  invoke_dev_with: >-
    Owes a recorded adversarial pass. Needs the key-resurrection-on-restore question answered
    (write-ahead erasure ledger, replay through this use case, restore step). The Erased
    transition, its custody row and the key destruction commit together or are re-drivable from a
    recorded intent; write a scenario for a crash at each point. Erased is decided by the
    aggregate's compare-and-set, never by destroyScope()'s boolean, and a repeat appends no
    custody row. Erasure must not wait on a scan. Lock order is document, then keystore. No
    person event on a persisted transport. Doc-9 amends this use case to iterate every version.
- id: "doc-8"
  title: Dependent derivatives through the images module
  description: >-
    Create the missing origin on Image and the entry point other contexts use to materialise a
    derivative, then delete derivatives on erasure (CAP-5). Depends on doc-7. Touches
    Shared/Images, schema included.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Owes a recorded adversarial pass. Inherit docs/adr/image-deletion-signal-transport.md and
    its residuals; retries re-query by origin; late arrivals are deleted; add the orphan sweep
    and the alarm. This is the ADR D4 rename trigger: record the decision on Images.
- id: "doc-9"
  title: Document versioning
  description: >-
    A new version is a new immutable original linked to its predecessor, with erased nodes
    kept as readable tombstones (CAP-7). Depends on doc-7.
  invoke_dev_with: >-
    Touches erasure semantics, so it owes a recorded adversarial pass. Each version is its own
    aggregate (decided); the series is a scalar id plus a read projection. The chain is linear: a
    new version requires a Ready predecessor and the partial UNIQUE on predecessor_id refuses a
    fork. Amend doc-7's use case so a subject's erasure iterates every version and re-queries
    until none remains. A tombstone carries only id and digest.
- id: "doc-10"
  title: OCR of scanned PDFs
  description: >-
    Extract searchable text from Ready scanned PDFs as a derivative that dies with its
    document (CAP-8). Depends on doc-8.
  invoke_dev_with: >-
    Reads the original through the same decrypt stream as the scanner: no plaintext written to
    disk or a spool.
