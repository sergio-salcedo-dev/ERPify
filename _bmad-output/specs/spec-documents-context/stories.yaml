- id: "doc-8"
  title: Dependent derivatives through the images module
  description: >-
    Create the missing origin on Image and the entry point other contexts use to materialise a
    derivative, then delete derivatives on erasure (CAP-5). Depends on doc-7. Touches
    Shared/Images, schema included.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Owes a recorded adversarial pass. Inherit docs/adr/image-deletion-signal-transport.md and
    its residuals; retries re-query by origin; late arrivals are deleted; add the orphan sweep
    and the alarm. This is the ADR D4 rename trigger: record the decision on Images.
- id: "doc-9"
  title: Document versioning
  description: >-
    A new version is a new immutable original linked to its predecessor, with erased nodes kept
    as readable tombstones (CAP-7). Depends on doc-5 and doc-7. The erasure semantics are decided
    (SPEC); the mechanism that refuses a second live successor is decided here.
  invoke_dev_with: >-
    Touches erasure semantics, so it owes a recorded adversarial pass. Each version is its own
    aggregate (decided); the series is a scalar id plus a read projection. Authorise the caller on
    the predecessor with a voter before sealing, and answer absent and forbidden alike. The chain is
    linear: the new-version transaction takes the new scope's keystore row and then FOR UPDATE on
    the predecessor after the new bytes are sealed (never across the stream), rechecks Ready; the
    loser of a successor race maps to a conflict and its bytes fall into the aborted-upload class.
    The size bounds of doc-3 (zero-length refusal, MAX_ORIGINAL_BYTES, the body bounds) apply to
    this path too, since it also seals. First decide the successor-exclusion mechanism and record it
    in the Documents ADR: a holds_slot flag with a partial unique index on predecessor_id and a
    locked walk-up over the contiguous Erased ancestors on every transition that takes or frees the
    slot (the verdict, cap-return, cap-sweep, operator-reopen and erasure paths of doc-4 and doc-7
    then change), or a series row whose head pointer moves by one UPDATE under the row lock (the
    assistant's lean, since it removes the walk-up). A version_no with UNIQUE (series_id,
    version_no) alone does not refuse two concurrent successors. Whichever is chosen keeps the SPEC
    properties (including the cascade that frees a contiguous run of Erased nodes when its last live
    descendant goes, series_id copied from the locked predecessor row, one winner among concurrent
    reopens, the design's lock placed in the global order with the reopen taking the predecessor or
    series before its own row, and a backfill of pre-doc-9 documents in the migration; the declare
    DTO has no predecessor field before this story); the reopen takes FOR UPDATE on the predecessor
    and refuses with a conflict when it is Erased. Tests: erase a middle node, file a sibling and
    expect a conflict; erase the only live descendant of a run of Erased nodes and file a sibling of
    the first, expect success; erase its last descendant and expect the slot free; quarantine the
    only child of an Erased node and expect the slot free; erase the predecessor of a ScanFailed
    child and expect the reopen refused; reopen a ScanFailed child whose slot a sibling holds end to
    end. Add series erasure to doc-7's use case as a repeatable operator action (each non-Erased
    version in its own transaction, newest first, reporting what remains); a person's erasure
    touches no document and anonymises references only. The new-version route regenerates
    api/.route-manifest.json, is classified in api/.credential-proof-policy and names its voter and
    Permission. The series projection orders by creation. A tombstone keeps id, digest, size, the
    retention enum fields, the key hash, series_id, predecessor_id, state and timestamps and nothing
    that names a person. Record the series-erasure residual in PRODUCTION_SECURITY_CHECKLIST.md
    section 7.
- id: "doc-10"
