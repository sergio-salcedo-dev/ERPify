- id: "doc-1"
  title: Stream-oriented envelope encryption in Shared/Crypto
  description: >-
    Add the stream sibling of EnvelopeEncryptor so an original can be sealed with peak memory
    independent of its size (CAP-3), and close the destroy-before-mint hole in the keystore. Pure
    Shared/Crypto, no Documents code yet. No dependency.
  spec_checkpoint: true
  invoke_dev_with: >-
    Owes a recorded adversarial pass (it changes key destruction and the erasure reconciler).
    Reuse EncryptionScopeId (the Document scope type is Document, with a random UUID id), Keystore and
    destroyScope(); do not change the string-oriented
    encrypt/decrypt contract. Sealing under a destroyed scope must throw DekDestroyed: test
    seal, destroy, seal again. DbalKeystore::destroy() writes no tombstone for a scope never
    minted (it updates zero rows), so a late writer mints a live key: make it an upsert of a
    destroyed row, first-writer-wins so it never changes the reason or destroyed_at of an existing
    tombstone (kek_version is NOT NULL, so the row carries the current KEK version and a null
    wrapped_dek), add a reason to the keystore row (aborted-upload or erasure), and test
    destroy-unminted, seal, expect DekDestroyed. The boolean it returns must never decide
    erasure. Add a Keystore method that locks the scope's row and reports live, tombstoned or
    absent (wrappedDekFor() cannot tell a tombstone from absence), and the tombstone of an unminted
    scope carries the sentinel kek_version 0.
    Amend DbalSubjectErasureReconciler to exclude aborted-upload tombstones and Document
    scopes, with a test that plants one of each and expects unreconciledScopes() empty. The
    stream seal authenticates truncation (an authenticated final-chunk marker, the secretstream FINAL tag) and
    binds the scope in the associated data of every chunk, never a storage path, so a rename needs no re-seal. The final-chunk
    marker is decided by lookahead, so the seal never emits a final-marked chunk for a stream the
    counter then rejects at byte MAX_ORIGINAL_BYTES + 1. The unseal refuses a stream with no
    final-marked chunk (a 0-byte file from a full disk or a partial restore), and the sibling
    throws CannotSealEmptyStream on empty input before any key is minted, with a test pinning it. Test at MAX-1, MAX and MAX+1 and at exact multiples of the chunk size
    (104,857,600 is a multiple of every power-of-two chunk up to 4 MiB; for a larger chunk test the
    largest multiple below the cap and one byte either side of it). The secretstream
    construction chains each chunk to its predecessors, so reordering, duplicating or dropping a
    chunk fails authentication, and the unseal refuses any byte after the final-marked chunk. A chunk
    is filled by looping until the chunk size or end of stream, never on one fread (php://input and
    network streams return short reads). Tests: a source returning one byte per read; a source
    returning an empty string once before data; swap two middle chunks; duplicate one; delete a
    middle chunk; append a valid chunk after the final one; truncate exactly at a chunk boundary.
    State which primitive seals the original filename (the existing string-oriented encrypt under
    the document's scope with its own associated data) and pin by test that a filename ciphertext
    does not open as a stream chunk and the reverse. Measure peak memory at 1 MiB and at
    MAX_ORIGINAL_BYTES (100 MiB) rather than asserting it, and fix by measurement the bound on
    the difference.
- id: "doc-2"
  title: Documents bounded context skeleton and storage port
  description: >-
    Create the top-level Documents context, the Document aggregate shell and its own
    stream-writing storage port with a first filesystem adapter (CAP-1 groundwork): the document
    snapshot table and the append-only document_custody table. Depends on doc-1. The host
    context and the actor route are decided (SPEC).
  spec_checkpoint: true
  invoke_dev_with: >-
    Owes a recorded adversarial pass (it creates the person-erasure seam).
    State-oriented Document plus document_custody in one transaction. Load the aggregate under the
    lock (PESSIMISTIC_WRITE or re-read after SELECT ... FOR UPDATE), compute seq inside it, UNIQUE
    (document_id, seq) as second defence with a violation of that constraint mapped to a retry (a
    unique violation is mapped by constraint name: the idempotency-key constraint, and the successor
    constraint doc-9 adds if any, are conflicts, never retried); seq 1 shares the document insert's
    transaction. A new source gate and engine over api/src, classified in
    api/.artifact-gate-placement and wired as a php.lint.* target (the existing
    SanctionedLogMutationGateTest SANCTIONED set and TABLES cover event_store and audit_log only),
    refuses update/delete of custody rows except one sanctioned statement, the actor anonymisation
    (it rewrites the actor to one constant marker, the nil UUID declared once as a constant, never a
    per-subject value; it takes documents and custody rows in ascending id inside the identity
    erasure's transaction and the lock order and needs an index on the actor; precedent
    DbalAuditActorAnonymiser): write its decision in a Documents ADR for the custody log, created by
    this story (no database role, GRANT or trigger exists, and none is part of this story). Custody
    stays readable after key destruction and is not claimed tamper-proof against a PostgreSQL
    administrator. Each version is its own aggregate; the first migration carries series_id (the
    first version's own id) and predecessor_id, with no slot column, index or walk-up (doc-9 decides
    that mechanism, since no node has a child before it), a scope_id column (random, never derived
    from the document id, with a UNIQUE so two documents never share a scope), a nullable UNIQUE on
    the idempotency hash of the snapshot (NULL after the actor's erasure), the declared size and the
    retention fields (retention_reason, legal_basis, review_at; the tombstone keeps them, the values
    arrive with doc-3) and Erased in the state enum from the start. The snapshot carries a
    ciphertext column for the original filename (sealed under the document's own scope by doc-3's
    commit; no plaintext name and no title column); the uploader and the custody actor are person
    references anonymised by erasure, not sealed fields, and the idempotency hash on the snapshot is
    nulled by the same erasure. The port declares no WORM guarantee. Do not reuse ImageStorage or
    any generic storage port. Register every person-id column (person-reference policy, attribute,
    detective source that excludes the marker) in the same PR that adds it. The idempotency hash is
    not a Types::GUID (the registry's whole universe), so it is not registered: the same purge nulls
    it and an acceptance scenario proves it. Ship in this PR the Documents use case that purges the
    person references of the columns it adds (snapshot uploader, custody actor, idempotency hash).
    Shared/Privacy holds no erasure port, so this story creates the seam, and both consumers of the
    identity purge, FulfilIdentityErasure and ResweepErasedSubjects, reach it through it (a port, or
    a published seam in api/.bounded-context-allowlist with its deptrac skip_violations mirror for
    each). The wiring check wants a typed collaborator whose name carries the entity and an
    anonymise method call on it, so Document and DocumentCustody are ORM entities reached through
    repository collaborators, whatever SQL they run; the check is satisfied by any collaborator
    whose type name contains Document, so a scenario that plants an uploader id on a Document row
    and expects it anonymised is the real control. Register the module in
    api/tools/deptrac/deptrac.yaml, classify every other Types::GUID column non-person and the
    Document aggregate type in api/.persistent-transport-policy only if a DomainEvent declares it
    (the gate fails a line nothing emits). Document is not #[AuditedEntity] and AuditMetadataKey
    gains no filename key. The Document audit resource type is classified by the story that first
    writes it, not here (the gate refuses a type nothing writes). The snapshot migration carries the
    nullable UNIQUE on the idempotency hash; promoted_at and next_scan_at arrive with doc-3 and the
    scan columns with doc-4. Record the custody-append-only and anonymisation-race residuals in
    PRODUCTION_SECURITY_CHECKLIST.md section 7. Add a digest column to the snapshot (sha256 of the
    original, lower-case hex, immutable; the tombstone keeps it). Map DocumentCustody read-only after
    insert (#[ORM\Entity(readOnly: true)]) and have the gate also refuse remove() on it; the
    sanctioned anonymisation is the only DBAL write. Extend ErasureLockOrderTest and
    ErasureLockOrderFunctionalTest with the Documents purge at its position after the identity,
    session and audit locks. Map a deadlock_detected to a retry. Registries and docs:
    docs/architecture-api.md, docs/source-tree-analysis.md and docs/claude-code-quickref.md for the
    new src/Documents directory, a retention-exception paragraph for document_custody in
    docs/rules/database.md (never pruned, one sanctioned UPDATE, the analogue of audit_log's), and the
    new php.lint.* target wired into php.quality and php.quality.dry-run with its CLAUDE.md
    Required-checks bullet.
- id: "doc-3"
  title: UploadEvidence ingest
  description: >-
    Accept an evidence upload as a declare step plus a raw-body PUT, store it sealed and
    untransformed via staging, and end in Received with digest, metadata and the first custody
    record (CAP-1). Depends on doc-2. Exposes no read route; its acceptance reads through the
    storage port and the decryptor in a test.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Owes a recorded adversarial pass (it writes aborted-upload tombstones and extends the person
    purge). Run the transport spike first and measure, do not assume, what FrankenPHP and PHP do with a raw
    PUT body (the request stream, post_max_size, upload_max_filesize, the temp directory, the
    request time limit, a 100 MiB body at constant memory). Two steps. The declare step takes the
    size, the actor-scoped idempotency key and a sha256 (mandatory whenever a key is supplied: 64
    hex characters, validated, stored and compared in lower case), refuses a zero or
    over-MAX_ORIGINAL_BYTES size before any keystore row exists (no tombstone), applies a per-actor
    rate limit through the existing limiter pattern, caps live Declared intents per actor (provisional 10, fixed here; over it, the rate-limit problem
    type) and
    creates the upload-intent record: an ORM entity (so its GUID columns are in the person-reference
    registry's universe, with the non-person ones classified) and a state machine (Declared,
    Streaming, Committed, Expired) holding the actor, scope id, declared size and sha256, key hash,
    predecessor id (NULL until doc-9: the declare DTO has no predecessor field before then and
    series_id equals the document's own id, so no code path can create a successor), retention
    fields, ttl_expires_at, claimed_at, lease_expires_at and upload_deadline_at. The PUT loads the
    intent, authorises the caller as its actor by the voter of the declare step (absent and forbidden
    answer alike, with the gone problem type), dispatches on the intent's state (a Committed intent
    answers its document and ignores any name; Expired, Streaming past its lease and a second PUT
    answer gone or conflict) and only on Declared checks Content-Length (present and equal to the
    declared size) and then the name, before it claims, so a request that fails leaves the intent
    Declared. The PUT carries the original filename as a percent-encoded UTF-8 filename query
    parameter, never a header, a path segment or the declare step; it is required and validated
    before the claim (valid UTF-8 checked first, NFC, 1 to 255 bytes, not empty after trimming
    Unicode whitespace, no code point of general category Cc, Cs, Co, Cn, Zl or Zp and no format
    character other than U+200C and U+200D; / and \ stored as inert text; exactly one filename
    parameter in the raw query, counted before decoding; the client encodes with encodeURIComponent
    because PHP decodes an unencoded + as a space), so an invalid name answers 422 and leaves the
    intent Declared, and no exception message, problem detail or log context quotes the value; it
    is held in request
    memory only, never in the intent row, and the commit transaction seals it under the document's
    scope with its own associated data (the scope id and a filename purpose); a PUT on a Committed
    intent ignores a supplied name. Add filename to a dedicated QUERY_KEYS set of RequestUriRedaction,
    matched as a substring after the same padding and decoding reduction and consulted only by the
    URI redaction paths (not RedactionDenylist::KEYS, which strips response-body extension keys, and
    not IDENTITY_KEYS, which is matched whole and parity-gated), so Monolog's request_uri, the
    per-error log line and Sentry's url and query_string drop it; on the upload route's path those
    paths replace the whole query with the sentinel (the user, 2026-11-05; unit row: a misspelt key
    such as file_name=); mirror the set in
    pwa/src/context/shared/observability/domain/redaction.ts and extend RedactionVocabularyParityTest
    to compare the two. Unit rows: filename, FILENAME, filename[], filename[0], %66ilename,
    filename%00, a repeated key and a double-encoded key, through redact(), redactQuery(), the Monolog
    processor and SentryEventScrubber. Close the two Sentry paths that bypass that scrubber: wire
    before_send_transaction (dev and prod) to a scrubber applying RequestUriRedaction to request.url,
    request.query_string and contexts.trace.data http.url, and set max_request_body_size to never
    with SentryEventScrubber dropping a string request.data (the cost, stated: no body diagnostics on
    the JSON routes); tests feed a transaction event carrying ?filename=SECRET and an error event on
    a 5-byte PUT body through the hooks and expect neither in the serialised event. Keep Document,
    UploadIntent and DocumentCustody out of #[AuditedEntity] with a reflection test, and extend
    the containment test of AccessLogQueryContainmentGateTest (which is GET-only today) to send real
    PUTs to the upload route with a distinctive percent-encoded name (completed, aborted mid-body,
    past the Caddy body bound), reading both /var/log/caddy/access.log and the container's default
    log; if a Caddy error line carries the URI, add a filter for it or record a section 7 residual
    with an owner. A functional test PUTs an invalid name (a bidi character, 256 bytes, a control
    character) and asserts the sentinel is absent from the 422 body and every captured log record,
    and an acceptance check shows the intent row holds no plaintext name; it then claims the intent with
    a compare-and-set Declared to Streaming under the intent row lock, before reading a byte or
    minting a key, setting claimed_at, lease_expires_at and upload_deadline_at = claimed_at +
    declared size / minimum accepted throughput + a constant margin (the throughput and the margin
    are fixed by this story's transport spike so that a 100 MiB upload on the slowest accepted link
    finishes inside it; a commit refused for crossing it answers the aborted-upload problem type).
    The claim also requires ttl_expires_at > NOW() and enforces the cap on Streaming intents with a
    live lease and deadline, per actor and globally (provisional 2 per actor and 4 globally, fixed
    here), under transaction-scoped advisory locks (per actor, then global) taken after its own
    intent row, with nothing else acquired while one is held; over a cap it answers the rate-limit
    problem type with no Retry-After and leaves the intent Declared. The heartbeat renews the lease
    and never beyond upload_deadline_at. A second PUT or a PUT on a Streaming or Expired intent
    answers a conflict or the gone problem type and touches nothing, and a PUT on a Committed intent
    answers the existing document. The PUT counts bytes to end of stream, and a body that differs
    aborts into the aborted-upload class. The PUT hashes the plaintext as it is sealed; when the
    intent holds a declared sha256 and the computed one differs, the upload falls into the
    aborted-upload class (the digest is checked before the commit transaction), and the computed
    digest is what the Received row stores in doc-2's digest column. A Declared intent expires at ttl_expires_at (a constant
    fixed here), a Streaming one at lease_expires_at or upload_deadline_at; every transition to
    Expired replaces the key hash with NULL. The reaper selects Declared intents past
    ttl_expires_at, Streaming ones past lease or deadline and Expired ones, never a Committed one;
    it tombstones exactly when claimed_at is set (whatever state the intent has since been moved to)
    and no Document holds the scope under both locks, and otherwise deletes the intent with no
    tombstone. Every transition to Expired also sets lease_expires_at = NOW(). A retention sweep
    deletes Committed intents after a window (a constant fixed here). No UploadedFile, transport
    type or caller-supplied path past Infrastructure or into the Documents tree; add the scan and
    regression test ADR invariant 6 asks for (the scan excludes the filename value object, which is
    validated, sealed and never a location, and the test goes red when the scan stops matching either
    the transport types or path- and URL-typed values); add UploadEvidence as a second example to the
    Upload row of docs/rules/cqrs-naming.md. Order: a durable upload-intent record before any byte
    is sealed; the seal commits on its own and no transaction spans the stream; staging on the same
    mount as the final namespace, synced, with a boot guard that creates a probe file in staging,
    renames it into the final root and removes it, refusing to start on any failure (st_dev equality
    is not proof: rename fails with EXDEV across two mount points of one filesystem); one short
    transaction locks the intent row, then the keystore row, asserts the intent is Streaming with a
    live lease and a deadline not passed and the scope Live under the lock (lockState: Absent is a
    snapshot, never accepted), reads the actor and key hash
    from the locked intent row (never from the writer's memory), inserts the Received row
    (promoted_at NULL, next_scan_at = transaction time; this story creates both columns) and seq 1,
    sets the intent Committed with the document id, and commits; the reaper locks in the same order
    and rechecks expiry and the absence of a row under both locks, and a test interleaves the two;
    then rename, sync the final directory, set promoted_at by compare-and-set and only then dispatch
    the scan message. A committed row owns its staged object: the reaper acts on intents and never
    reaps a scope that has a row, and a crash between commit and rename is recovered by a sweep over
    Received rows with promoted_at NULL that rolls the promotion forward and sets promoted_at, never
    by the reaper. A heartbeat that finds its intent gone or expired aborts the writer and deletes
    its staged file; an age sweep over the staging namespace deletes older orphans; a final object
    with no row is alarmed on, never deleted. This story creates the first schedules (the reaper,
    the roll-forward sweep, the staging age sweep, the Committed-intent retention sweep) and owns
    the schedule-consumption obligations that doc-4 and doc-7 follow: the transport named in both
    compose files (a schedule is dead until a worker consumes it), ->stateful() on
    cache.scheduler_checkpoint and a single scheduler_worker replica. Idempotency key: the declare
    step inserts the intent under the UNIQUE on the actor-scoped key hash and then re-reads the
    document table in a new statement of the same transaction (a hit rolls the insert back and
    answers the document, or a conflict on a parameter mismatch; a conflicting intent that vanishes
    before it is read makes the declare retry once); the commit leaves the intent Committed until
    its retention sweep deletes it; a replay is compared at the declare step on digest, declared
    size and every other declared parameter (predecessor id, retention fields) and never streams
    twice; a mismatch is a conflict even against an Erased original, a match against Erased returns
    the tombstone, and the replay answers by intent state (Declared returns the intent, Streaming a
    conflict with Retry-After, Expired counts as absent, Committed returns the document). The actor
    of the upload-intent record is a person reference: register it in api/.person-reference-policy
    with #[PersonSubjectReference] and a PersonReferenceSource that excludes the marker in this
    story; the key hash is not a GUID, so the doc-2 purge, extended here, nulls the intent's hash
    and an acceptance scenario proves it. Extend the doc-2 purge use case to the intent: the actor's
    erasure first replaces the actor with the marker and the key hash with NULL on every intent of
    the actor and expires the Declared and Streaming ones (a Committed intent stays Committed for
    the retention sweep), never deleting a row, so the reaper still tombstones a minted scope; only
    then do the document and custody statements run, all inside the identity erasure's transaction.
    Add a keystore tombstone growth line to the scheduled report; aborted-upload tombstones are never pruned. The declare
    and PUT routes regenerate api/.route-manifest.json, are classified in
    api/.credential-proof-policy and name their voter and Permission; every problem type this story
    mints (conflict, gone, missing or mismatched Content-Length, rate limit, replay conflict) goes
    into docs/api-error-contract.md (make php.lint.error-contract). Record in
    PRODUCTION_SECURITY_CHECKLIST.md section 7 that the sealed filename can name the uploader or a
    third party and survives the person's erasure until its document is erased, that replay
    protection ends with the actor's erasure, that aborted-upload tombstones are never pruned and
    that the thread a slow PUT pins is bounded by the in-flight cap, not eliminated, and that the
    ciphertext length leaks the name's length until the document is erased. This story owns
    the production precondition: before its output holds real documents the stored bytes need an
    encrypted offsite backup, digest verification and a proven restore of originals and metadata
    (SPEC Constraints); record who proved it and commit the proof record in a tracked file whose
    path and format this story fixes (one record per proof: who, when, what was restored, digest set
    verified), which the doc-5 gate reads and doc-7 reuses for the drill. Record retention_reason (closed enum), legal_basis (GDPR Article 6
    enum) and a nullable consumer-supplied review_at, nothing more is enforced. Exactly
    MAX_ORIGINAL_BYTES (100 MiB, one constant that replaces the literal doc-1's tests carry) is
    accepted at the declare step, a larger declared
    size is refused there, and a body that runs past its declared size aborts at the first extra
    byte, counted before each chunk is sealed or staged; the writer that detects the overflow
    deletes its staged file and expires its own intent, and the upload falls into the aborted-upload
    class. Scope a Caddy request_body bound to the upload route on the original path, in bytes,
    equal to the cap (the body is the original, so no framing allowance) and keep the 1MB block in
    the Caddyfile from also capping it; set the PHP limits only as far as the spike shows they
    apply. The application counter answers with a Problem Details; Content-Length and the
    end-of-stream count keep a body Caddy cuts off from reading as a complete shorter original. Fix
    by the same spike the upload lease, the heartbeat interval, the staging age-sweep margin and the
    reaper cadence. The misfiling guard is UI-only and not part of this story. Registries and docs:
    the gate tests it adds (the Documents-tree scan, the reflection test) are classified in
    api/.artifact-gate-placement and wired as php.lint.* targets; the schedules and Messenger
    messages go into docs/architecture-api.md; new Behat steps are classified in
    api/.behat-step-vocabulary; the intent state machine and the lock order are distilled into the
    Documents ADR.
- id: "doc-4"
  title: Scan and readiness gate
  description: >-
    Scan after ingest through a leased, retried post-commit message, move to Ready, Quarantined
    or ScanFailed, and fail closed while the scanner is unavailable (CAP-2). Depends on doc-3.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    The scanner is ClamAV, a local clamd container, and the scan decrypts after sealing and streams
    to clamd. Run the scanner spike first: verify StreamMaxLength, MaxFileSize, MaxScanSize,
    MaxFiles, MaxRecursion and AlertExceedsMax (exceeding a limit must end in ScanFailed, never
    clean) and clamd's memory against the VPS, and fix by measurement the provisional constants
    (attempt cap 3, outage-return cap 10 with an alarm at 5, per-claim deadline 10 minutes, scan
    lease 2 minutes with a 30-second heartbeat, backoff 1, 5, 15 and 60 minutes with 20 percent
    jitter, where counted returns use the first two entries (the attempt cap counts claims, not
    retries) and outage returns walk the whole ladder, so the cap of 10 tolerates about 7 hours;
    clamd's MaxScanTime stays below the scan lease when the worker cannot heartbeat while waiting
    for the verdict (otherwise the wait is a poll with a read timeout below the heartbeat interval)
    and below the deadline and a limit-exceeded answer maps to ScanFailed). A health probe runs
    before the claim and a down scanner leaves Received untouched (no claim, no epoch, no attempt,
    no custody row). This story adds to the snapshot scan_attempts, scan_outage_returns (its own
    higher cap), scan_streaming_started_at (set by compare-and-set immediately before the first byte
    goes to the scanner, cleared on every return to Received), first_claim_recorded (cleared only by
    an operator decision), lease_epoch and the claim and lease columns; next_scan_at and promoted_at
    already exist from doc-3. A return to Received with scan_streaming_started_at NULL (the connect
    failed after the claim) burns no attempt and increments scan_outage_returns; a return with it
    set (reset, timeout, crash, worker death, lease expiry, deadline) increments scan_attempts, or
    scan_outage_returns when the return path's re-probe finds the scanner down. Either increment
    goes, in the same compare-and-set, to ScanFailed with its custody row when the value reaches its
    cap, and otherwise sets next_scan_at (now plus the ladder entry for the outage-return count for an outage return, the
    attempt backoff for a counted one). The return path probes once per sweep run and applies the
    result to every row of the run, with a probe timeout shorter than the sweep interval; the same
    sweep moves a Received row found at or above a cap (a constant lowered at a deploy) to
    ScanFailed. Ready is never rescanned. Retries are driven by a sweep on next_scan_at in
    PostgreSQL, which is authoritative and the only driver (next_scan_at is the transaction time on
    insert, so it also re-drives a lost first message); the Messenger message only wakes it. The
    claim requires scan_attempts and scan_outage_returns below their caps, promoted_at not NULL and
    next_scan_at <= NOW(). The scan lease is renewed by heartbeat, not scaled to size; the heartbeat
    is a compare-and-set on state, lease_epoch and now < claimed_at + deadline, so it cannot extend
    the deadline, a worker whose heartbeat fails stops and posts no verdict, and the verdict
    compare-and-set also requires NOW() < claimed_at + deadline. A heartbeat that finds the epoch
    superseded or the row Erased aborts the scan without counting an attempt, as does DekDestroyed
    seen mid-scan (an open decrypt stream outlives a destroyed key). A local failure is classified:
    a failed authentication, a missing final-chunk marker or a missing final object is deterministic
    (ScanFailed and an alarm), a transient local I/O error counts as no verdict. The lease expiry
    predicate is state = Scanning AND lease_epoch = e AND lease_expires_at < NOW(), evaluated inside
    the UPDATE by the database clock. Versioning adds no state here: no slot column or walk-up
    exists until doc-9, which amends the verdict, cap-return, cap-sweep and reopen paths if its
    mechanism needs it. Once the scanner is chosen, add a gate comparing MAX_ORIGINAL_BYTES with its
    configured limit and verify that limit. Compare-and-set on every transition, carrying a
    monotonic lease_epoch (incremented on every claim and operator reset, never reset, independent
    of the retry counters); the lease expiry is itself a compare-and-set on the stale epoch. Custody
    records the first claim since the last operator decision, the verdict and the operator decision,
    and a lease return or re-claim writes no custody row. Plaintext never reaches persistent
    storage: clamd's temporary directory is a tmpfs, swap is off, the scanner container's
    memswap_limit equals its mem_limit and core dumps are disabled for the scanner and PHP
    containers; the memory, tmpfs and host core_pattern residual goes to
    PRODUCTION_SECURITY_CHECKLIST.md section 7 in this story. Measure the scanner's size limit
    against MAX_ORIGINAL_BYTES and end in ScanFailed, never Ready, beyond it (a deterministic
    failure goes Scanning to ScanFailed without retries). The operator re-scan of a ScanFailed
    document ships here as an API route behind a voter with a closed-enum reason, never a console
    command, regenerating api/.route-manifest.json and classified in api/.credential-proof-policy,
    with its problem types in docs/api-error-contract.md; a re-scan resets both counters and
    increments lease_epoch (the predecessor and slot checks of a reopen arrive with doc-9, since
    before it no document has a predecessor; the operator erase route ships with doc-7, so until
    then a Quarantined or ScanFailed document cannot be erased). Alarm on Quarantined and ScanFailed
    documents older than a bound. A Received row with promoted_at NULL is not claimed and does not
    burn an attempt. Add the stuck-document alarm, whose bound exceeds the outage-return horizon of
    about 7 hours, and a test for the alarm at 5 outage returns. Its sweeps follow the
    schedule-consumption obligations doc-3 owns. Test that Erased rejects a verdict from a live
    lease. The Document aggregate exposes the only readability guard, assertReadable(), which
    throws a domain exception for every state other than Ready; a use-case-level test drives it for
    each of Received, Scanning, Quarantined and ScanFailed, its problem type goes into
    docs/api-error-contract.md (make php.lint.error-contract), and doc-5's route reuses it and mints
    none of its own. The operator named by an operator-decision custody row is that row's actor, not
    a separate column. The clamd service is declared in the compose file of every environment with
    a literal json-file logging block (make php.lint.log-retention), mem_limit and memswap_limit, a
    tmpfs and core dumps disabled, and is documented in docs/deployment-guide.md. Registries and
    docs: the alarm bound for Quarantined and ScanFailed documents is fixed here, the new schedules
    and messages go into docs/architecture-api.md, and the scan accounting is distilled into the
    Documents ADR.
- id: "doc-5"
  title: Audited read path
  description: >-
    Serve a Ready document through a route that declares its voter, refuses other states and
    writes an audit row (CAP-9). Depends on doc-4. Does not serve real documents before doc-3's
    backup and restore proof exists and before doc-7 ships. An operator procedure for erasure
    requests is not a substitute: the restore proof must include replaying the erasure ledger, or
    doc-5 serves no real document. doc-5 also owns and closes issue #418: the read handler catches
    the crypto exception at the read boundary and throws a read-side exception that carries a
    marker, DekDestroyed answering the gone problem type (410, the Gone marker doc-3 introduces)
    and DecryptionFailed staying 5xx so it reaches Sentry; neither crypto exception gets a marker,
    because PiiDiffSealer shares them on the write path, where 500 is right; the type-to-status
    mapping goes into docs/api-error-contract.md in the same PR. The same PR removes the #418 row
    from the accepted-risks table in section 7 of PRODUCTION_SECURITY_CHECKLIST.md, so that register
    never points at a closed issue; that row's revisit trigger names only
    EnvelopeEncryptor::decrypt(), while a document read decrypts through
    StreamEnvelopeEncryptor::unseal().
  done_checkpoint: true
  invoke_dev_with: >-
    Mirror the hardening of ImageGetController (nosniff, locked-down CSP, no media type taken on
    trust). The route is a conscious frontier decision: voter, not a public route. A Ready document
    whose bytes are missing or fail digest verification fails closed with a defined problem type and
    an alarm, after re-reading the row: an Erased row answers the gone problem type with no alarm
    (an erasure can commit between the read's snapshot and its open). The route is always registered
    (so the route manifest, the credential-proof classification and the voter hold) and its
    controller answers 404 while a boolean parameter, documents.read_enabled (default false outside
    dev and test), is false, or the gone problem type while doc-7's ledger-override flag is set; a gate test reads the two tracked proof records (the backup and restore
    proof, and the restore drill with ledger replay; doc-3 fixes their path and format and doc-3
    and doc-7 commit theirs there) and fails when the tracked production configuration sets the
    parameter true while either is missing; a value injected by the deploy environment is a stated
    blind spot of that gate. The done checkpoint cites doc-3's proof and states that doc-7's record
    enables the route. Unless an earlier story already writes it, this is the story that first
    writes the Document audit resource type, so it classifies it non-person in
    api/.audit-resource-types (and in api/.audit-evidence-actions if the action is a string constant
    on an AuditLogger collaborator); it also regenerates api/.route-manifest.json, classifies the
    route in api/.credential-proof-policy and names its voter and Permission; its gone and integrity
    problem types go into docs/api-error-contract.md (make php.lint.error-contract); the not-ready
    refusal is doc-4's assertReadable() and this route mints no type for it. The sealed filename is
    never put in a response header: the response carries a fixed Content-Disposition: attachment with
    no filename parameter.
- id: "doc-6"
  title: Custody trail listing and document metadata
  description: >-
    List the ordered states and metadata of a document (CAP-6). Depends on doc-2 and doc-3; lands
    before erasure, which depends on it. The listing returns the original filename by opening the
    sealed column under the document's scope (SPEC); the sealed name is opened once per document,
    never per custody row, and a multi-document projection fetches the wrapped DEKs in one query per
    page with a capped page size, through a batch method this story adds to Keystore (doc-1 delivers
    only the per-scope one); an Erased document (ciphertext NULL), a destroyed scope or a
    missing scope lists no name, any other decrypt failure on a non-Erased document lists no name
    and raises an alarm (a line of the scheduled report, not a per-request error log), and none ever fails the page; a
    test plants a destroyed scope inside a page.
  invoke_dev_with: >-
    The custody listing is a route: it regenerates api/.route-manifest.json, is classified in
    api/.credential-proof-policy and names its voter and Permission, and every problem type it mints
    goes into docs/api-error-contract.md (make php.lint.error-contract). Record in
    PRODUCTION_SECURITY_CHECKLIST.md section 7 that the listing returns names with no audit row
    (CAP-9 audits byte reads only).
- id: "doc-7"
  title: Erasure by key destruction
  description: >-
    Erase a document from any non-terminal state by destroyScope(), keeping digest and custody
    (CAP-4) and delete its sealed object after commit; record the digest residual in the security
    checklist. Depends on doc-4 (states and lease), doc-6 and doc-1's tombstone fix. Blocked until
    the pending backup and restore policy (the owner's item) fixes the contract of restore.prod;
    this story then delivers the restore.prod change and the restore drill, and the ledger adapter
    itself is decided (SPEC).
  done_checkpoint: true
  invoke_dev_with: >-
    Owes a recorded adversarial pass. Implements the decided erasure ledger (properties and the
    first adapter in SPEC: an ErasureLedger port over a restic repository behind an append-only REST
    server on a second host, apart from the backup repository, whose write credentials cannot delete
    or shorten retention; restore.prod stays in recovery mode when the ledger cannot be read in
    full): written synchronously off the VPS after the voter, existence and erasable-state checks
    and before the erasure transaction and destroyScope(), holding no database lock, with a bounded
    timeout and at-least-once entries deduplicated by scope id (a failure before the entry is durable leaves the document
    untouched; a timed-out write is outcome-unknown, reported to the caller as erasure may still
    complete, and an entry that landed completes forward), completed by a per-scope sweep with an
    alarm, replayed through a separate application service (never a parameter of the use case the
    controller calls, reachable only from the restore command and the sweep, with a reflection gate test
    asserting that the classes whose constructors depend on it are exactly the restore command and
    the completion sweep handler, and a separate reason enum for the HTTP erase route that excludes
    ledger-replay and ledger-completion, with a test) that skips the ledger write (actor: the
    nil-UUID marker; reason: ledger-replay for a restore replay, ledger-completion for the sweep
    finishing an entry that landed, since the ledger holds scope ids only; no voter by construction;
    an object under a ledger scope with no row is deleted during the replay), a restore step in
    restore.prod, and a real restore drill proving the key does not return, committed as a proof
    record at the path and in the format the doc-5 gate reads. The operator erase route for a
    Quarantined or ScanFailed document ships here, behind a voter, with a closed-enum reason. The
    Erased transition, its custody row and the key destruction commit together or are re-drivable
    from a recorded intent; write a scenario for a crash at each point. The Erased compare-and-set
    also sets the sealed filename ciphertext to NULL in the same statement, and a test asserts the
    tombstone holds no name. Erased is decided by the
    aggregate's compare-and-set (no slot column exists until doc-9), never by destroyScope()'s
    boolean, and a repeat appends no custody row. The sealed object of an Erased document is deleted
    after commit by an idempotent step re-driven by a sweep, the single owner of that object: staged
    path first and then final, ENOENT tolerated on each, a row done only when neither exists,
    recorded by a nullable timestamp on the snapshot (no custody row) so the sweep does not probe
    every Erased row for ever. An alarm fires on an object older than a bound measured from the
    Erased custody row; a failed delete never rolls the erasure back. The sweep is the one deletion
    in the final namespace (besides the ledger-replay deletion) and stays disabled during a restore
    until the ledger is replayed. Its sweeps follow the schedule-consumption obligations doc-3 owns.
    The erase routes regenerate api/.route-manifest.json, are classified in
    api/.credential-proof-policy and name their voter and Permission, and every problem type they
    mint goes into docs/api-error-contract.md (make php.lint.error-contract). Record the digest,
    size and timestamps residual, the ciphertext-in-offsite-backups residual and the
    offsite-dependence residual in PRODUCTION_SECURITY_CHECKLIST.md section 7. When the ledger
    ships, update docs/vps-deployment.md (gate 3: 'Re-erase after restoring' and 'The future
    Documents module widens this') and PRODUCTION_SECURITY_CHECKLIST.md (the item 'A restore from an
    older backup resurrects keys destroyed since', which says the ledger is replicated offsite with
    the backups and now conflicts with a separate repository on a second host); find them by
    heading, line numbers rot. Run restic
    in array form through Process from the php/worker image or a sidecar (decide here), with the
    repository password and the REST credentials from environment variables or secret files, never
    the URL or argv, a sanitised exception rethrown, the write credential and repository password living on
    the VPS (the erasure writes and the sweep lists from there) with an independent copy held off
    it that the drill proves readable, whether a read-only credential can exist settled by a spike
    here (fallback: the same credential), and a documented rotation procedure (restic key remove is
    refused by an append-only repository); prove the append-only property
    the way docs/vps-deployment.md Gate 2 does (a refused restic forget, restic check, the
    production credential against the real backend); the port sits in the Documents Application
    layer and the adapter in Infrastructure. The completion sweep lists the ledger, ignores entries
    younger than the write timeout plus the transaction bound plus a margin and alarms when it
    cannot read the ledger; the erasure transaction sets lock_timeout and statement_timeout to the
    bound that margin uses, an entry's age is judged from its snapshot timestamp (the VPS clock) so
    the margin includes clock skew, and read in full means restic check --read-data exits 0 with
    no Ignoring line in the listing, confirmed by a spike rather than assumed (a deleted entry
    leaves no trace; the drill plants a corrupted one and expects recovery mode to hold). The
    ledger is a single copy (the user, 2026-11-05): losing it fails
    closed, and an explicit, documented override procedure exercised in the drill is the only way a
    restore proceeds. The override sets a database flag that doc-5's read controller checks (gone
    problem type whatever documents.read_enabled says), cleared only when a completion run has
    replayed the whole ledger and the Document-driven reconciler reports no non-Erased row whose
    scope is in it; it leaves a custody-style record (who, when, why) and the drill asserts that no
    resurrected document is served before the replay completes. Record in section 7 that whoever holds the write credential can append an
    entry for a live scope and the sweep then destroys that document with no voter, that the
    ledger is a single copy, that a deleted entry leaves no trace and that a leaked repository
    password cannot be rotated while the repository is append-only. This story delivers the tombstone reconciler, a scheduled alarm driven by Document rows
    (doc-1 removes Document scopes from the existing one): a non-Erased row whose scope is
    tombstoned is an alarm whatever the ledger says. Erasure must not wait on a scan.
    Lock order is document, then keystore. No person event on a persisted transport. Doc-9 adds the
    series operator action on top of this use case. Registries and docs: the replay-service
    reflection gate test is classified in api/.artifact-gate-placement and wired as a php.lint.*
    target; the sweeps and the ledger go into docs/architecture-api.md; the ledger design, the
    upload-intent state machine, the scan accounting and the lock order are distilled into the
    Documents ADR or docs/architecture-api.md before the spec folder is deleted.
- id: "doc-8"
  title: Dependent derivatives through the images module
  description: >-
    Create the missing origin on Image and the entry point other contexts use to materialise a
    derivative, then delete derivatives on erasure (CAP-5). Depends on doc-7. Touches
    Shared/Images, schema included.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Owes a recorded adversarial pass. Inherit docs/adr/image-deletion-signal-transport.md and
    its residuals; retries re-query by origin; late arrivals are deleted; add the orphan sweep
    and the alarm (its bound is fixed here). This is the ADR D4 rename trigger: record the decision
    on Images. Owns the end-to-end acceptance scenario of the SPEC success signal: an uploaded
    drawing is stored byte-identical, is unreadable until scanned, and after erasure leaves digest
    and custody while every derivative is gone.
- id: "doc-9"
  title: Document versioning
  description: >-
    A new version is a new immutable original linked to its predecessor, with erased nodes kept
    as readable tombstones (CAP-7). Depends on doc-5 and doc-7. The erasure semantics are decided
    (SPEC); the mechanism that refuses a second live successor is decided here.
  invoke_dev_with: >-
    Touches erasure semantics, so it owes a recorded adversarial pass. Each version is its own
    aggregate (decided); the series is a scalar id plus a read projection. Authorise the caller on
    the predecessor with a voter before sealing, and answer absent and forbidden alike. The chain is
    linear: the new-version transaction takes the new scope's keystore row and then FOR UPDATE on
    the predecessor after the new bytes are sealed (never across the stream), rechecks Ready; the
    loser of a successor race maps to a conflict and its bytes fall into the aborted-upload class.
    The size bounds of doc-3 (zero-length refusal, MAX_ORIGINAL_BYTES, the body bounds) apply to
    this path too, since it also seals. First decide the successor-exclusion mechanism and record it
    in the Documents ADR: a holds_slot flag with a partial unique index on predecessor_id and a
    locked walk-up over the contiguous Erased ancestors on every transition that takes or frees the
    slot (the verdict, cap-return, cap-sweep, operator-reopen and erasure paths of doc-4 and doc-7
    then change), or a series row whose head pointer moves by one UPDATE under the row lock (the
    assistant's lean, since it removes the walk-up). A version_no with UNIQUE (series_id,
    version_no) alone does not refuse two concurrent successors. Whichever is chosen keeps the SPEC
    properties (including the cascade that frees a contiguous run of Erased nodes when its last live
    descendant goes, series_id copied from the locked predecessor row, one winner among concurrent
    reopens, the design's lock placed in the global order with the reopen taking the predecessor or
    series before its own row, and a backfill of pre-doc-9 documents in the migration; the declare
    DTO has no predecessor field before this story); the reopen takes FOR UPDATE on the predecessor
    and refuses with a conflict when it is Erased. Tests: erase a middle node, file a sibling and
    expect a conflict; erase the only live descendant of a run of Erased nodes and file a sibling of
    the first, expect success; erase its last descendant and expect the slot free; quarantine the
    only child of an Erased node and expect the slot free; erase the predecessor of a ScanFailed
    child and expect the reopen refused; reopen a ScanFailed child whose slot a sibling holds end to
    end. Add series erasure to doc-7's use case as a repeatable operator action (each non-Erased
    version in its own transaction, newest first, reporting what remains); a person's erasure
    touches no document and anonymises references only. The new-version route regenerates
    api/.route-manifest.json, is classified in api/.credential-proof-policy and names its voter and
    Permission, and its problem types go into docs/api-error-contract.md (make
    php.lint.error-contract). The series projection orders by creation. A tombstone keeps id, digest, size, the
    retention fields (retention_reason, legal_basis, review_at), the key hash, series_id, predecessor_id, state and timestamps and nothing
    that names a person. Record the series-erasure residual in PRODUCTION_SECURITY_CHECKLIST.md
    section 7.
- id: "doc-10"
  title: OCR of scanned PDFs
  description: >-
    Extract searchable text from Ready scanned PDFs as a derivative that dies with its document
    (CAP-8). Depends on doc-4 and doc-8.
  invoke_dev_with: >-
    Reads the original through the same decrypt stream as the scanner: no plaintext on
    persistent storage (a tmpfs for tool temp files, swap off).
