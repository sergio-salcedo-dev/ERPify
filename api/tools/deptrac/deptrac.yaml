    # Published cross-context seams — the exact (importer => imported) pairs blessed
    # in api/.bounded-context-allowlist. Keep the two lists in sync.
    skip_violations:
        Erpify\Backoffice\Bank\Application\BankDeleter:
            - Erpify\Backoffice\BankAccount\Domain\Repository\BankAccountRepository
        Erpify\Backoffice\Bank\Application\BankAccountCountEnricher:
            - Erpify\Backoffice\BankAccount\Domain\Repository\BankAccountCounter
        Erpify\Backoffice\BankAccount\Application\BankAccountSearcher:
            - Erpify\Backoffice\Bank\Domain\Repository\BankExistenceChecker
            - Erpify\Backoffice\Bank\Domain\Exception\BankNotFoundException
        Erpify\Backoffice\BankAccount\Application\BankAccountCreator:
            - Erpify\Backoffice\Bank\Domain\Repository\BankExistenceChecker
        Erpify\Backoffice\BankAccount\Infrastructure\Persistence\Doctrine\DoctrineBankAccountCollectionSearchRepository:
            - Erpify\Backoffice\Bank\Domain\Entity\Bank
        Erpify\Organization\Membership\Application\GrantMembership:
            - Erpify\Organization\Organization\Domain\Repository\OrganizationRepository
        Erpify\Iam\Identity\Infrastructure\Cli\CreateInitialAdministratorCommand:
            - Erpify\Organization\Membership\Application\GrantMembership
        Erpify\Iam\Identity\Infrastructure\Security\SessionMintingSuccessListener:
            - Erpify\Iam\Session\Application\StartSession
            - Erpify\Iam\Session\Domain\Exception\SessionStoreUnavailable
            - Erpify\Organization\Membership\Application\FindUserOrganizationId
        Erpify\Iam\Invitation\Application\AcceptInvitation:
            - Erpify\Iam\Identity\Domain\Repository\UserRepository
            - Erpify\Iam\Identity\Domain\HashedPassword
            - Erpify\Iam\Identity\Domain\Enum\IdentityStatus
        Erpify\Iam\Invitation\Application\SendInvitation:
            - Erpify\Iam\Identity\Application\InviteUser
            - Erpify\Organization\Membership\Application\GrantMembership
        Erpify\Iam\Invitation\Application\ResendInvitation:
            - Erpify\Iam\Identity\Domain\Repository\UserRepository
        Erpify\Iam\Invitation\Application\RevokeInvitation:
            - Erpify\Iam\Identity\Domain\Repository\UserRepository
            - Erpify\Iam\Identity\Domain\Exception\UserNotFound
        Erpify\Iam\Invitation\Infrastructure\Http\AcceptInvitationController:
            - Erpify\Iam\Identity\Domain\HashedPassword
            - Erpify\Iam\Identity\Infrastructure\Security\PasswordHasher
            - Erpify\Iam\Identity\Infrastructure\Security\ReauthenticateDeviceBestEffort
        Erpify\Iam\Identity\Application\RevokeSessionsBestEffort:
