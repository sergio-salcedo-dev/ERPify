# Deptrac — architectural boundary gate for api/src.
#
# Enforces three orthogonal concerns in one ruleset (run via `make php.deptrac`):
#
#   1. Hexagonal layering — within every module, dependencies point inward:
#      Infrastructure -> Application -> Domain. Domain depends on nothing but the
#      shared kernel + the blessed value-object / passive-metadata namespaces.
#   2. Bounded-context isolation — a business module (e.g. Backoffice/Bank) never
#      reaches into another module's Domain/Application/Infrastructure. This is the
#      AST-aware sibling of tests/Unit/Shared/Architecture/BoundedContextGateTest.php
#      (the text-walk gate stays the primary, auto-discovering check; deptrac is
#      defence-in-depth). The published seams blessed in
#      api/.bounded-context-allowlist are mirrored in `skip_violations` below — read
#      the count off that file, never off this comment: it said "three" while the
#      allowlist held twenty-six.
#   3. External-dependency allowlist in Domain/Application (issue #301, ADR
#      docs/adr/external-dependencies-in-domain.md D4) — inner layers may only touch
#      PSR interop contracts, symfony/uid, and the passive-metadata attribute
#      namespaces (#[ORM\Mapping], #[Assert], #[Groups]); every framework with a
#      runtime (Doctrine DBAL/ORM/Persistence, Symfony beyond uid, Monolog, API
#      Platform, Guzzle, Twig, Sentry) is confined
#      to Infrastructure, each permitted only in the layers that use it. Inner-layer
#      framework usage that predates this gate is grandfathered in the baseline
#      (deptrac.baseline.yaml) — a ratchet, not a blessing.
#
# The `Shared` kernel is always importable (it is the shared kernel, never a
# bounded context), so every layer may depend on its matching Shared layer.
#
# New modules must be added here. They are still covered for cross-context by the
# auto-discovering BoundedContextGateTest even before they are listed; deptrac adds
# the layering + dependency-allowlist coverage once registered.

# Pre-existing inner-layer framework dependencies are grandfathered here (ratchet).
imports:
    - deptrac.baseline.yaml

parameters:
    # Paths resolve relative to this config file's directory (api/tools/deptrac/).
    paths:
        - ../../src
    exclude_files:
        # Anchored to real test files (a Tests/ or Test/ path segment, or a
        # *Test.php class). An unanchored substring match (#.*[Tt]est.*#) would
        # also drop production classes whose path merely contains "test" —
        # Latest, Attestation, Contest, …
        - '#(^|/)Tests?/#'
        - '#Test\.php$#'

deptrac:
    layers:
        # ---- Backoffice / Audit -------------------------------------------------
        - name: Backoffice.Audit.Domain
          collectors: [{ type: directory, value: src/Backoffice/Audit/Domain/.* }]
        - name: Backoffice.Audit.Application
          collectors: [{ type: directory, value: src/Backoffice/Audit/Application/.* }]
        - name: Backoffice.Audit.Infrastructure
          collectors: [{ type: directory, value: src/Backoffice/Audit/Infrastructure/.* }]

        # ---- Backoffice / Bank --------------------------------------------------
        - name: Backoffice.Bank.Domain
          collectors: [{ type: directory, value: src/Backoffice/Bank/Domain/.* }]
        - name: Backoffice.Bank.Application
          collectors: [{ type: directory, value: src/Backoffice/Bank/Application/.* }]
        - name: Backoffice.Bank.Infrastructure
          collectors: [{ type: directory, value: src/Backoffice/Bank/Infrastructure/.* }]

        # ---- Backoffice / BankAccount -------------------------------------------
        - name: Backoffice.BankAccount.Domain
          collectors: [{ type: directory, value: src/Backoffice/BankAccount/Domain/.* }]
        - name: Backoffice.BankAccount.Application
          collectors: [{ type: directory, value: src/Backoffice/BankAccount/Application/.* }]
        - name: Backoffice.BankAccount.Infrastructure
          collectors: [{ type: directory, value: src/Backoffice/BankAccount/Infrastructure/.* }]

        # ---- Backoffice / Health ------------------------------------------------
        - name: Backoffice.Health.Domain
          collectors: [{ type: directory, value: src/Backoffice/Health/Domain/.* }]
        - name: Backoffice.Health.Application
          collectors: [{ type: directory, value: src/Backoffice/Health/Application/.* }]
        - name: Backoffice.Health.Infrastructure
          collectors: [{ type: directory, value: src/Backoffice/Health/Infrastructure/.* }]

        # ---- Iam / Identity -----------------------------------------------------
        # Promoted out of Backoffice. Its Infrastructure/Security also holds the RBAC
        # core (Permission, AuthorizationPolicy, PermissionVoter) — parked here as a
        # physical consequence of the module move, covered by the Infrastructure layer.
        - name: Iam.Identity.Domain
          collectors: [{ type: directory, value: src/Iam/Identity/Domain/.* }]
        - name: Iam.Identity.Application
          collectors: [{ type: directory, value: src/Iam/Identity/Application/.* }]
        - name: Iam.Identity.Infrastructure
          collectors: [{ type: directory, value: src/Iam/Identity/Infrastructure/.* }]

        # ---- Iam / Invitation (skeleton — reserved namespace, no classes yet) ----
        - name: Iam.Invitation.Domain
          collectors: [{ type: directory, value: src/Iam/Invitation/Domain/.* }]
        - name: Iam.Invitation.Application
          collectors: [{ type: directory, value: src/Iam/Invitation/Application/.* }]
        - name: Iam.Invitation.Infrastructure
          collectors: [{ type: directory, value: src/Iam/Invitation/Infrastructure/.* }]

        # ---- Iam / Session (skeleton — reserved namespace, no classes yet) -------
        - name: Iam.Session.Domain
          collectors: [{ type: directory, value: src/Iam/Session/Domain/.* }]
        - name: Iam.Session.Application
          collectors: [{ type: directory, value: src/Iam/Session/Application/.* }]
        - name: Iam.Session.Infrastructure
          collectors: [{ type: directory, value: src/Iam/Session/Infrastructure/.* }]

        # ---- Organization / Organization (skeleton — no classes yet) ------------
        - name: Organization.Organization.Domain
          collectors: [{ type: directory, value: src/Organization/Organization/Domain/.* }]
        - name: Organization.Organization.Application
          collectors: [{ type: directory, value: src/Organization/Organization/Application/.* }]
        - name: Organization.Organization.Infrastructure
          collectors: [{ type: directory, value: src/Organization/Organization/Infrastructure/.* }]

        # ---- Organization / Membership (skeleton — no classes yet) --------------
        - name: Organization.Membership.Domain
          collectors: [{ type: directory, value: src/Organization/Membership/Domain/.* }]
        - name: Organization.Membership.Application
          collectors: [{ type: directory, value: src/Organization/Membership/Application/.* }]
        - name: Organization.Membership.Infrastructure
          collectors: [{ type: directory, value: src/Organization/Membership/Infrastructure/.* }]

        # ---- Frontoffice / Dev --------------------------------------------------
        - name: Frontoffice.Dev.Infrastructure
          collectors: [{ type: directory, value: src/Frontoffice/Dev/Infrastructure/.* }]

        # ---- Frontoffice / Health -----------------------------------------------
        - name: Frontoffice.Health.Infrastructure
          collectors: [{ type: directory, value: src/Frontoffice/Health/Infrastructure/.* }]

        # ---- Shared kernel (always importable; nested modules folded in) --------
        - name: Shared.Domain
          collectors: [{ type: directory, value: src/Shared/(.*/)?Domain/.* }]
        - name: Shared.Application
          collectors: [{ type: directory, value: src/Shared/(.*/)?Application/.* }]
        - name: Shared.Infrastructure
          collectors: [{ type: directory, value: src/Shared/(.*/)?Infrastructure/.* }]

        # ---- Allowed external dependencies for inner layers ---------------------
        # PSR interop contracts (interface-only) and symfony/uid value objects.
        # classLike values are unanchored regexes — anchor with ^ so a vendor name
        # appearing mid-FQCN (e.g. our own ...\Persistence\Doctrine\Foo) is not
        # swept into the vendor layer.
        - name: Vendor.Psr
          collectors: [{ type: classLike, value: ^Psr\\.* }]
        - name: Vendor.SymfonyUid
          collectors: [{ type: classLike, value: ^Symfony\\Component\\Uid\\.* }]
        # Passive-metadata attributes blessed by docs/rules/architecture.md: ORM
        # mapping, column-type constants, validation constraints.
        #
        # Serializer attributes (Symfony\Component\Serializer\Attribute) are NOT admitted
        # inward: per-view Resource DTOs own the wire contract (ADR docs/adr/api-resource-dtos.md),
        # so the serializer never reads attributes off a Domain/Application class. The mapper
        # pre-formats timestamps to ATOM strings in Infrastructure and ResourceDtoContractTest
        # enforces flat scalar-only DTOs, so no #[Serializer\Context] format pin survives inward.
        # The namespace therefore falls through to Vendor.Symfony (Infrastructure-only) — any new
        # inward use fails. Keep in sync with external-dependencies-in-domain.md D4.
        - name: Vendor.PassiveMetadata
          collectors:
              - type: classLike
                value: >-
                    ^(Doctrine\\ORM\\Mapping|Doctrine\\DBAL\\Types|Symfony\\Component\\Validator\\Constraints|Symfony\\Bridge\\Doctrine\\Validator\\Constraints)\\.*
              # Three exact classes, anchored: the surrounding regex blesses the
              # Constraints NAMESPACE, so its own base class and the two types the
              # attribute API forces you to name were left out by accident of shape,
              # not by decision. Anchors are load-bearing — unanchored,
              # `…\Validator\Constraint` also swallows ConstraintViolation and its
              # List/Interface siblings, which are runtime results and must stay out.
              #   - Constraint: the base class a first-party constraint extends
              #     (Shared\Validation\Domain\EnumType).
              #   - HasNamedArguments: mandatory on a constraint with a promoted
              #     constructor; carries no behaviour.
              #   - ExecutionContextInterface: the parameter signature #[Assert\Callback]
              #     obliges the callback to declare. The attribute is already blessed;
              #     blessing it without the type it forces is half a decision.
              - type: classLike
                value: >-
                    ^Symfony\\Component\\Validator\\(Constraint|Attribute\\HasNamedArguments|Context\\ExecutionContextInterface)$

        # ---- Framework vendors confined to Infrastructure (ADR Cat-1) -----------
        - name: Vendor.Doctrine
          collectors:
              - type: bool
                must: [{ type: classLike, value: ^Doctrine\\.* }]
                must_not: [{ type: layer, value: Vendor.PassiveMetadata }]
        - name: Vendor.Symfony
          collectors:
              - type: bool
                must: [{ type: classLike, value: ^Symfony\\.* }]
                must_not:
                    - { type: layer, value: Vendor.SymfonyUid }
                    - { type: layer, value: Vendor.PassiveMetadata }
        - name: Vendor.Monolog
          collectors: [{ type: classLike, value: ^Monolog\\.* }]
        - name: Vendor.ApiPlatform
          collectors: [{ type: classLike, value: ^ApiPlatform\\.* }]
        - name: Vendor.Guzzle
          collectors: [{ type: classLike, value: ^GuzzleHttp\\.* }]
        - name: Vendor.Twig
          collectors: [{ type: classLike, value: ^Twig\\.* }]
        - name: Vendor.Sentry
          collectors: [{ type: classLike, value: ^Sentry\\.* }]

    ruleset:
        # Domain rule is identical for every module: only the shared-kernel Domain
        # and the blessed external namespaces. No sibling layer, no framework runtime.
        Backoffice.Bank.Domain: &domain
            - Shared.Domain
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
        Backoffice.Audit.Domain: *domain
        Backoffice.BankAccount.Domain: *domain
        Backoffice.Health.Domain: *domain
        Iam.Identity.Domain: *domain
        Iam.Invitation.Domain: *domain
        Iam.Session.Domain: *domain
        Organization.Organization.Domain: *domain
        Organization.Membership.Domain: *domain
        Shared.Domain: *domain

        # Application may orchestrate its own Domain + the shared kernel, plus the
        # declarative-validation / serializer attribute namespaces (Assert on DTOs).
        Backoffice.Bank.Application:
            - Backoffice.Bank.Domain
            - Shared.Domain
            - Shared.Application
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
        Backoffice.Audit.Application:
            - Backoffice.Audit.Domain
            - Shared.Domain
            - Shared.Application
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
        Backoffice.BankAccount.Application:
            - Backoffice.BankAccount.Domain
            - Shared.Domain
            - Shared.Application
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
        Backoffice.Health.Application:
            - Backoffice.Health.Domain
            - Shared.Domain
            - Shared.Application
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
        Iam.Identity.Application:
            - Iam.Identity.Domain
            - Shared.Domain
            - Shared.Application
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
        Iam.Invitation.Application:
            - Iam.Invitation.Domain
            - Shared.Domain
            - Shared.Application
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
        Iam.Session.Application:
            - Iam.Session.Domain
            - Shared.Domain
            - Shared.Application
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
        Organization.Organization.Application:
            - Organization.Organization.Domain
            - Shared.Domain
            - Shared.Application
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
        Organization.Membership.Application:
            - Organization.Membership.Domain
            - Shared.Domain
            - Shared.Application
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
        Shared.Application:
            - Shared.Domain
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata

        # Infrastructure wires the framework: it may use its own Domain + Application,
        # the whole shared kernel, and every framework vendor.
        Backoffice.Bank.Infrastructure: &infra
            - Backoffice.Bank.Domain
            - Backoffice.Bank.Application
            - Shared.Domain
            - Shared.Application
            - Shared.Infrastructure
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
            - Vendor.Doctrine
            - Vendor.Symfony
            - Vendor.Monolog
            - Vendor.ApiPlatform
            - Vendor.Guzzle
        Backoffice.Audit.Infrastructure:
            - Backoffice.Audit.Domain
            - Backoffice.Audit.Application
            - Shared.Domain
            - Shared.Application
            - Shared.Infrastructure
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
            - Vendor.Doctrine
            - Vendor.Symfony
            - Vendor.Monolog
            - Vendor.ApiPlatform
            - Vendor.Guzzle
        Backoffice.BankAccount.Infrastructure:
            - Backoffice.BankAccount.Domain
            - Backoffice.BankAccount.Application
            - Shared.Domain
            - Shared.Application
            - Shared.Infrastructure
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
            - Vendor.Doctrine
            - Vendor.Symfony
            - Vendor.Monolog
            - Vendor.ApiPlatform
            - Vendor.Guzzle
        Backoffice.Health.Infrastructure:
            - Backoffice.Health.Domain
            - Backoffice.Health.Application
            - Shared.Domain
            - Shared.Application
            - Shared.Infrastructure
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
            - Vendor.Doctrine
            - Vendor.Symfony
            - Vendor.Monolog
            - Vendor.ApiPlatform
            - Vendor.Guzzle
        Iam.Identity.Infrastructure:
            - Iam.Identity.Domain
            - Iam.Identity.Application
            - Shared.Domain
            - Shared.Application
            - Shared.Infrastructure
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
            - Vendor.Doctrine
            - Vendor.Symfony
            - Vendor.Monolog
            - Vendor.ApiPlatform
            - Vendor.Guzzle
        Iam.Invitation.Infrastructure:
            - Iam.Invitation.Domain
            - Iam.Invitation.Application
            - Shared.Domain
            - Shared.Application
            - Shared.Infrastructure
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
            - Vendor.Doctrine
            - Vendor.Symfony
            - Vendor.Monolog
            - Vendor.ApiPlatform
            - Vendor.Guzzle
        Iam.Session.Infrastructure:
            - Iam.Session.Domain
            - Iam.Session.Application
            - Shared.Domain
            - Shared.Application
            - Shared.Infrastructure
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
            - Vendor.Doctrine
            - Vendor.Symfony
            - Vendor.Monolog
            - Vendor.ApiPlatform
            - Vendor.Guzzle
        Organization.Organization.Infrastructure:
            - Organization.Organization.Domain
            - Organization.Organization.Application
            - Shared.Domain
            - Shared.Application
            - Shared.Infrastructure
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
            - Vendor.Doctrine
            - Vendor.Symfony
            - Vendor.Monolog
            - Vendor.ApiPlatform
            - Vendor.Guzzle
        Organization.Membership.Infrastructure:
            - Organization.Membership.Domain
            - Organization.Membership.Application
            - Shared.Domain
            - Shared.Application
            - Shared.Infrastructure
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
            - Vendor.Doctrine
            - Vendor.Symfony
            - Vendor.Monolog
            - Vendor.ApiPlatform
            - Vendor.Guzzle
        Frontoffice.Dev.Infrastructure:
            - Shared.Domain
            - Shared.Application
            - Shared.Infrastructure
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
            - Vendor.Doctrine
            - Vendor.Symfony
            - Vendor.Monolog
            - Vendor.ApiPlatform
            - Vendor.Guzzle
            - Vendor.Twig
        Frontoffice.Health.Infrastructure:
            - Shared.Domain
            - Shared.Application
            - Shared.Infrastructure
            - Vendor.Psr
            - Vendor.SymfonyUid
            - Vendor.PassiveMetadata
            - Vendor.Doctrine
            - Vendor.Symfony
            - Vendor.Monolog
            - Vendor.ApiPlatform
            - Vendor.Guzzle
        Shared.Infrastructure:
            - Shared.Domain
            - Shared.Application
            - Vendor.Psr
