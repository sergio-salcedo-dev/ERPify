# Deptrac baseline — pre-existing inner-layer framework dependencies, grandfathered.
#
# GENERATED — regenerate with `make php.deptrac.baseline` (do not hand-edit; the
# regen strips cross-context seams and re-prepends this header). Each entry is a
# Domain/Application class touching a framework runtime the architecture confines to
# Infrastructure (ADR docs/adr/external-dependencies-in-domain.md, issue #301). They
# predate the gate; it stays green today and fails on any NEW inner-layer leak.
# Paying this down is tracked in issue #305.
#
# Published cross-context seams are NOT here — they live in `skip_violations` in
# deptrac.yaml (mirror of api/.bounded-context-allowlist). A new cross-context import
# must FAIL the gate, never be grandfathered; that is why regen strips seam targets
# (Erpify\Backoffice\* / Erpify\Frontoffice\*) back out of this file.
deptrac:
  skip_violations:
    Erpify\Backoffice\BankAccount\Application\BankAccountSearcher:
      - Symfony\Component\Messenger\Exception\ExceptionInterface
      - Symfony\Component\Messenger\MessageBusInterface
    Erpify\Backoffice\BankAccount\Domain\Entity\BankAccount:
      - Erpify\Shared\Infrastructure\Validator\EnumType
      - Symfony\Component\Serializer\Normalizer\DateTimeNormalizer
    Erpify\Backoffice\Bank\Application\BankCreator:
      - Symfony\Component\Messenger\MessageBusInterface
    Erpify\Backoffice\Bank\Application\BankDeleter:
      - Doctrine\DBAL\Exception\ForeignKeyConstraintViolationException
      - Symfony\Component\Messenger\Exception\ExceptionInterface
      - Symfony\Component\Messenger\MessageBusInterface
    Erpify\Backoffice\Bank\Application\BankUpdater:
      - Symfony\Component\Messenger\Exception\ExceptionInterface
      - Symfony\Component\Messenger\MessageBusInterface
      - Symfony\Component\Validator\Exception\ValidationFailedException
    Erpify\Backoffice\Bank\Domain\Entity\Bank:
      - Symfony\Component\Serializer\Normalizer\DateTimeNormalizer
      - Symfony\Component\Validator\Context\ExecutionContextInterface
    Erpify\Shared\Application\Http\Search\FilterQuery:
      - Symfony\Component\Validator\Context\ExecutionContextInterface
    Erpify\Shared\Application\Http\Search\SearchQuery:
      - Symfony\Component\Validator\Context\ExecutionContextInterface
    Erpify\Shared\Application\Problem\ProblemDetailsFactory:
      - Symfony\Component\DependencyInjection\Attribute\Autowire
      - Symfony\Component\HttpFoundation\Response
      - Symfony\Component\HttpKernel\Exception\HttpExceptionInterface
      - Symfony\Component\Security\Core\Exception\AccessDeniedException
      - Symfony\Component\Security\Core\Exception\AuthenticationException
      - Symfony\Component\Validator\ConstraintViolationInterface
      - Symfony\Component\Validator\Exception\ValidationFailedException
    Erpify\Shared\Application\Validation\Validator:
      - Symfony\Component\Validator\Constraint
      - Symfony\Component\Validator\ConstraintViolation
      - Symfony\Component\Validator\ConstraintViolationList
      - Symfony\Component\Validator\ConstraintViolationListInterface
      - Symfony\Component\Validator\Exception\ValidationFailedException
      - Symfony\Component\Validator\Validator\ValidatorInterface
    Erpify\Shared\Domain\Aggregate\AggregateRoot:
      - Symfony\Component\Serializer\Normalizer\DateTimeNormalizer
    Erpify\Shared\Domain\Entity\Timestamped:
      - Symfony\Component\Serializer\Normalizer\DateTimeNormalizer
    Erpify\Shared\Media\Domain\Entity\Media:
      - Symfony\Component\Serializer\Normalizer\DateTimeNormalizer
    Erpify\Shared\Storage\Application\StoredObjectOrphanCleaner:
      - Symfony\Component\DependencyInjection\Attribute\AutowireIterator
