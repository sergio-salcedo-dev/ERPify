# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that do not need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    api.name: erpify

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Erpify\:
        resource: '../src/'
        exclude:
            - '../src/{DependencyInjection,Migrations,Tests,Kernel.php}'
            - '../src/**/Domain/Entity/'

    # Domain logging port → its single PSR-3 (Monolog) binding on the default `app` channel.
    # Explicit alias because the port has a second implementation in the container (the no-op
    # NullLogger in Domain), so the singly-implemented-interface autowiring alias does not apply.
    Erpify\Shared\Domain\Logging\Logger: '@Erpify\Shared\Infrastructure\Logging\PsrLogger'

    # observability-channel logger as a domain port: wraps the dedicated always-on Monolog channel
    # so the cursor-pagination metric lines never hit the prod `fingers_crossed` `app` handler.
    erpify.logging.observability:
        class: Erpify\Shared\Infrastructure\Logging\PsrLogger
        arguments:
            $logger: '@monolog.logger.observability'
