# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that do not need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    api.name: erpify

    # Shared/Images canonicalization pipeline (Story 1.1) — deployment defaults, not domain
    # requirements. Starting points only: not yet validated against a memory/CPU benchmark of the
    # real worker (see the story's Task 5 for the reasoning: pixel count alone does not fix the
    # memory cost, which also depends on bytes-per-pixel and the decoder's own intermediate
    # buffers).
    erpify.images.max_input_bytes: 20971520 # ~20 MB, strlen($bytes) received by ImageProcessor
    erpify.images.max_decoded_pixels: 40000000 # ~40 megapixels (e.g. 8000x5000), declared width*height
    erpify.images.max_input_dimension: 10000 # px, either declared side
    erpify.images.max_output_dimension: 4096 # px, either side of the canonical output
    erpify.images.encoding_quality: 85 # 0-100, jpeg/webp encoders only

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Every projector is collected into the ProjectionRunner's tagged iterator (the tag keeps the
    # AutowireIterator attribute out of the Application layer).
    _instanceof:
        Erpify\Shared\Event\Application\Projector:
            tags: ['erpify.projector']

        # Same shape for the person-reference sources the detective reconciler enumerates: an owning
        # context joins the control by implementing the contract, never by editing the reconciler.
        Erpify\Shared\Privacy\Application\PersonReferenceSource:
            tags: ['erpify.person_reference_source']

    Erpify\:
        resource: '../src/'
        exclude:
            - '../src/{DependencyInjection,Migrations,Tests,Kernel.php}'
            - '../src/**/Domain/Entity/'

    Erpify\Shared\Event\Application\ProjectionRunner:
        arguments:
            $projectors: !tagged_iterator erpify.projector

    Erpify\Iam\Identity\Application\ReconcileErasedSubjectReferences:
        arguments:
            $personReferenceSources: !tagged_iterator erpify.person_reference_source

    # These two swallow a failed `security` audit projection and report it, and the report is worth nothing
    # on the default channel: in prod that is a `fingers_crossed` handler which discards the buffer unless the
    # response is a 5xx, and these paths answer 202 and 401 by design — swallowing is the point. `observability`
    # is the always-on stream, excluded from the buffered handler by name.
    #
    # Bound here rather than with `#[Autowire]` at the parameter, which is how their `Infrastructure` sibling
    # `SymfonyAuditLogger` does it: these are `Application` classes, and deptrac refuses that layer a
    # dependency on the DI container's attributes. Wiring is configuration, so it lives in configuration.
    # `BestEffortReportChannelGateTest` holds both spellings to the same rule.
    Erpify\Iam\Identity\Application\RecordLockoutAuditBestEffort:
        arguments:
            $logger: '@monolog.logger.observability'

    Erpify\Iam\Identity\Application\RecordRecoveryThrottleAuditBestEffort:
        arguments:
            $logger: '@monolog.logger.observability'

    # Same rule, same reason, for the rest of the `Application` best-effort reporters: each swallows a failure
    # its caller must survive — a revoked session, a mail that did not go out — and the report is the only
    # trace it leaves. On the default channel prod discards it, because `fingers_crossed` activates on the
    # RECORD'S LEVEL and these paths answer 2xx by design.
    #
    # The channel decides arrival, not the level: `observability` admits from `info`, so each class keeps the
    # level that says what its line means. On the default channel the level would decide instead, and both of
    # its answers are wrong — below `error` the line is discarded, at `error` it arrives by flushing the
    # request's other records.
    Erpify\Iam\Identity\Application\RevokeSessionsBestEffort:
        arguments:
            $logger: '@monolog.logger.observability'

    Erpify\Iam\Identity\Application\SendAccountLockedEmailBestEffort:
        arguments:
            $logger: '@monolog.logger.observability'

    Erpify\Iam\Identity\Application\SendPasswordChangedEmailBestEffort:
        arguments:
            $logger: '@monolog.logger.observability'

    Erpify\Iam\Identity\Application\SendPasswordResetEmailBestEffort:
        arguments:
            $logger: '@monolog.logger.observability'

    Erpify\Iam\Invitation\Application\SendInvitationEmailBestEffort:
        arguments:
            $logger: '@monolog.logger.observability'

    # The dead-letter reader inspects the failure transport; bind the concrete `failed` transport
    # (autowiring cannot pick one receiver among many).
    Erpify\Shared\Event\Infrastructure\Messenger\MessengerDeadLetterReader:
        arguments:
            $failedTransport: '@messenger.transport.failed'

    # Untargeted on purpose: the tag with no `handler` or `channel` attribute makes `AddProcessorsPass`
    # push the processor onto every channel logger, which is the point — the fields these redact are
    # written by the framework as readily as by our own code, so naming the channels that carry them today
    # would date on the next library that adopts the convention. A logger processor also runs BEFORE any
    # handler sees the record, which is what keeps the redaction ahead of the `fingers_crossed` buffer and
    # ahead of the handler-scoped `PsrLogMessageProcessor` that interpolates the message.
    #
    # The tag is not redundant, and the reason is worth the four lines. `MonologExtension` calls
    # `registerForAutoconfiguration(ProcessorInterface::class)`, so autoconfiguration alone already enrols
    # every class here implementing that interface — but the two mechanisms are INDEPENDENT, and an
    # explicit tag survives what switches autoconfiguration off. Measured against the compiled prod
    # container, over a purged cache on every arm: tag + autoconfiguration → 14 `pushProcessor` sites; tag
    # with `autoconfigure: false` → 14; no definition at all → 14; tag removed AND `autoconfigure: false`
    # → 0. Enrolment IS the control these two classes exist to provide, so it is written where a reader
    # looks for it rather than left to a framework default a later `_defaults` edit could switch off.
    Erpify\Shared\Monitoring\Infrastructure\Monolog\RequestUriRedactionProcessor:
        tags: ['monolog.processor']

    Erpify\Shared\Monitoring\Infrastructure\Monolog\PersonDataRedactionProcessor:
        tags: ['monolog.processor']

    Erpify\Shared\Monitoring\Infrastructure\Monolog\ConsoleCommandRedactionProcessor:
        tags: ['monolog.processor']
