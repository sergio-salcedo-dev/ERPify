# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that do not need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    api.name: erpify

    # Shared/Images canonicalization pipeline — deployment defaults, not domain requirements. The
    # pixel ceiling and `memory_limit` were benchmarked together against the real worker and are now
    # ONE decision, held by `ImagePixelBudgetGateTest`; the other three are still starting points.
    # Pixel count alone does not fix the memory cost — it also depends on bytes-per-pixel and on the
    # decoder's own intermediate buffers, which is why the two numbers are gated as a pair rather
    # than reasoned about separately.
    erpify.images.max_input_bytes: 20971520 # ~20 MB, strlen($bytes) received by ImageProcessor
    # Measured, not chosen: the pipeline peaks at roughly 10 bytes per INPUT pixel (GD holds a truecolor
    # frame at 4 B/px and `ResizeModifier` clones it), so this ceiling and `memory_limit` are ONE decision.
    # At 20 MP the worst measured format peaks at 191 MiB against the 256 MiB budget; at 40 MP a PNG is a
    # FATAL error, which in worker mode takes the worker down and produces no Problem Details at all. 20 MP
    # covers every phone camera, and the canonical output is capped at 4096 px per side regardless.
    erpify.images.max_decoded_pixels: 20000000 # ~20 megapixels (e.g. 5000x4000), declared width*height
    # Deliberately NOT lowered alongside the pixel ceiling: measured, a 10000x2000 panorama is 20 MP and
    # peaks at 145 MiB, so the side length bounds nothing the pixel count does not already bound. Lowering it
    # would refuse a legitimate shape for no measured reason.
    erpify.images.max_input_dimension: 10000 # px, either declared side
    erpify.images.max_output_dimension: 4096 # px, either side of the canonical output
    erpify.images.encoding_quality: 85 # 0-100, jpeg/webp encoders only

    # The read path's serving budget: the largest object `CanonicalImageFinder` will materialise, checked
    # against the size the row declares BEFORE any byte is fetched. Separate from `max_input_bytes`, which
    # bounds untrusted input to the processor: the two govern different risks, and coupling them would make
    # lowering the upload limit silently unservable every image already stored above the new value.
    #
    # DERIVED, not chosen, and it has to be. It must admit everything the pipeline can legitimately emit or
    # an image becomes storable and then permanently unservable — 500 for ever, indistinguishable from a
    # broken deployment, and created at ingest but answered at read where nothing can act on it. A hand-
    # picked 20 MB did exactly that: measured, a palette PNG of 4472x4472 weighing 8.85 MiB canonicalises to
    # 49.23 MiB. The floor is `max_output_dimension x (max_output_dimension x 4 + 1)` — 4 bytes per pixel
    # plus PNG's filter byte per scanline, with deflate adding rather than removing on incompressible data —
    # which is 64.0 MiB at 4096 px and, note, slightly ABOVE a round 64 MiB rather than equal to it.
    #
    # The ceiling is `memory_limit`: the port returns the whole object as one string, and exhausting the
    # limit is a FATAL error rather than a `Throwable`, so the RFC 9457 pipeline never runs and the response
    # is not Problem Details at all. `ImagePixelBudgetGateTest` holds both ends and refuses a commit that
    # moves this, `max_output_dimension` or `memory_limit` without the others still fitting.
    erpify.images.max_served_bytes: 71303168 # 68 MiB, Image::byteSize() of the stored canonical object

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Every projector is collected into the ProjectionRunner's tagged iterator (the tag keeps the
    # AutowireIterator attribute out of the Application layer).
    _instanceof:
        Erpify\Shared\Event\Application\Projector:
            tags: ['erpify.projector']

        # Same shape for the person-reference sources the detective reconciler enumerates: an owning
        # context joins the control by implementing the contract, never by editing the reconciler.
        Erpify\Shared\Privacy\Application\PersonReferenceSource:
            tags: ['erpify.person_reference_source']

    Erpify\:
        resource: '../src/'
        exclude:
            - '../src/{DependencyInjection,Migrations,Tests,Kernel.php}'
            - '../src/**/Domain/Entity/'

    Erpify\Shared\Event\Application\ProjectionRunner:
        arguments:
            $projectors: !tagged_iterator erpify.projector

    Erpify\Iam\Identity\Application\ReconcileErasedSubjectReferences:
        arguments:
            $personReferenceSources: !tagged_iterator erpify.person_reference_source

    # Each of these swallows a failed `security` audit projection and reports it, and the report is worth
    # nothing on the default channel: in prod that is a `fingers_crossed` handler which discards the buffer
    # unless a record at `error` or above fires it. Not one of these paths produces such a record — they end
    # in a 201, a 202, a 204, an opaque 400, a 401, or in a scheduled tick with no response at all — because
    # swallowing is the whole point: a lost projection must never turn a login refusal, a maintenance sweep or
    # a committed recovery-secret write into a 500. `observability` is the always-on stream, excluded from the
    # buffered handler by name. The membership is deliberately described by that rule rather than counted: a
    # tally here is a claim that goes stale the next time one is added, silently, with every gate green.
    #
    # Bound here rather than with `#[Autowire]` at the parameter, which is how their `Infrastructure` sibling
    # `SymfonyAuditLogger` does it: these are `Application` classes, and deptrac refuses that layer a
    # dependency on the DI container's attributes. Wiring is configuration, so it lives in configuration.
    # `BestEffortReportChannelGateTest` holds both spellings to the same rule.
    Erpify\Iam\Identity\Application\RecordLockoutAuditBestEffort:
        arguments:
            $logger: '@monolog.logger.observability'

    Erpify\Iam\Identity\Application\RecordLockoutNoticeAuditBestEffort:
        arguments:
            $logger: '@monolog.logger.observability'

    Erpify\Iam\Identity\Application\RecordRecoveryThrottleAuditBestEffort:
        arguments:
            $logger: '@monolog.logger.observability'

    Erpify\Iam\Identity\Application\RecordRecoverySecretAuditBestEffort:
        arguments:
            $logger: '@monolog.logger.observability'

    # Same rule, same reason, for the rest of the `Application` best-effort reporters: each swallows a failure
    # its caller must survive — a revoked session, a mail that did not go out — and the report is the only
    # trace it leaves. On the default channel prod discards it, because `fingers_crossed` activates on the
    # RECORD'S LEVEL and these paths answer 2xx by design.
    #
    # The channel decides arrival, not the level: `observability` admits from `info`, so each class keeps the
    # level that says what its line means. On the default channel the level would decide instead, and both of
    # its answers are wrong — below `error` the line is discarded, at `error` it arrives by flushing the
    # request's other records.
    Erpify\Iam\Identity\Application\RevokeSessionsBestEffort:
        arguments:
            $logger: '@monolog.logger.observability'

    Erpify\Iam\Identity\Application\RevokeCurrentSessionBestEffort:
        arguments:
            $logger: '@monolog.logger.observability'

    Erpify\Iam\Identity\Application\SendAccountLockedEmailBestEffort:
        arguments:
            $logger: '@monolog.logger.observability'

    Erpify\Iam\Identity\Application\SendPasswordChangedEmailBestEffort:
        arguments:
            $logger: '@monolog.logger.observability'

    Erpify\Iam\Identity\Application\SendPasswordResetEmailBestEffort:
        arguments:
            $logger: '@monolog.logger.observability'

    Erpify\Iam\Invitation\Application\SendInvitationEmailBestEffort:
        arguments:
            $logger: '@monolog.logger.observability'

    # Same rule again, and this one reports on a path that answers 5xx as well as one that answers 2xx. The
    # channel is what makes both arrive: the 5xx case would flush the buffered handler anyway, but the
    # oversize refusal and the digest mismatch must be readable on their own, not as a side effect of
    # whatever else the request happened to log.
    Erpify\Shared\Images\Application\ReadFailureReporter:
        arguments:
            $logger: '@monolog.logger.observability'

    # Bound here rather than with `#[Autowire(param: …)]` for the reason its `Infrastructure` siblings can
    # use the attribute and this class cannot: deptrac refuses `Application` a dependency on the container's
    # attributes. Wiring is configuration, so it lives in configuration.
    Erpify\Shared\Images\Application\CanonicalImageFinder:
        arguments:
            $maxServedBytes: '%erpify.images.max_served_bytes%'

    # The dead-letter reader inspects the failure transport; bind the concrete `failed` transport
    # (autowiring cannot pick one receiver among many).
    Erpify\Shared\Event\Infrastructure\Messenger\MessengerDeadLetterReader:
        arguments:
            $failedTransport: '@messenger.transport.failed'

    # Untargeted on purpose: the tag with no `handler` or `channel` attribute makes `AddProcessorsPass`
    # push the processor onto every channel logger, which is the point — the fields these redact are
    # written by the framework as readily as by our own code, so naming the channels that carry them today
    # would date on the next library that adopts the convention. A logger processor also runs BEFORE any
    # handler sees the record, which is what keeps the redaction ahead of the `fingers_crossed` buffer and
    # ahead of the handler-scoped `PsrLogMessageProcessor` that interpolates the message.
    #
    # The tag is not redundant, and the reason is worth the four lines. `MonologExtension` calls
    # `registerForAutoconfiguration(ProcessorInterface::class)`, so autoconfiguration alone already enrols
    # every class here implementing that interface — but the two mechanisms are INDEPENDENT, and an
    # explicit tag survives what switches autoconfiguration off. Measured against the compiled prod
    # container, over a purged cache on every arm: tag + autoconfiguration → 14 `pushProcessor` sites; tag
    # with `autoconfigure: false` → 14; no definition at all → 14; tag removed AND `autoconfigure: false`
    # → 0. Enrolment IS the control these two classes exist to provide, so it is written where a reader
    # looks for it rather than left to a framework default a later `_defaults` edit could switch off.
    Erpify\Shared\Monitoring\Infrastructure\Monolog\RequestUriRedactionProcessor:
        tags: ['monolog.processor']

    Erpify\Shared\Monitoring\Infrastructure\Monolog\PersonDataRedactionProcessor:
        tags: ['monolog.processor']

    Erpify\Shared\Monitoring\Infrastructure\Monolog\ConsoleCommandRedactionProcessor:
        tags: ['monolog.processor']
