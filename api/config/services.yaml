# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that do not need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    api.name: erpify

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Every projector is collected into the ProjectionRunner's tagged iterator (the tag keeps the
    # AutowireIterator attribute out of the Application layer).
    _instanceof:
        Erpify\Shared\Event\Application\Projector:
            tags: ['erpify.projector']

    Erpify\:
        resource: '../src/'
        exclude:
            - '../src/{DependencyInjection,Migrations,Tests,Kernel.php}'
            - '../src/**/Domain/Entity/'

    Erpify\Shared\Event\Application\ProjectionRunner:
        arguments:
            $projectors: !tagged_iterator erpify.projector

    # The dead-letter reader inspects the failure transport; bind the concrete `failed` transport
    # (autowiring cannot pick one receiver among many).
    Erpify\Shared\Event\Infrastructure\Messenger\MessengerDeadLetterReader:
        arguments:
            $failedTransport: '@messenger.transport.failed'
