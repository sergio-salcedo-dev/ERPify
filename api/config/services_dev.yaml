services:
    _defaults:
        autowire: true
        autoconfigure: true

    Erpify\Tests\DataFixtures\:
        resource: '../tests/DataFixtures/*'
        # EventBackbonePurger is constructed by its factory, never resolved from the container: its
        # `$inner` is the purger the bundle just created for a given purge mode, so autowiring it as a
        # service asks for a PurgerInterface no service provides. Left in, any command that boots the
        # dev kernel dies in `DefinitionErrorExceptionPass` — `make php.lint.yaml` is where it surfaces,
        # since that target runs `bin/console lint:yaml` and compiling the container precedes it.
        exclude: '../tests/DataFixtures/Purger/EventBackbonePurger.php'
