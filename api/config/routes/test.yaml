# Story 1.4 — test-only routes wiring throwaway controllers under /api/test/_throw-* so the
# ExceptionResponder listener is exercised through a real Symfony kernel via WebTestCase.
when@test:
    test_throw_not_found:
        path: /api/test/_throw-not-found
        controller: Erpify\Tests\Functional\Shared\Infrastructure\Http\EventListener\Fixtures\ThrowNotFoundController
        methods: [GET]

    test_throw_runtime:
        path: /api/test/_throw-runtime
        controller: Erpify\Tests\Functional\Shared\Infrastructure\Http\EventListener\Fixtures\ThrowRuntimeController
        methods: [GET]

    # Story 1.5 — Symfony framework exception bridges.
    test_throw_http_403:
        path: /api/test/_throw-http-403
        controller: Erpify\Tests\Functional\Shared\Infrastructure\Http\EventListener\Fixtures\ThrowHttpForbiddenController
        methods: [GET]

    test_throw_http_401:
        path: /api/test/_throw-http-401
        controller: Erpify\Tests\Functional\Shared\Infrastructure\Http\EventListener\Fixtures\ThrowHttpUnauthorizedController
        methods: [GET]

    test_throw_http_410:
        path: /api/test/_throw-http-410
        controller: Erpify\Tests\Functional\Shared\Infrastructure\Http\EventListener\Fixtures\ThrowHttpGoneController
        methods: [GET]

    test_throw_security_access_denied:
        path: /api/test/_throw-security-access-denied
        controller: Erpify\Tests\Functional\Shared\Infrastructure\Http\EventListener\Fixtures\ThrowSecurityAccessDeniedController
        methods: [GET]

    test_throw_security_authentication:
        path: /api/test/_throw-security-authentication
        controller: Erpify\Tests\Functional\Shared\Infrastructure\Http\EventListener\Fixtures\ThrowSecurityAuthenticationController
        methods: [GET]

    # Story 1.6 — ValidationFailedException violations[] coverage.
    test_throw_validation:
        path: /api/test/_throw-validation
        controller: Erpify\Tests\Functional\Shared\Infrastructure\Http\EventListener\Fixtures\ThrowValidationFailedController
        methods: [GET]

    test_throw_validation_empty:
        path: /api/test/_throw-validation-empty
        controller: Erpify\Tests\Functional\Shared\Infrastructure\Http\EventListener\Fixtures\ThrowValidationFailedEmptyController
        methods: [GET]

    test_throw_validation_with_sensitive_payload:
        path: /api/test/_throw-validation-with-sensitive-payload
        controller: Erpify\Tests\Functional\Shared\Infrastructure\Http\EventListener\Fixtures\ThrowValidationFailedSensitivePayloadController
        methods: [GET]

    test_throw_validation_template:
        path: /api/test/_throw-validation-template
        controller: Erpify\Tests\Functional\Shared\Infrastructure\Http\EventListener\Fixtures\ThrowValidationFailedTemplateController
        methods: [GET]

    test_throw_invariant_violation:
        path: /api/test/_throw-invariant-violation
        controller: Erpify\Tests\Functional\Shared\Infrastructure\Http\EventListener\Fixtures\ThrowInvariantViolationDomainExceptionController
        methods: [GET]

    # Story 3.2 — denylisted context keys (password, token) must be stripped from the body.
    test_throw_denylisted_context:
        path: /api/test/_throw-denylisted-context
        controller: Erpify\Tests\Functional\Shared\Infrastructure\Http\EventListener\Fixtures\ThrowDenylistedContextController
        methods: [GET]
