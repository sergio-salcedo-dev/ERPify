# API v1 — attribute routes from every bounded context under src/ (e.g. Backoffice/*/Infrastructure/Controller/).
# Classes with #[Route] receive controller.service_arguments via FrameworkBundle autoconfiguration.
api_v1_back_office:
    resource: ../src/Backoffice/
    type: attribute
    prefix: /api/v1/backoffice
    defaults:
        _format: json

# Iam is a top-level context, but the backoffice access handshake keeps its established
# /api/v1/backoffice/* URLs — login plus the pre-identity password-recovery pair
# (forgot-password/reset-password), which share the login prefix by design (security.yaml
# check_path + access_control + the PWA depend on them). The resource is scoped to Identity's
# Http dir so this prefix stays confined to the access surface and never leaks onto other Iam
# controllers (the /me and session self-service surfaces mount under /api/v1 via their own resources).
api_v1_iam_identity_login:
    resource: ../src/Iam/Identity/Infrastructure/Http/
    type: attribute
    prefix: /api/v1/backoffice
    defaults:
        _format: json

# Iam invitation accept surface. The one public write of the invitation flow keeps the established
# /api/v1/backoffice prefix (its access_control + Origin/CSRF checks key on the route), scoped to
# Invitation's Http dir so the prefix stays confined to it.
api_v1_iam_invitation:
    resource: ../src/Iam/Invitation/Infrastructure/Http/
    type: attribute
    prefix: /api/v1/backoffice
    defaults:
        _format: json

# Iam identity read surface (who-am-i). Lives in Identity's Controller dir, disjoint from
# the legacy backoffice-prefixed login resource above, so /me mounts at /api/v1/me.
api_v1_iam_identity:
    resource: ../src/Iam/Identity/Infrastructure/Controller/
    type: attribute
    prefix: /api/v1
    defaults:
        _format: json

# Iam session self-service surface (list my sessions, revoke the others).
api_v1_iam_session:
    resource: ../src/Iam/Session/Infrastructure/Controller/
    type: attribute
    prefix: /api/v1
    defaults:
        _format: json

api_v1_front_office:
    resource: ../src/Frontoffice/
    type: attribute
    prefix: /api/v1
    defaults:
        _format: json

api_v1_shared_media:
    resource: ../src/Shared/Media/Infrastructure/Controller/
    type: attribute
    prefix: /api/v1

api_v1_shared_storage:
    resource: ../src/Shared/Storage/Infrastructure/Controller/
    type: attribute
    prefix: /api/v1
