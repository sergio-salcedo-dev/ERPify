services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    Erpify\Tests\DataFixtures\:
        resource: '../tests/DataFixtures/*'

    Erpify\Tests\Doctrine\TestDebugDataHolder: ~

    # Override the service the doctrine-bundle DebugMiddleware actually consumes
    # so DoctrineContext can read every query through our static-state subclass.
    doctrine.debug_data_holder:
        alias: Erpify\Tests\Doctrine\TestDebugDataHolder
        public: true

    # Keep the parent-class-FQCN alias public too: TestDebugDataHolderWiringTest
    # asserts that resolving DebugDataHolder::class returns our subclass.
    Symfony\Bridge\Doctrine\Middleware\Debug\DebugDataHolder:
        alias: Erpify\Tests\Doctrine\TestDebugDataHolder
        public: true

    # test-only controllers that exercise the ExceptionResponder listener through a real kernel via WebTestCase.
    # Loaded only when APP_ENV=test.
    Erpify\Tests\Functional\Shared\ErrorContract\Infrastructure\Http\EventListener\Fixtures\:
        resource: '../tests/Functional/Shared/ErrorContract/Infrastructure/Http/EventListener/Fixtures/'
        exclude: '../tests/Functional/Shared/ErrorContract/Infrastructure/Http/EventListener/Fixtures/ForceHealthFailureSubscriber.php'
        tags: ['controller.service_arguments']

    # test-only kernel.controller subscriber that throws on the two `/health`
    # endpoints when `?_force_failure=1` is present. Lets the integration + Behat tests
    # prove the RFC 9457 contract applies retroactively without modifying the
    # production HealthController classes.
    Erpify\Tests\Functional\Shared\ErrorContract\Infrastructure\Http\EventListener\Fixtures\ForceHealthFailureSubscriber:
        tags:
            - { name: kernel.event_subscriber }

    # BufferingLogger captures structured log records emitted by ExceptionResponder
    # in the test environment. Public so functional tests can pull it from the container via
    # `self::getContainer()->get(BufferingLogger::class)` and assert on `cleanLogs()`.
    Symfony\Component\ErrorHandler\BufferingLogger:
        public: true

    # override autowiring of LoggerInterface for ExceptionResponder ONLY (do NOT
    # alias LoggerInterface globally — that would silence Symfony framework logs in tests).
    Erpify\Shared\ErrorContract\Infrastructure\Http\EventListener\ExceptionResponder:
        arguments:
            $logger: '@Symfony\Component\ErrorHandler\BufferingLogger'

    # Resolves a Messenger transport by logical name for the contexts that inspect or consume one. Takes
    # the test service container because transports are fetched by service id at assertion time, which
    # keeps the queue names data instead of constructor wiring.
    Erpify\Tests\Behat\Support\Messenger\MessengerTransports:
        arguments:
            $container: '@test.service_container'

    # The outbox over the fixed inspectable queues, on top of that resolution.
    Erpify\Tests\Behat\Support\Messenger\Outbox: ~

    # What the last thing a scenario ran left behind. Shared (Symfony services are), which is the
    # point: it is what lets one step vocabulary assert on a console command and on a Messenger
    # worker run without either context redefining the other's patterns.
    Erpify\Tests\Behat\Support\Execution\LastRun: ~

    # Recording Mercure hub: captures the realtime Updates a consumed bank event publishes, instead of
    # reaching the live hub (which has no test double and hangs ~5s per consume). Overriding the
    # MercureBundle's HubInterface alias makes RefreshRealtimeOnBankChanged and MercureContext share it.
    Erpify\Tests\Behat\Support\Mercure\RecordingHub: ~

    Symfony\Component\Mercure\HubInterface:
        alias: Erpify\Tests\Behat\Support\Mercure\RecordingHub
        public: true

    # Recording mailer subscriber: captures every Email handed to Symfony Mailer (null transport in
    # test) so NotificationContext can assert the notification effect of a consumed bank event.
    Erpify\Tests\Behat\Support\Notification\RecordingMailerSubscriber:
        tags:
            - { name: kernel.event_subscriber }

    # The audit write seam has no production consumer yet (the first auditing caller arrives later), so
    # its autoconfigured private alias would be pruned at compile time and the branching functional test
    # could not resolve it. Expose it — and with it the whole adapter graph — in test only, to exercise
    # the real wiring. Removable once a production caller retains the alias.
    Erpify\Shared\Audit\Application\AuditLogger:
        alias: Erpify\Shared\Audit\Infrastructure\SymfonyAuditLogger
        public: true
