services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    Erpify\Tests\DataFixtures\:
        resource: '../tests/DataFixtures/*'

    Erpify\Tests\Doctrine\TestDebugDataHolder: ~

    # Override the service the doctrine-bundle DebugMiddleware actually consumes
    # so DoctrineContext can read every query through our static-state subclass.
    doctrine.debug_data_holder:
        alias: Erpify\Tests\Doctrine\TestDebugDataHolder
        public: true

    # Keep the parent-class-FQCN alias public too: TestDebugDataHolderWiringTest
    # asserts that resolving DebugDataHolder::class returns our subclass.
    Symfony\Bridge\Doctrine\Middleware\Debug\DebugDataHolder:
        alias: Erpify\Tests\Doctrine\TestDebugDataHolder
        public: true

    # Story 1.4 — test-only controllers that exercise the ExceptionResponder listener through a real
    # kernel via WebTestCase. Loaded only when APP_ENV=test.
    Erpify\Tests\Functional\Shared\Infrastructure\Http\EventListener\Fixtures\:
        resource: '../tests/Functional/Shared/Infrastructure/Http/EventListener/Fixtures/'
        tags: ['controller.service_arguments']

    # Story 2.4 — BufferingLogger captures structured log records emitted by ExceptionResponder
    # in the test environment. Public so functional tests can pull it from the container via
    # `self::getContainer()->get(BufferingLogger::class)` and assert on `cleanLogs()`.
    Symfony\Component\ErrorHandler\BufferingLogger:
        public: true

    # Story 2.4 — override autowiring of LoggerInterface for ExceptionResponder ONLY (do NOT
    # alias LoggerInterface globally — that would silence Symfony framework logs in tests).
    Erpify\Shared\Infrastructure\Http\EventListener\ExceptionResponder:
        arguments:
            $logger: '@Symfony\Component\ErrorHandler\BufferingLogger'
