services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    Erpify\Tests\DataFixtures\:
        resource: '../tests/DataFixtures/*'

    Erpify\Tests\Doctrine\TestDebugDataHolder: ~

    # Override the service the doctrine-bundle DebugMiddleware actually consumes
    # so DoctrineContext can read every query through our static-state subclass.
    doctrine.debug_data_holder:
        alias: Erpify\Tests\Doctrine\TestDebugDataHolder
        public: true

    # Keep the parent-class-FQCN alias public too: TestDebugDataHolderWiringTest
    # asserts that resolving DebugDataHolder::class returns our subclass.
    Symfony\Bridge\Doctrine\Middleware\Debug\DebugDataHolder:
        alias: Erpify\Tests\Doctrine\TestDebugDataHolder
        public: true

    # test-only controllers that exercise the ExceptionResponder listener through a real kernel via WebTestCase.
    # Loaded only when APP_ENV=test.
    Erpify\Tests\Functional\Shared\Infrastructure\Http\EventListener\Fixtures\:
        resource: '../tests/Functional/Shared/Infrastructure/Http/EventListener/Fixtures/'
        exclude: '../tests/Functional/Shared/Infrastructure/Http/EventListener/Fixtures/ForceHealthFailureSubscriber.php'
        tags: ['controller.service_arguments']

    # test-only kernel.controller subscriber that throws on the two `/health`
    # endpoints when `?_force_failure=1` is present. Lets the integration + Behat tests
    # prove the RFC 9457 contract applies retroactively without modifying the
    # production HealthController classes.
    Erpify\Tests\Functional\Shared\Infrastructure\Http\EventListener\Fixtures\ForceHealthFailureSubscriber:
        tags:
            - { name: kernel.event_subscriber }

    # BufferingLogger captures structured log records emitted by ExceptionResponder
    # in the test environment. Public so functional tests can pull it from the container via
    # `self::getContainer()->get(BufferingLogger::class)` and assert on `cleanLogs()`.
    Symfony\Component\ErrorHandler\BufferingLogger:
        public: true

    # override autowiring of LoggerInterface for ExceptionResponder ONLY (do NOT
    # alias LoggerInterface globally — that would silence Symfony framework logs in tests).
    Erpify\Shared\Infrastructure\Http\EventListener\ExceptionResponder:
        arguments:
            $logger: '@Symfony\Component\ErrorHandler\BufferingLogger'

    # Recording Mercure hub: captures the realtime Updates a consumed bank event publishes, instead of
    # reaching the live hub (which has no test double and hangs ~5s per consume). Overriding the
    # MercureBundle's HubInterface alias makes BankRealtimePublisherHandler and MercureContext share it.
    Erpify\Tests\Behat\Support\Mercure\RecordingHub: ~

    Symfony\Component\Mercure\HubInterface:
        alias: Erpify\Tests\Behat\Support\Mercure\RecordingHub
        public: true

    # Recording mailer subscriber: captures every Email handed to Symfony Mailer (null transport in
    # test) so NotificationContext can assert the notification effect of a consumed bank event.
    Erpify\Tests\Behat\Support\Notification\RecordingMailerSubscriber:
        tags:
            - { name: kernel.event_subscriber }
