# Read the documentation at https://github.com/thephpleague/flysystem-bundle/blob/master/docs/1-getting-started.md
parameters:
    # Outside the source tree on purpose: the bytes must survive a container being recreated, which is what
    # the declared volume provides, and they must never be reachable as static files nor land in `git status`.
    env(STORAGE_LOCAL_PATH): '%kernel.project_dir%/var/storage'

    # ONE declaration, because two would be a silent hole rather than a duplication. The adapter is handed
    # this path as well as the operator built from it, and it stat()s the path to tell a demonstrable
    # absence from an existence it could not establish. Were the two to drift to a path that merely EXISTS,
    # every one of those checks would answer about a tree holding none of the bytes, and each undecidable
    # existence would be reported as a confirmed erasure — with every gate green.
    erpify.images.storage_root: '%env(STORAGE_LOCAL_PATH)%/images'

    # Evidence has a root of its own on a volume of its own, because it is backed up, restored and erased under
    # a different regime from fungible images, and because `staging/` and `final/` must sit on ONE filesystem
    # for a promotion to be a single-filesystem move. Provisioned by `docker-entrypoint.sh` only when a volume
    # is mounted at this path. The Documents adapter uses native filesystem calls rather than a Flysystem
    # storage (it needs create-exclusive and link-without-replace, which the local adapter cannot express), so
    # the path is declared here beside its sibling and handed to the adapter as a plain string.
    env(DOCUMENTS_STORAGE_PATH): '%kernel.project_dir%/var/documents-storage'
    erpify.documents.storage_root: '%env(DOCUMENTS_STORAGE_PATH)%'

flysystem:
    storages:
        images.storage:
            local:
                directory: '%erpify.images.storage_root%'
                # Set so the library does not create the root in its constructor. It does NOT by itself make
                # an unmounted volume fail: read in the library's source, the flag only defers that `mkdir`
                # to the first write. What actually refuses is the adapter's own guard, which runs before
                # every operation including the write; this flag is what stops the constructor getting
                # there first. Both halves are needed, and crediting the flag alone is how the guard gets
                # deleted as redundant. Measured: with the root absent, `delete()` answers success for
                # every key — a confirmed erasure of bytes nobody removed.
                lazy_root_creation: true
