doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '18'
        profiling_collect_backtrace: '%kernel.debug%'
        types:
            datetimetz: Erpify\Shared\Persistence\Infrastructure\DateTimeTzMicrosType
            datetimetz_immutable: Erpify\Shared\Persistence\Infrastructure\DateTimeTzMicrosType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        mappings:
            Backoffice:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Backoffice'
                prefix: 'Erpify\Backoffice'
                alias: Backoffice
            Iam:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Iam'
                prefix: 'Erpify\Iam'
                alias: Iam
            Organization:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Organization'
                prefix: 'Erpify\Organization'
                alias: Organization
            # Narrow on purpose: the mapping list is an allowlist of what the ORM owns, so it points at
            # the module's entity directory rather than at `Erpify\Shared`. A prefix covering the whole
            # shared kernel would turn `auto_mapping: false` back into `true` for half the tree, and the
            # contexts that deliberately persist without the ORM (crypto keystore, event store, audit log)
            # would be adopted the moment anyone wrote an `#[ORM\Entity]` anywhere under it.
            SharedImages:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Images/Domain/Entity'
                prefix: 'Erpify\Shared\Images\Domain\Entity'
                alias: SharedImages

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system

when@test:
    doctrine:
        dbal:
            # The suffix — not the DSN — is what keeps the suite off the dev database. The stack injects
            # DATABASE_URL as a real container environment variable, and Symfony's Dotenv never overwrites a
            # variable that is already set, so a DSN written in .env.test is inert under Docker and every
            # `APP_ENV=test` process resolves whatever compose handed the container. A suffix is applied to
            # the already-resolved connection instead, so it holds however DATABASE_URL arrives: compose,
            # .env, a shell export, an IDE run configuration.
            #
            # It has to hold at that strength because the suite does not merely write to the database it
            # connects to — FixturesContext purges it, clones it to `<dbname>_behat_backup` and restores over
            # it once per feature, so a connection pointed at the dev database consumes the developer's data.
            #
            # TEST_TOKEN is ParaTest's per-process token; nothing sets it here, so it resolves to the empty
            # string and the name stays `<dbname>_test`.
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'
