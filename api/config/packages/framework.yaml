# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    serializer:
        enabled: true

    # Session auth makes the cookie posture load-bearing. These match the framework defaults but are pinned
    # explicitly because they are now security-relevant: httpOnly (JS cannot read it), SameSite=Lax + Secure
    # (not replayed cross-site). Login CSRF is covered by the same-origin deployment (FrankenPHP) + the
    # non-broadened CORS policy + json_login's application/json requirement (a cross-site form cannot send
    # application/json without a CORS preflight the policy denies) + SameSite=Lax. json_login validates no
    # CSRF token, so no stateless-token CSRF is configured here — it is wired with the first authenticated
    # mutating route that can consume it (wire-on-consumer). See docs/adr/auth-rbac-subsystem.md D1.
    # Note: the session starts only when read/written, so anonymous requests set no cookie.
    session:
        cookie_httponly: true
        cookie_samesite: lax
        cookie_secure: auto

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
