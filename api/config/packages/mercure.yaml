mercure:
    hubs:
        default:
            url: '%env(default::MERCURE_URL)%'
            public_url: '%env(default::MERCURE_PUBLIC_URL)%'
            # The hub is the one embedded in the FrankenPHP image: dunglas/mercure 1.x (`frankenphp
            # build-info`), run with `protocol_version_compatibility 8` in frankenphp/Caddyfile so it
            # keeps accepting the 0.x protocol this application speaks — tokens carrying the `mercure`
            # claim, subscribers authorising through the `mercureAuthorization` cookie and `?topic=`.
            # The bundle defaults to protocol 1.0, which changes the token shape and the cookie name the
            # browser receives. Move this together with the hub's `issuer` block, never alone.
            protocol_version: '0.x'
            jwt:
                secret: '%env(MERCURE_JWT_SECRET)%'
                publish: '*'
