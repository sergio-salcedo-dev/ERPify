# Rate limiter policy for the public HTTP surface.
#
# `anonymous_api` — sliding_window, applied per client IP on every /api/*
# request. Sliding window avoids the boundary burst flaw of fixed_window
# (a caller can otherwise spend the tail of window N AND the head of
# window N+1 within seconds). Default budget: 120 requests / minute per
# IP. Tuned for normal SPA navigation; well below the per-IP load a
# single tab generates during boot.
#
# State lives in Symfony's default `cache.rate_limiter` pool and survives
# within a deploy (reset on cache clear — see
# api/config/packages/cache.yaml). For production with multiple FrankenPHP
# workers behind a load balancer, swap the pool to a shared backend (Redis)
# so the budget is consistent across processes; pin the override in deploy
# config.
#
# `lock_factory: null` is explicit: the project does NOT install
# symfony/lock, so Symfony's FrameworkExtension auto-degrades the default
# 'auto' to null anyway — declaring it spells out the trade-off. Without
# a lock, concurrent FrankenPHP workers racing on the same cache key may
# over- or under-count by a small number of requests under high
# concurrency. Acceptable for the anonymous DoS-attenuation use case;
# install symfony/lock and switch this to 'lock.factory' if exact counting
# becomes a requirement.
#
# Numeric policy values are env-driven so operators can tighten the budget
# on the fly (e.g. drop RATE_LIMIT_ANONYMOUS_API_LIMIT to 10 during a
# sustained attack and bounce the worker — no redeploy needed). Defaults
# live in api/.env; environment-specific overrides in api/.env.<env>. The
# test environment lowers the budget to 5/min so functional tests can
# assert the 429 path deterministically (api/.env.test).
#
# The kernel.request listener that consumes `anonymous_api` lives at
# api/src/Shared/ErrorContract/Infrastructure/Http/EventListener/RateLimitListener.php.
# It is path-scoped to /api/* and rejects with a domain exception
# implementing the RateLimited marker so the existing ProblemDetailsFactory
# pipeline emits an RFC 9457 429 response (type=rate-limited) without
# bypassing the contract.
framework:
    rate_limiter:
        anonymous_api:
            policy: 'sliding_window'
            limit: '%env(int:RATE_LIMIT_ANONYMOUS_API_LIMIT)%'
            interval: '%env(RATE_LIMIT_ANONYMOUS_API_INTERVAL)%'
            lock_factory: null

        # `password_recovery_per_email` — per-target budget on POST /forgot-password, keyed by the requested
        # email. Exhaustion is deliberately INVISIBLE to the caller: the endpoint still answers the uniform
        # 202 and only the work (token mint + email) is silenced — a per-account 429 would announce which
        # accounts are under attack (an existence oracle) and let an attacker keep superseding a victim's
        # legitimate token. Consumed by PasswordRecoveryThrottle at the controller edge, mirroring where
        # login_throttling and anonymous_api live.
        password_recovery_per_email:
            policy: 'sliding_window'
            limit: '%env(int:RATE_LIMIT_PASSWORD_RECOVERY_PER_EMAIL_LIMIT)%'
            interval: '%env(RATE_LIMIT_PASSWORD_RECOVERY_PER_EMAIL_INTERVAL)%'
            lock_factory: null

        # `recovery_throttle_audit_per_email` — a budget over the AUDIT of the budget above, keyed by the same
        # case-folded address. It is NOT a second throttle on the endpoint: nothing about the response depends
        # on it, and the caller that consumes it has already decided to answer 202.
        #
        # SPENDING IT IS THE SUPPRESSION, NOT A LOST ROW. Read as a rate limiter it looks like rows are being
        # dropped; what is actually being bounded is the work an attacker can make the audit path do. Once the
        # per-email recovery budget is gone every later request in the window is refused too, so a row per
        # refusal would be a synchronous INSERT per attempt at precisely the moment somebody is hammering —
        # the amplifier RequestPasswordResetController exists to avoid handing over. Here the throttle cannot
        # be its own guard, because the throttle is what is being reported.
        #
        # IT IS SPENT BEFORE THE WRITE, NOT AFTER A CONFIRMED ONE — the opposite of how a notification seal is
        # ordered, and deliberately so. This budget bounds WORK, not rows: a failed INSERT costs the same
        # round-trip as a successful one, so waiting for confirmation would restore the full amplifier exactly
        # while `audit_log` is unavailable. The price is that an outage can cost one window of silence per
        # address, which the swallowed warning names.
        #
        # A refusal costs the bucket nothing, so the slot returns one interval after the row that spent it and
        # an attacker cannot extend their own silence by hammering: `consume()` reserves with `maxTime = 0`, so
        # a refused request leaves through MaxWaitDurationExceededException before the refusing branch of
        # SlidingWindowLimiter::reserve() reaches its `add()`. Worth stating because that `add()` is plainly
        # visible in the source and reading it alone suggests the opposite.
        #
        # `interval` mirrors password_recovery_per_email so one row means one window of the budget it observes.
        # The two windows share a DURATION, never a PHASE: each bucket starts at its own first consume.
        recovery_throttle_audit_per_email:
            policy: 'sliding_window'
            limit: '%env(int:RATE_LIMIT_RECOVERY_THROTTLE_AUDIT_LIMIT)%'
            interval: '%env(RATE_LIMIT_RECOVERY_THROTTLE_AUDIT_INTERVAL)%'
            lock_factory: null

        # `token_action_per_selector` — per-target budget on the token-consuming endpoints (reset-password,
        # invitation accept), keyed by the selector half of the presented `<id>.<secret>` link. It caps
        # brute-forcing the secret of one selector; exhaustion folds into the SAME opaque invalid-token wall
        # as a dead link, because a per-selector 429 would confirm to an attacker that the selector exists.
        # Selectors are UUIDs, so reset and accept share the namespace collision-free.
        token_action_per_selector:
            policy: 'sliding_window'
            limit: '%env(int:RATE_LIMIT_TOKEN_ACTION_LIMIT)%'
            interval: '%env(RATE_LIMIT_TOKEN_ACTION_INTERVAL)%'
            lock_factory: null

        # `password_change_per_identity` — per-identity budget on the two routes that require the caller to
        # RE-PROVE the current password from a live session: POST /me/password and POST /me/recovery-secret.
        # Keyed by the signed-in identity's id, and shared between them on purpose — see the paragraph on
        # drift below, which is the reason the consuming class is named CurrentPasswordProofThrottle rather
        # than after whichever controller reached it first.
        #
        # THE KEY KEEPS ITS ORIGINAL NAME while the abstraction's did not, and that asymmetry is deliberate:
        # this one is deployment surface. Its value arrives through RATE_LIMIT_PASSWORD_CHANGE_PER_IDENTITY_*,
        # so renaming it would leave any deployment's own override silently unread and the budget silently
        # back at the committed default — a failure with no red anywhere. A misleading class name is a lie a
        # reader can see; a renamed env var is a lie only production discovers.
        #
        # Exhaustion is a VISIBLE 429, which is the deliberate difference from the two budgets
        # above: they sit on PRE-identity surfaces where a per-target 429 would answer "this account exists",
        # while this endpoint is reached only through an established session, so the caller already knows the
        # identity exists — it is their own. There is nothing left to leak.
        #
        # 10 / 15 minutes mirrors the persisted lockout (User::MAX_FAILED_ATTEMPTS / User::LOCK_DURATION),
        # which is the budget this product already chose for "how many credential attempts before I stop
        # listening". Reusing it is the point: a wrong `currentPassword` here does NOT feed that counter (by
        # decision — marking failures from a route reachable only with a live session would turn a stolen
        # session into a lockout DoS against the owner), so this limiter is the ONLY per-identity budget on
        # the route and inventing a second number for the same question is how the two drift apart.
        #
        # What it does and does not buy: an attacker holding the session is delayed, not stopped — the budget
        # lives in the cache pool, so a deploy or a second worker resets or splits it, and `lock_factory: null`
        # lets the count drift under concurrency. It is an attenuator; the wall is the persisted lockout on the
        # login route.
        #
        # The owner pays for it too, and the recovery route is NOT a reliable way out. Spending this bucket on
        # mistyped current passwords locks the owner out of this route, and the obvious detour —
        # /forgot-password → /reset-password — runs on `password_recovery_per_email`, which the same attacker
        # can drain: the session they hold reveals the address (`GET /me`), five requests spend an hour-long
        # budget, and exhaustion there is SILENT by contract, so the owner meets a 202 and no email. What makes
        # the refusal affordable is therefore not an always-open detour but that nothing is destroyed: the
        # credential still works, the budget refills on a sliding window, and an administrator can act. The
        # residual — an attacker with a live session can stall self-service recovery for the length of the
        # longer window — is named in PRODUCTION_SECURITY_CHECKLIST.md rather than argued away here.
        password_change_per_identity:
            policy: 'sliding_window'
            limit: '%env(int:RATE_LIMIT_PASSWORD_CHANGE_PER_IDENTITY_LIMIT)%'
            interval: '%env(RATE_LIMIT_PASSWORD_CHANGE_PER_IDENTITY_INTERVAL)%'
            lock_factory: null
