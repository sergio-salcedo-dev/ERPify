framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: async
                    auto_setup: false
            failed:
                dsn: 'doctrine://default?queue_name=failed'
                options:
                    auto_setup: false
            sync: 'sync://'

        routing:
            Erpify\Backoffice\Bank\Domain\Event\BankCreatedDomainEvent: async
            Erpify\Backoffice\Bank\Domain\Event\BankUpdatedDomainEvent: async
            Erpify\Backoffice\Bank\Domain\Event\BankDeletedDomainEvent: async
            Erpify\Backoffice\BankAccount\Domain\Event\BankAccountCreatedDomainEvent: async
            Erpify\Backoffice\BankAccount\Domain\Event\BankAccountUpdatedDomainEvent: async
            Erpify\Backoffice\BankAccount\Domain\Event\BankAccountDeletedDomainEvent: async
            Erpify\Backoffice\BankAccount\Domain\Event\BankAccountStatusChangedDomainEvent: async
            # Safe to queue because its payload is the aggregate id alone — the token-bearing security emails
            # (invitation, reset) stay synchronous best-effort instead: routing Symfony's SendEmailMessage
            # would serialise the whole Email, plaintext token included, into this transport and `failed`.
            Erpify\Iam\Identity\Domain\Event\PasswordResetCompleted: async

        buses:
            messenger.bus.default:
                middleware:
                    - Erpify\Shared\Event\Infrastructure\Messenger\PersistDomainEventMiddleware

# Test env: in-memory queues. serialize=true runs messages through the Messenger serializer
# (encode/decode) like Doctrine/AMQP would, so tests can catch non-serializable payloads or
# serializer misconfiguration; without it, the transport keeps PHP object references only.
when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://?serialize=true'
                failed: 'in-memory://?serialize=true'
                sync: 'sync://'
