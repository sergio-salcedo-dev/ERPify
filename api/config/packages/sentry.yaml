# Sentry loads in dev and prod only (see config/bundles.php) — the test suite
# never touches it. Gating is by SENTRY_DSN:
#   - dev: empty by default → the SDK is inert. Set SENTRY_DSN in api/.env.local
#     (gitignored) to watch your own errors while developing; events are tagged
#     environment "dev" in Sentry, so they never mix with prod.
#   - prod (test machine + VPS): a real SENTRY_DSN is REQUIRED — the deploy
#     (make prod.env.check + compose `:?`) aborts without it.
#
# `environment` is just %kernel.environment% (= APP_ENV: "dev" / "prod"), so no
# extra env var is needed to tell the surfaces apart.
#
# Unhandled exceptions are captured by the bundle's kernel.exception listener
# (register_error_listener, full throwable + stack), independently of — and
# without disturbing — the RFC 9457 ExceptionResponder. We deliberately do NOT
# wire the Monolog Sentry handler (kept commented in config/packages/monolog.yaml):
# ExceptionResponder's single PSR-3 log line carries no throwable, so the listener
# path yields richer events and avoids double-reporting.
#
# The listener captures EVERYTHING, including expected 4xx domain outcomes (a 409
# bank-in-use, a 422 validation error) — user/state errors, not actionable faults.
# So `before_send` (SentryBeforeSend) DROPS every throwable implementing the
# `ClientError` marker before transmission, then scrubs PII on what remains. 5xx
# paths (a marker-less DomainException → unhandled-exception, or any non-domain
# throwable) are not ClientError and still flow through. See docs/api-error-contract.md.

# Dev: errors + 100% performance tracing (local profiling — N+1, slow queries,
# external-call latency), opt-in via DSN. The long-running messenger:consume worker
# is EXCLUDED from tracing (see the `console.excluded_commands` note below).
when@dev:
    sentry:
        dsn: '%env(SENTRY_DSN)%'
        register_error_listener: true
        options:
            environment: '%kernel.environment%'
            # 100% of requests/commands traced — cheap locally, full DB/HTTP waterfall.
            traces_sample_rate: 1.0
            send_default_pii: false
            # Drop expected 4xx ClientError events + messenger-worker DB-connection teardown noise
            # (see SentryEventFilter), then scrub PII on what remains.
            before_send: 'Erpify\Shared\Monitoring\Infrastructure\Sentry\SentryBeforeSend'
            ignore_exceptions:
                - 'Symfony\Component\ErrorHandler\Error\FatalError'
                - 'Symfony\Component\Debug\Exception\FatalErrorException'
                - 'Symfony\Component\HttpKernel\Exception\NotFoundHttpException'
        tracing:
            enabled: true
            dbal:
                enabled: true
            http_client:
                enabled: true
            # THE WORKER GOTCHA: the SentryBundle's TracingConsoleListener wraps a
            # whole console command in ONE transaction (start on ConsoleCommandEvent,
            # end on terminate). `messenger:consume` runs for --time-limit seconds, so
            # at any rate > 0 it becomes a single giant, useless transaction that also
            # accumulates spans in the long-lived worker process (memory growth).
            # Excluding it leaves only real HTTP requests traced. See docs/deployment-guide.md.
            console:
                excluded_commands:
                    - 'messenger:consume'

# Prod: full monitoring — errors + performance tracing + Messenger capture.
when@prod:
    sentry:
        dsn: '%env(SENTRY_DSN)%'
        register_error_listener: true
        options:
            environment: '%kernel.environment%'
            # Performance tracing. 0 = no transactions sent; prod injects ~0.2.
            # `float:default::` coalesces an empty/unset value to null → 0.0. The
            # order matters: a bare `float:` of an empty string throws and would
            # crash the prod boot, and `default::float:` evaluates float first
            # (still throwing) — `default` must wrap, not be wrapped.
            traces_sample_rate: '%env(float:default::SENTRY_TRACES_SAMPLE_RATE)%'
            # Never attach request headers, cookies, IP or the authenticated user.
            send_default_pii: false
            # Drop expected 4xx ClientError events (no technical action needed) + messenger-worker
            # DB-connection teardown noise (see SentryEventFilter), then defense-in-depth scrub of
            # denylisted keys on what remains — parity with RFC 9457.
            before_send: 'Erpify\Shared\Monitoring\Infrastructure\Sentry\SentryBeforeSend'
            ignore_exceptions:
                - 'Symfony\Component\ErrorHandler\Error\FatalError'
                - 'Symfony\Component\Debug\Exception\FatalErrorException'
                # 404s on unmatched routes are noise, not actionable errors.
                - 'Symfony\Component\HttpKernel\Exception\NotFoundHttpException'
        # Capture failures from async message handlers (messenger_worker).
        messenger:
            enabled: true
            capture_soft_fails: true
            # FrankenPHP / worker run long-lived processes; isolate the Sentry
            # context per message so user/scope from one message never leaks into
            # the next (getsentry/sentry-symfony#905).
            isolate_context_by_message: true
        tracing:
            enabled: true
            dbal:
                enabled: true
            http_client:
                enabled: true
            # Exclude the long-running messenger:consume worker from tracing — same
            # gotcha as dev (one giant transaction + worker memory growth). At prod's
            # 0.2 rate it would still be sampled 20% of the time. See docs/deployment-guide.md.
            console:
                excluded_commands:
                    - 'messenger:consume'
