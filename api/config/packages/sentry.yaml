# Sentry loads in dev and prod only (see config/bundles.php) — the test suite
# never touches it. Gating is by SENTRY_DSN:
#   - dev: empty by default → the SDK is inert. Set SENTRY_DSN in api/.env.local
#     (gitignored) to watch your own errors while developing; events are tagged
#     environment "dev" in Sentry, so they never mix with prod.
#   - prod (test machine + VPS): a real SENTRY_DSN is REQUIRED — the deploy
#     (make prod.env.check + compose `:?`) aborts without it.
#
# `environment` is just %kernel.environment% (= APP_ENV: "dev" / "prod"), so no
# extra env var is needed to tell the surfaces apart.
#
# Unhandled exceptions are captured by the bundle's kernel.exception listener
# (register_error_listener, full throwable + stack), independently of — and
# without disturbing — the RFC 9457 ExceptionResponder. We deliberately do NOT
# wire the Monolog Sentry handler (kept commented in config/packages/monolog.yaml):
# ExceptionResponder's single PSR-3 log line carries no throwable, so the listener
# path yields richer events and avoids double-reporting.

# Dev: errors only (no performance tracing / Messenger noise), opt-in via DSN.
when@dev:
    sentry:
        dsn: '%env(SENTRY_DSN)%'
        register_error_listener: true
        options:
            environment: '%kernel.environment%'
            send_default_pii: false
            before_send: 'Erpify\Shared\Monitoring\Infrastructure\Sentry\SentryEventScrubber'
            ignore_exceptions:
                - 'Symfony\Component\ErrorHandler\Error\FatalError'
                - 'Symfony\Component\Debug\Exception\FatalErrorException'
                - 'Symfony\Component\HttpKernel\Exception\NotFoundHttpException'

# Prod: full monitoring — errors + performance tracing + Messenger capture.
when@prod:
    sentry:
        dsn: '%env(SENTRY_DSN)%'
        register_error_listener: true
        options:
            environment: '%kernel.environment%'
            # Performance tracing. 0 = no transactions sent; prod injects ~0.2.
            # `float:default::` coalesces an empty/unset value to null → 0.0. The
            # order matters: a bare `float:` of an empty string throws and would
            # crash the prod boot, and `default::float:` evaluates float first
            # (still throwing) — `default` must wrap, not be wrapped.
            traces_sample_rate: '%env(float:default::SENTRY_TRACES_SAMPLE_RATE)%'
            # Never attach request headers, cookies, IP or the authenticated user.
            send_default_pii: false
            # Defense-in-depth scrub of denylisted keys, parity with RFC 9457.
            before_send: 'Erpify\Shared\Monitoring\Infrastructure\Sentry\SentryEventScrubber'
            ignore_exceptions:
                - 'Symfony\Component\ErrorHandler\Error\FatalError'
                - 'Symfony\Component\Debug\Exception\FatalErrorException'
                # 404s on unmatched routes are noise, not actionable errors.
                - 'Symfony\Component\HttpKernel\Exception\NotFoundHttpException'
        # Capture failures from async message handlers (messenger_worker).
        messenger:
            enabled: true
            capture_soft_fails: true
            # FrankenPHP / worker run long-lived processes; isolate the Sentry
            # context per message so user/scope from one message never leaks into
            # the next (getsentry/sentry-symfony#905).
            isolate_context_by_message: true
        tracing:
            enabled: true
            dbal:
                enabled: true
            http_client:
                enabled: true
