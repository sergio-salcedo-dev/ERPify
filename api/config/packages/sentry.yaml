# Sentry is registered prod-only (see config/bundles.php), so dev and test never
# load the SDK and can emit nothing — the strongest possible env gate. In prod
# (the test machine and the VPS, both APP_ENV=prod) the DSN is the second gate:
# an empty SENTRY_DSN leaves the SDK inert until a real DSN is injected.
#
# Unhandled exceptions are captured by the bundle's kernel.exception listener
# (register_error_listener defaults to true) with their full throwable + stack
# trace, independently of — and without disturbing — the RFC 9457
# ExceptionResponder. We deliberately do NOT also wire the Monolog Sentry handler
# (kept commented in config/packages/monolog.yaml): ExceptionResponder's single
# PSR-3 log line carries no throwable, so the listener path yields far richer
# events and avoids double-reporting the same error.
when@prod:
    sentry:
        dsn: '%env(SENTRY_DSN)%'
        # Capture unhandled throwables from kernel.exception (default true; explicit
        # for clarity). This — not the Monolog handler — is the capture path.
        register_error_listener: true
        options:
            # Distinguishes prod surfaces in Sentry (e.g. "test-machine" vs
            # "production"); falls back to the Symfony env when SENTRY_ENVIRONMENT
            # is unset/empty.
            environment: '%env(default:kernel.environment:SENTRY_ENVIRONMENT)%'
            # Performance tracing. 0 = no transactions sent; prod injects ~0.2.
            # `float:default::` coalesces an empty/unset value to null → 0.0. The
            # order matters: a bare `float:` of an empty string throws and would
            # crash the prod boot, and `default::float:` evaluates float first
            # (still throwing) — `default` must wrap, not be wrapped.
            traces_sample_rate: '%env(float:default::SENTRY_TRACES_SAMPLE_RATE)%'
            # Never attach request headers, cookies, IP or the authenticated user.
            send_default_pii: false
            # Defense-in-depth scrub of denylisted keys, parity with RFC 9457.
            before_send: 'Erpify\Shared\Infrastructure\Monitoring\SentryEventScrubber'
            ignore_exceptions:
                - 'Symfony\Component\ErrorHandler\Error\FatalError'
                - 'Symfony\Component\Debug\Exception\FatalErrorException'
                # 404s on unmatched routes are noise, not actionable errors.
                - 'Symfony\Component\HttpKernel\Exception\NotFoundHttpException'
        # Capture failures from async message handlers (messenger_worker).
        messenger:
            enabled: true
            capture_soft_fails: true
            # FrankenPHP / worker run long-lived processes; isolate the Sentry
            # context per message so user/scope from one message never leaks into
            # the next (getsentry/sentry-symfony#905).
            isolate_context_by_message: true
        tracing:
            enabled: true
            dbal:
                enabled: true
            http_client:
                enabled: true
