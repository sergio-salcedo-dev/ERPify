security:
    # Verification resolves the algorithm from each stored hash, so a CLI-minted hash and the firewall
    # check always agree. The CLI's PasswordHasher adapter selects this same hasher by SecurityUser::class.
    password_hashers:
        Erpify\Backoffice\Identity\Infrastructure\Security\SecurityUser: 'auto'

    # Loads the identity by its email identifier; a blank/unknown identifier maps to "user not found".
    providers:
        identity_user_provider:
            id: Erpify\Backoffice\Identity\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: identity_user_provider
            json_login:
                check_path: identity_login
                username_path: email
                password_path: password
                failure_handler: Erpify\Backoffice\Identity\Infrastructure\Security\ProblemDetailsAuthenticationFailureHandler
            # Throttle the only auth surface: repeated failures per (client IP + email) are rate-limited so a
            # leaked credential list cannot be sprayed. Pairs with the timing-equalised UserProvider so neither
            # the 401 body nor its latency leaks which accounts exist.
            login_throttling:
                max_attempts: 5

    # No access_control: default-deny + the public-route allowlist (and the 401 on protected routes) land
    # in AF-1.3; #[IsGranted] on the audit read routes lands in Epic 3. A missing entry point is fine while
    # nothing triggers one (single json_login authenticator, no access_control).

when@test:
    security:
        password_hashers:
            Erpify\Backoffice\Identity\Infrastructure\Security\SecurityUser:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
