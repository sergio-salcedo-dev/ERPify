security:
    # Verification resolves the algorithm from each stored hash, so a CLI-minted hash and the firewall
    # check always agree. The CLI's PasswordHasher adapter selects this same hasher by SecurityUser::class.
    password_hashers:
        Erpify\Iam\Identity\Infrastructure\Security\SecurityUser: 'auto'

    # Loads the identity by its email identifier; a blank/unknown identifier maps to "user not found".
    providers:
        identity_user_provider:
            id: Erpify\Iam\Identity\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: identity_user_provider
            # Admission gate between proving credentials and minting a session: rejects INVITED pre-auth (→
            # uniform 401) and SUSPENDED/DEACTIVATED post-auth (→ 403 wall), so authentication never mints a
            # session for a non-ACTIVE identity.
            user_checker: Erpify\Iam\Identity\Infrastructure\Security\UserChecker
            json_login:
                check_path: identity_login
                username_path: email
                password_path: password
                failure_handler: Erpify\Iam\Identity\Infrastructure\Security\ProblemDetailsAuthenticationFailureHandler
            # Throttle the only auth surface: repeated failures per (client IP + email) are rate-limited so a
            # leaked credential list cannot be sprayed. The 401 body does not distinguish which accounts exist;
            # the latency half of that claim rests on the timing-equalised UserProvider dominating an
            # unmeasured, transaction-shaped differential on the failure-recording path (issue #881).
            login_throttling:
                max_attempts: 5

    # Default-deny: every /api route needs an authenticated session unless it is on this allowlist, which is
    # the complete set of routes with a legitimate unauthenticated caller — the login handshake, the one
    # liveness probe the deploy and CI smoke steps and the public status page reach, and the dev hot-reload
    # poll the PWA layout fires before any session exists. Every entry is classified in
    # api/.public-access-exemptions, and `make php.lint.public-access` fails on an addition, a removal or a
    # widening that file does not carry — including the two spellings that admit an anonymous caller without
    # naming PUBLIC_ACCESS at all: a rule keyed on `route:`, and one whose `roles` are absent or empty.
    # First match wins, so the catch-all is last; it is scoped to `^/api` (not `^/`) so /_dev, /_wdt,
    # /.well-known/mercure and the reverse-proxied PWA stay outside the firewall's remit. An unauthenticated
    # hit raises AccessDeniedException, which UnauthenticatedAccessListener turns into a 401 through the
    # Problem Details pipeline; adding a protected route needs no config — it falls through to the catch-all.
    access_control:
        - { path: '^/api/v1/backoffice/login$', roles: PUBLIC_ACCESS }
        # Invitation accept is a pre-identity write, but stays a PUBLIC_ACCESS route INSIDE the main firewall
        # (not a security:false firewall) so Security::login can resolve the firewall and mint the first session.
        - { path: '^/api/v1/backoffice/invitations/accept$', roles: PUBLIC_ACCESS }
        # Password recovery is pre-identity by definition: a locked-out or forgotten-password user has no
        # session. All three endpoints are same-origin-guarded (RecoveryOriginListener) and answer uniformly.
        - { path: '^/api/v1/backoffice/forgot-password$', roles: PUBLIC_ACCESS }
        - { path: '^/api/v1/backoffice/reset-password$', roles: PUBLIC_ACCESS }
        # The recovery-secret redemption: the only edge a locked-out sole administrator has, and pre-identity
        # by construction — they hold no session, and the lockout that put them here is keyed by an address
        # anyone can learn. Inside the main firewall like its siblings so the login seam can mint the session.
        - { path: '^/api/v1/backoffice/recovery/redeem$', roles: PUBLIC_ACCESS }
        # The one liveness route with anonymous consumers: the deploy smoke test (scripts/deploy/deploy.sh),
        # the CI smoke steps (.github/workflows/ci.yml) and the public /status page, which mounts outside
        # RequireAuth. A static payload that probes nothing.
        # The anchored `$` is load-bearing: everything one segment deeper — the database probe included — must
        # NOT inherit this exemption. A deep probe costs a Postgres round-trip per anonymous request (a DoS
        # amplifier) and discloses dependency state to whoever asks, so it falls through to the catch-all and
        # requires a session like the rest of `/api`. That is a session, not a permission — no health
        # controller carries #[IsGranted], unlike every other backoffice controller.
        #
        # The backoffice liveness route is deliberately NOT here. It is served by the same PHP process off the
        # same static payload, so this route answering already proves that process alive; its own page mounts
        # behind RequireAuth and had no anonymous consumer left once the runbooks were pointed here.
        - { path: '^/api/v1/health$', roles: PUBLIC_ACCESS }
        # Anchored to the one route it exempts, not to the `/dev/` prefix: the controllers under it are
        # #[When]-guarded out of prod, but a prefix pattern would exempt any future `/dev/` route before its
        # author chose a guard. An unexempted one falls through to the catch-all and fails closed.
        - { path: '^/api/v1/dev/frankenphp-hot-reload$', roles: PUBLIC_ACCESS }
        # `/api/test/*` are when@test-only throwaway routes that drive the error pipeline through a real
        # kernel; this rule is inert in prod, where those routes are not registered.
        - { path: '^/api/test/', roles: PUBLIC_ACCESS }
        - { path: '^/api', roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Erpify\Iam\Identity\Infrastructure\Security\SecurityUser:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
