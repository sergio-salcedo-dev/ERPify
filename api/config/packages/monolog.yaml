monolog:
    channels:
        - deprecation
        - messenger
        - mercure
        - audit
        # Dedicated stream for the cursor-pagination D-Obs events (keyset_search / invalid_cursor).
        # MUST stay off the `fingers_crossed` handlers below: those buffer until a 5xx and discard
        # everything otherwise, which would drop these non-error metric lines in prod.
        - observability

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!observability"]
                formatter: monolog.formatter.line
            stderr:
                type: stream
                path: php://stderr
                level: debug
                channels: ["!event", "!observability"]
                formatter: monolog.formatter.line
            observability:
                type: stream
                path: "%kernel.logs_dir%/observability.log"
                level: info
                channels: [observability]
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event", "!observability"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            observability:
                type: stream
                path: "%kernel.logs_dir%/observability.log"
                level: info
                channels: [observability]
                formatter: monolog.formatter.json

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!observability"]
                buffer_size: 50
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            # Always-on JSON stream (NOT fingers_crossed) so the cursor-pagination metric lines are
            # never buffered away. The cursor-pagination metrics carry an `event` key and parse by it;
            # the swallow reports and sweep findings that share the stream do not, so a reader filters by
            # message rather than assuming one shape.
            observability:
                type: stream
                channels: [observability]
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            # Sentry wiring — uncomment when sentry/sentry-symfony is installed.
            # Pattern: fingers_crossed triggers on error, buffer holds context,
            # service handler ships to Sentry. Keeps stderr as the primary
            # transport; Sentry is an additional sink, not a replacement.
            # sentry:
            #     type: fingers_crossed
            #     action_level: error
            #     handler: sentry_buffer
            #     buffer_size: 100
            #     channels: ["!event", "!security", "!observability"]
            # sentry_buffer:
            #     type: buffer
            #     handler: sentry_handler
            # sentry_handler:
            #     type: service
            #     id: Sentry\Monolog\Handler
