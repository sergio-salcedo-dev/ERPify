# Loaded only when Behat is running (Kernel::configureContainer checks
# $_ENV['BEHAT_RUNNING'], set by api/tests/Behat/bootstrap.php). Keeps the step
# contexts and their collaborators out of the PHPUnit container, which has no
# use for them.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    # Every NodeModifier is tagged explicitly here rather than via an attribute on the
    # interface: _instanceof is independent of attribute autoconfiguration, so the
    # NodeModifierLocator iterable can never silently end up empty (guarded at build time
    # by EmptyNodeModifierRegistryException).
    _instanceof:
        Erpify\Tests\Behat\NodeModifier\NodeModifierInterface:
            tags: ['test.node_modifier']

    Erpify\Tests\Behat\Context\:
        resource: '../tests/Behat/Context/*'
        exclude: '../tests/Behat/Context/Abstraction/*'

    Erpify\Tests\Behat\NodeModifier\:
        resource: '../tests/Behat/NodeModifier/*'
        exclude:
            - '../tests/Behat/NodeModifier/AbstractNodeModifier.php'
            - '../tests/Behat/NodeModifier/NodeModifierInterface.php'
            - '../tests/Behat/NodeModifier/Exception/*'

    Erpify\Tests\Behat\State\:
        resource: '../tests/Behat/State/*'

    Erpify\Tests\Behat\Doctrine\:
        resource: '../tests/Behat/Doctrine/*'

    Erpify\Tests\Behat\Context\HttpRequestContext:
        arguments:
            $baseUrl: '/api/v1'

    Erpify\Tests\Behat\Context\HttpResponseContext:
        arguments:
            $serverPort: 80
