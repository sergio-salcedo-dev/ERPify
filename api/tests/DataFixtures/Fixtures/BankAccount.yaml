Erpify\Backoffice\BankAccount\Domain\Entity\BankAccount:
    # Every create() argument set explicitly, including the optional bic/alias
    # and the currency/status enums. status is non-default to confirm the enum
    # argument reaches the column rather than the create() default.
    bank_account_globex_corporation:
        __factory:
            Erpify\Backoffice\BankAccount\Domain\Entity\BankAccount::create:
                - '33333333-3333-7000-8000-000000000001'
                - '@bank_jpmorgan_chase'
                - 'Globex Corporation'
                - 'DE89370400440532013000'
                - 'DEUTDEFFXXX'
                - 'Globex Treasury'
                - !php/enum Erpify\Shared\Domain\Enum\Currency::EUR
                - !php/enum Erpify\Backoffice\BankAccount\Domain\Enum\BankAccountStatus::INACTIVE
    # Minimal: only the required arguments; bic/alias stay null and
    # currency/status fall back to the create() defaults (EUR / ACTIVE).
    bank_account_initech_llc:
        __factory:
            Erpify\Backoffice\BankAccount\Domain\Entity\BankAccount::create:
                - '33333333-3333-7000-8000-000000000002'
                - '@bank_of_america'
                - 'Initech LLC'
                - 'FR1420041010050500013M02606'
