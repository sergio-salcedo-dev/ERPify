Erpify\Iam\Identity\Domain\Entity\User:
    user_alice:
        # dev/test seed only — credentials are NEVER seeded into migrations. The factory hashes this
        # plaintext (bcrypt) so the login flow can authenticate as alice@erpify.test / alice-password.
        # The default session for every non-@anonymous scenario: MANAGER grants bank read/write/delete so the
        # gated bank routes stay reachable, AUDIT_READER grants the audit trail (which opts out of tiering).
        __factory:
            'Erpify\Tests\DataFixtures\UserFixtureFactory::create':
                - '0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b'
                - 'alice@erpify.test'
                - 'alice-password'
                - ['AUDIT_READER', 'MANAGER']
    user_mallory:
        # An authenticated but role-less user: proves the role gate answers 403 (authenticated, not
        # authorized) rather than 401, distinct from the anonymous baseline.
        __factory:
            'Erpify\Tests\DataFixtures\UserFixtureFactory::create':
                - '0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5c'
                - 'mallory@erpify.test'
                - 'mallory-password'
                - []
    user_trent:
        # A fully-tiered MANAGER who still cannot read the audit trail: proves auditTrail opts out of tier
        # auto-grant, so a generic business tier (read/write/delete) earns no access to the trail.
        __factory:
            'Erpify\Tests\DataFixtures\UserFixtureFactory::create':
                - '0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5d'
                - 'trent@erpify.test'
                - 'trent-password'
                - ['MANAGER']
    user_victor:
        # A VIEWER (read-only tier): granted bank.read, denied bank.write/bank.delete. Pins that the bank read
        # routes are gated read and the write routes are gated write — a write route weakened to bank.read would
        # let Victor through, so the write refusals must stay 403.
        __factory:
            'Erpify\Tests\DataFixtures\UserFixtureFactory::create':
                - '0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e'
                - 'victor@erpify.test'
                - 'victor-password'
                - ['VIEWER']
    user_edith:
        # An EDITOR (read+write tier): granted bank.read/bank.write, denied bank.delete. Pins that the delete
        # route is gated delete specifically — a delete route weakened to bank.write would let Edith through, so
        # the delete refusal must stay 403.
        __factory:
            'Erpify\Tests\DataFixtures\UserFixtureFactory::create':
                - '0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5f'
                - 'edith@erpify.test'
                - 'edith-password'
                - ['EDITOR']
