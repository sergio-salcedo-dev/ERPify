Erpify\Iam\Identity\Domain\Entity\User:
    user_alice:
        # dev/test seed only — credentials are NEVER seeded into migrations. The factory hashes this
        # plaintext (bcrypt) so the login flow can authenticate as alice@erpify.test / alice-password.
        # The default session for every non-@anonymous scenario: MANAGER grants bank read/write/delete so the
        # gated bank routes stay reachable, AUDIT_READER grants the audit trail (which opts out of tiering).
        __factory:
            'Erpify\Tests\DataFixtures\UserFixtureFactory::create':
                - '0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b'
                - 'alice@erpify.test'
                - 'alice-password'
                - ['AUDIT_READER', 'MANAGER']
    user_mallory:
        # An authenticated but role-less user: proves the role gate answers 403 (authenticated, not
        # authorized) rather than 401, distinct from the anonymous baseline.
        __factory:
            'Erpify\Tests\DataFixtures\UserFixtureFactory::create':
                - '0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5c'
                - 'mallory@erpify.test'
                - 'mallory-password'
                - []
    user_trent:
        # A fully-tiered MANAGER who still cannot read the audit trail: proves auditTrail opts out of tier
        # auto-grant, so a generic business tier (read/write/delete) earns no access to the trail.
        __factory:
            'Erpify\Tests\DataFixtures\UserFixtureFactory::create':
                - '0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5d'
                - 'trent@erpify.test'
                - 'trent-password'
                - ['MANAGER']
    user_victor:
        # A VIEWER (read-only tier): granted bank.read, denied bank.write/bank.delete. Pins that the bank read
        # routes are gated read and the write routes are gated write — a write route weakened to bank.read would
        # let Victor through, so the write refusals must stay 403.
        __factory:
            'Erpify\Tests\DataFixtures\UserFixtureFactory::create':
                - '0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5e'
                - 'victor@erpify.test'
                - 'victor-password'
                - ['VIEWER']
    user_edith:
        # An EDITOR (read+write tier): granted bank.read/bank.write, denied bank.delete. Pins that the delete
        # route is gated delete specifically — a delete route weakened to bank.write would let Edith through, so
        # the delete refusal must stay 403.
        __factory:
            'Erpify\Tests\DataFixtures\UserFixtureFactory::create':
                - '0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5f'
                - 'edith@erpify.test'
                - 'edith-password'
                - ['EDITOR']
    user_ingrid:
        # INVITED: identity + membership provisioned by invitation, credential not set yet (no password). A
        # login attempt is indistinguishable from an unknown email — pre-identity, so it collapses to a 401.
        __factory:
            'Erpify\Tests\DataFixtures\UserFixtureFactory::create':
                - '0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60'
                - 'ingrid@erpify.test'
                - 'ingrid-password'
                - ['VIEWER']
                - 'INVITED'
    user_sam:
        # SUSPENDED with a correct credential: authenticates (identity proven), then hits the post-identity
        # wall — 403 account-suspended, and no session cookie is set.
        __factory:
            'Erpify\Tests\DataFixtures\UserFixtureFactory::create':
                - '0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a61'
                - 'sam@erpify.test'
                - 'sam-password'
                - ['MANAGER']
                - 'SUSPENDED'
    user_dan:
        # DEACTIVATED with a correct credential: authenticates, then hits the generic 403 forbidden wall (no
        # actionable next step), again without any session.
        __factory:
            'Erpify\Tests\DataFixtures\UserFixtureFactory::create':
                - '0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a62'
                - 'dan@erpify.test'
                - 'dan-password'
                - ['MANAGER']
                - 'DEACTIVATED'
    user_nora:
        # ACTIVE, one failed attempt below the lockout threshold (seeded per scenario). The next wrong password
        # trips the lock, emitting a UserLocked event while the anonymous response stays the uniform 401.
        __factory:
            'Erpify\Tests\DataFixtures\UserFixtureFactory::create':
                - '0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a63'
                - 'nora@erpify.test'
                - 'nora-password'
                - []
    user_leo:
        # ACTIVE, seeded locked per scenario. A correct password within the window is walled 403 account-locked;
        # a wrong password stays the uniform 401.
        __factory:
            'Erpify\Tests\DataFixtures\UserFixtureFactory::create':
                - '0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a64'
                - 'leo@erpify.test'
                - 'leo-password'
                - []
    user_lena:
        # ACTIVE with a lapsed lock (seeded per scenario): a successful login admits (204) and clears the counter.
        # Needs a membership so session minting resolves her organization.
        __factory:
            'Erpify\Tests\DataFixtures\UserFixtureFactory::create':
                - '0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a65'
                - 'lena@erpify.test'
                - 'lena-password'
                - ['VIEWER']
