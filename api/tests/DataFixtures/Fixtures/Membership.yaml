Erpify\Organization\Membership\Domain\Entity\Membership:
    membership_alice:
        # Alice references (@user_alice, @the_organization) make Alice persist the user and organization
        # first, so the membership.organization_id FK resolves. Roles mirror the seeded user's role set.
        __factory:
            'Erpify\Tests\DataFixtures\MembershipFixtureFactory::create':
                - '@user_alice'
                - '@the_organization'
                - ['AUDIT_READER']
    membership_mallory:
        __factory:
            'Erpify\Tests\DataFixtures\MembershipFixtureFactory::create':
                - '@user_mallory'
                - '@the_organization'
                - []
    membership_ingrid:
        # Provisioned at invitation time — an INVITED identity already belongs to the org before it activates.
        __factory:
            'Erpify\Tests\DataFixtures\MembershipFixtureFactory::create':
                - '@user_ingrid'
                - '@the_organization'
                - ['VIEWER']
    membership_sam:
        __factory:
            'Erpify\Tests\DataFixtures\MembershipFixtureFactory::create':
                - '@user_sam'
                - '@the_organization'
                - ['MANAGER']
    membership_dan:
        __factory:
            'Erpify\Tests\DataFixtures\MembershipFixtureFactory::create':
                - '@user_dan'
                - '@the_organization'
                - ['MANAGER']
