Erpify\Organization\Membership\Domain\Entity\Membership:
    membership_alice:
        # Alice references (@user_alice, @the_organization) make Alice persist the user and organization
        # first, so the membership.organization_id FK resolves.
        __factory:
            'Erpify\Tests\DataFixtures\MembershipFixtureFactory::create':
                - '@user_alice'
                - '@the_organization'
    membership_mallory:
        __factory:
            'Erpify\Tests\DataFixtures\MembershipFixtureFactory::create':
                - '@user_mallory'
                - '@the_organization'
    membership_ingrid:
        # Provisioned at invitation time — an INVITED identity already belongs to the org before it activates.
        __factory:
            'Erpify\Tests\DataFixtures\MembershipFixtureFactory::create':
                - '@user_ingrid'
                - '@the_organization'
    membership_iris:
        # Provisioned at invitation time — iris belongs to the org before she accepts and activates.
        __factory:
            'Erpify\Tests\DataFixtures\MembershipFixtureFactory::create':
                - '@user_iris'
                - '@the_organization'
    membership_sam:
        __factory:
            'Erpify\Tests\DataFixtures\MembershipFixtureFactory::create':
                - '@user_sam'
                - '@the_organization'
    membership_dan:
        __factory:
            'Erpify\Tests\DataFixtures\MembershipFixtureFactory::create':
                - '@user_dan'
                - '@the_organization'
    membership_lena:
        # Lena logs in successfully after a lapsed lock, so session minting must resolve her organization.
        __factory:
            'Erpify\Tests\DataFixtures\MembershipFixtureFactory::create':
                - '@user_lena'
                - '@the_organization'
    membership_admin:
        # The seeded ADMIN's org-scoped membership. The ADMIN role itself lives on @user_admin — a membership
        # admits the identity to the organization and says nothing about what it may do.
        __factory:
            'Erpify\Tests\DataFixtures\MembershipFixtureFactory::create':
                - '@user_admin'
                - '@the_organization'
