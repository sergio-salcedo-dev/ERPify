# clamd for the Documents scan (compose service `scanner`). Mounted read-only over the image's own file; the
# image only edits that file for `CLAMD_CONF_*` variables, which no compose file sets.
#
# Every limit below is decided by measurement (docs/deployment-guide.md, "Document scanner") and tied to a bound
# elsewhere: StreamMaxLength, MaxFileSize and MaxScanSize are held at or above UploadLimits::MAX_ORIGINAL_BYTES
# (104857600) by DocumentScannerLimitsGateTest, and MaxScanTime stays below ScanPolicy::LEASE_SECONDS so a scan
# clamd gives up on answers before the lease the worker holds expires.

# Plaintext never reaches a persistent layer: this directory is a tmpfs in every compose file.
TemporaryDirectory /run/clamav-scan

# The image's init waits for this socket before it reports clamd started; the application connects over TCP.
LocalSocket /run/clamav/clamd.sock
# The image's healthcheck probes `localhost:3310`, which resolves to ::1 first: with no TCPAddr clamd listens on every
# interface of both families, and a `TCPAddr 0.0.0.0` leaves the container never healthy.
TCPSocket 3310
User clamav
Foreground yes

# No LogFile: a foreground clamd writes to the container's own stdout, so Docker's bounded json-file driver is
# the only sink. (`/dev/stdout` is refused to the unprivileged clamav user: a symbolic link loop.)

# The size ceiling of one INSTREAM. Exactly the largest accepted original.
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 400M
MaxFiles 10000
MaxRecursion 17

# A limit exceeded is an alert (a `Heuristics.Limits.Exceeded` FOUND) and never a silent clean.
AlertExceedsMax yes

# Below the 2 minute scan lease. In milliseconds.
MaxScanTime 90000

# A signature reload pauses scanning instead of holding two engines in memory, which is what the container's
# memory limit is sized for.
ConcurrentDatabaseReload no

MaxThreads 3
ReadTimeout 60
CommandReadTimeout 30
IdleTimeout 30
SendBufTimeout 500
ExitOnOOM yes
