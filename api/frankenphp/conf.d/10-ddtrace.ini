; Datadog APM: the ddtrace extension is installed in the image but turned OFF here by default,
; so the image stays zero-cost and side-effect-free (no agent connection attempts, no overhead)
; until an operator opts in. Enable per-environment with the DD_TRACE_ENABLED env var, which
; OVERRIDES this ini default. (The continuous profiler is NOT installed in this baseline image —
; it has no ini key and is toggled only by DD_PROFILING_ENABLED once installed; see deferred-work.)
; See _bmad-output/implementation-artifacts/spec-datadog-api-foundation-apm.md and
; docs/deployment-guide.md (Observability — Datadog APM).
datadog.trace.enabled = 0
