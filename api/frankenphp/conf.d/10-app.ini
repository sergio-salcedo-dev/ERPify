expose_php = 0
date.timezone = UTC
apc.enable_cli = 1
session.use_strict_mode = 1
zend.detect_unicode = 0

; Function arguments must never appear in a stack trace. Sentry serialises frame `vars` for the whole
; getPrevious() chain, and `send_default_pii: false` does not gate them — so with args captured, an
; exception raised anywhere below a call that took person identifiers ships those identifiers to an
; external error tracker. The GDPR detective controls raise exactly such exceptions by design (a failed
; read propagates so an engineer is paged), which would make the control that exists to prove no person's
; id outlives its erasure the thing that copies those ids somewhere with its own retention.
; Pinned here rather than relied upon: the prod image inherits `On` from php.ini-production and the dev
; image inherits `Off` from php.ini-development, so without this line the guarantee is a property of which
; php.ini the base image happened to copy, and it is absent in the environment developers actually run.
zend.exception_ignore_args = On

; The image canonicalization pipeline decides this number, and nothing else in the tree needs more than the
; 128M the base image's php.ini-production supplies. Measured against the real worker with
; `memory_get_peak_usage()` — never `docker stats`, whose sampling misses a peak that lives for one decode —
; GD holds a truecolor frame at 4 bytes per pixel and `ResizeModifier` clones it, so the peak runs at roughly
; 10 bytes per INPUT pixel: a 20 MP PNG peaks at 191 MiB. At 128M the pipeline therefore died with a FATAL
; error on an ordinary 12 MP phone photo — 3.3x inside the pixel ceiling it was configured to accept — and a
; fatal is not a `Throwable`: in worker mode it takes the worker with it and no Problem Details response is
; ever produced. The pixel ceiling was lowered to match this budget in the same change
; (`erpify.images.max_decoded_pixels`); the two are one decision and `ImagePixelBudgetGateTest` refuses a
; commit that moves either without the other.
;
; The OUTER bound is the container, not this line: prod caps the php service at 1 GiB and FrankenPHP runs
; roughly two workers per core, so a concurrent burst of large uploads is bounded by `PHP_MEM_LIMIT` rather
; than by this ceiling. Sizing that belongs to the epic that exposes an upload endpoint; there is none today.
memory_limit = 256M

; https://symfony.com/doc/current/performance.html
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 32531
opcache.memory_consumption = 256
opcache.enable_file_override = 1
