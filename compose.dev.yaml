---
# Development overrides (monorepo root). Build context: ./api
services:
  mailpit:
    image: axllent/mailpit:v1.30.7@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  php:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: ./api
      target: frankenphp_dev
    depends_on:
      mailpit:
        condition: service_started
    volumes:
      - ./api:/app/api
      - ./api/var:/app/api/var
      # The error-contract drift gate asserts that every marker exception under
      # api/src/Shared/ErrorContract/Domain/Exception/ is cited in docs/api-error-contract.md.
      # The image's build context is ./api, so a repo-root doc is absent from it and `/app`
      # holds nothing but `api/` and `public/` — without this mount the gate has nothing to
      # read. The directory and not the single file: a file bind mount pins one inode, while
      # every ordinary way of changing that doc (IDE safe-write, git checkout, git stash)
      # replaces it by rename, after which the container keeps serving the pre-edit bytes
      # until the service is recreated — and a gate reading a stale doc reports green on a
      # marker the working tree documents nowhere. create_host_path keeps an absent source an
      # error rather than the root-owned directory Docker would otherwise invent there.
      - type: bind
        source: ./docs
        target: /app/docs
        read_only: true
        bind:
          create_host_path: false
      # The schedule-consumption gate asserts that every #[AsSchedule] in api/src has its derived
      # `scheduler_*` transport named in a `messenger:consume` command of BOTH root compose files —
      # without it a schedule ships dead and every other gate stays green. Those files live at the repo
      # root, which the ./api build context does not contain.
      #
      # The DIRECTORY and not the two files, for the reason spelled out on the docs mount above: a
      # single-file bind mount pins one inode, and every ordinary way of changing a compose file (IDE
      # safe-write, git checkout, git stash) replaces it by rename — after which the container keeps
      # serving the pre-edit bytes and the gate passes on wiring the working tree no longer has. The
      # repo root is the only directory that contains them, so this mount is wider than the gate needs.
      #
      # What that width actually is, by category rather than by a file list that ages in a week: the whole
      # working tree, plus .git with its history and remotes, plus — because CLAUDE.md requires every
      # feature to be developed in a linked worktree under .claude/worktrees/ — a complete checkout of
      # every OTHER branch, each able to carry its own gitignored env files. Plus the agent scratch
      # directory tmp/, local tool state under .claude/, and the IDE's .idea/ with its shelved patches.
      # This is stated as an enumeration and not as the absolute "nothing here holds a credential" an
      # earlier revision carried, because that claim was measured inside a worktree — where most of the
      # above does not exist — and it does not survive being re-measured in the primary checkout, whose
      # .idea/shelf/ alone holds several credential-shaped values in never-committed patches.
      #
      # Masking those subtrees with empty mounts was tried and does NOT work, which is worth writing down
      # so nobody pays for the discovery twice: a nested mount needs its mountpoint created inside the
      # parent, the parent here is read_only, and the subtrees that matter are exactly the ones absent
      # from the checkout that runs the stack (a worktree has no .idea/). Docker fails the container with
      # `read-only file system` at create time. Narrowing the source to a compose/ subdirectory is the
      # option that would actually work, and it is not free: ~21 executable references, ~23 relative paths
      # inside the compose files themselves, and five CI build jobs whose action resolves contexts against
      # the compose file's own directory. That is its own change, not a rider on a schedule gate.
      #
      # The exposure is accepted, in these terms: dev-only, read-only, outside the /app/api/public
      # document root, so nothing here is reachable over HTTP and nothing here can be written.
      - type: bind
        source: ./
        target: /app/repo
        read_only: true
        bind:
          create_host_path: false
      - ./api/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./api/frankenphp/worker.Caddyfile:/etc/frankenphp/worker.Caddyfile:ro
      - ./api/frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
    environment:
      # Scope file watching to source dirs so composer installs writing into
      # vendor/ don't trigger a worker reload mid-step.
      # Use `-` (not `:-`) so an explicit empty value disables watching/hot-reload:
      # CI sets these to "" (see ci.yml) to avoid cold-boot worker reloads, but `:-`
      # would treat "" as unset and re-apply the defaults. Unset (local dev) still
      # falls back to the watch/hot_reload defaults below.
      # hot_reload MUST stay scoped too: bare `hot_reload` watches all of /app/api
      # (./**/*.{php,yaml,...}) and the var/cache/test rename storm during in-container
      # test runs crashes the watcher — frankenphp (PID 1) then core-dumps and restarts.
      # No brace-globs here: compose's ${VAR-default} ends at the first `}`.
      FRANKENPHP_WORKER_CONFIG: "${FRANKENPHP_WORKER_CONFIG-watch /app/api/src/**/*.php}"
      FRANKENPHP_SITE_CONFIG: "${FRANKENPHP_SITE_CONFIG-hot_reload /app/api/src/**/*.php /app/api/config/**/*.yaml /app/api/config/**/*.php}"
      MERCURE_EXTRA_DIRECTIVES: demo
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      PHP_IDE_CONFIG: "serverName=${PHP_IDE_SERVER_NAME:-dev}"
      APP_ENV: "${APP_ENV:-dev}"
      MAILER_DSN: "${MAILER_DSN:-smtp://mailpit:1025}"
    extra_hosts:
      - host.docker.internal:host-gateway
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:2019/metrics"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 180s

  pwa:
    # Stable tag for bake + `compose up --no-build` (avoids default erpify-pwa:latest mismatch).
    image: ${IMAGES_PREFIX:-}app-pwa-dev
    build:
      context: ./pwa
      dockerfile: Dockerfile
      target: dev
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://localhost}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-dev}
    volumes:
      - ./pwa:/app/pwa
      - pwa_node_modules:/app/pwa/node_modules
      # Keep Next build artifacts in container-managed volumes so the dev process
      # (root, inside the container) never writes root-owned .next/.next-e2e onto
      # the bind-mounted host tree (caused EACCES on host-side build/clean).
      - pwa_next:/app/pwa/.next
      - pwa_next_e2e:/app/pwa/.next-e2e
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-dev}
      # NEXT_PUBLIC_SENTRY_DSN is intentionally NOT set here: `next dev` reads it
      # from pwa/.env.local (the natural dev source). Setting it in compose with an
      # empty default would shadow .env.local (Next won't override a set env var),
      # leaving the SDK inert. Prod bakes it via the Dockerfile build arg instead.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  database:
    ports:
      - "${POSTGRES_PORT:-15432}:5432"

  # Dev image + bind mount for messenger_worker (service definition continues in compose.yaml).
  messenger_worker:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: ./api
      target: frankenphp_dev
    depends_on:
      mailpit:
        condition: service_started
    environment:
      MAILER_DSN: "${MAILER_DSN:-smtp://mailpit:1025}"
      # Long-running worker in dev: turn debug OFF so the DI container is compiled
      # once and never auto-recompiled, and (below) give it a private var/cache so
      # the web `php` container's recompiles can't delete its container directory
      # mid-flight. Without both, the worker hits a vanished lazy-service file at
      # console.terminate (Sentry ERPIFY-API-DEV-7). Trade-off: the worker no longer
      # hot-reloads code — run `docker compose restart messenger_worker` after handler
      # changes. See docs/troubleshooting/sentry-messenger-worker-dev-cache-crash.md.
      # A restart is NOT enough when a service's CONSTRUCTOR SIGNATURE changes: the
      # compiled factory lives in this private volume, so the worker keeps calling the
      # old signature and dies with ArgumentCountError on a boot loop (exit 255) while
      # the web container, which shares ./api/var, is perfectly healthy. `make sf.cc` does
      # not reach it either — that clear runs in the php container. Drop the volume with
      # `make docker.worker.cache.reset`; `make app.dev` already runs it between the down
      # and the up, so a cold start cannot inherit a stale factory.
      APP_DEBUG: "0"
    volumes:
      - ./api:/app/api
      - ./api/var:/app/api/var
      # Private compiled-container cache. More specific than the ./api/var bind mount
      # above, so it wins for this subtree, isolating the worker from the shared
      # var/cache/dev that `php` rebuilds. var/log and the rest of var/ stay shared.
      - messenger_cache:/app/api/var/cache
      # Mirrors the `php` service: `make php.stan PHP_SERVICE=messenger_worker` is a
      # documented escape hatch for the web container's segfaults, so the gates have to
      # be runnable here too.
      - type: bind
        source: ./docs
        target: /app/docs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./
        target: /app/repo
        read_only: true
        bind:
          create_host_path: false
      - ./api/frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro

volumes:
  pwa_node_modules:
  pwa_next:
  pwa_next_e2e:
  messenger_cache:
