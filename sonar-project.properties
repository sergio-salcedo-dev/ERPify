sonar.projectKey=sergio-salcedo-dev_ERPify
sonar.organization=sergio-salcedo-dev
sonar.host.url=https://sonarcloud.io

sonar.sources=api/src,pwa/src
sonar.tests=api/tests,pwa/tests
sonar.sourceEncoding=UTF-8

sonar.exclusions=api/vendor/**,api/var/**,api/migrations/**,pwa/node_modules/**,pwa/.next/**,**/*.min.js,**/*.min.css
sonar.test.exclusions=api/vendor/**,pwa/node_modules/**

# Test code legitimately repeats arrange/act/assert scaffolding and fixture setup
# (DAMP over DRY keeps each test self-contained and readable), so exclude it from
# copy-paste duplication detection. Production duplication (api/src, pwa/src) is
# still fully enforced by the quality gate.
sonar.cpd.exclusions=api/tests/**,pwa/tests/**

# Coverage report paths — uncomment once PHPUnit (api/tools/phpunit/phpunit.dist.xml)
# and Vitest (pwa/vitest.config.ts) are configured to emit coverage. Today neither
# does, so leaving these unset avoids "report not found" warnings in scans.
#sonar.php.coverage.reportPaths=api/var/coverage/clover.xml
#sonar.javascript.lcov.reportPaths=pwa/coverage/lcov.info
#sonar.typescript.lcov.reportPaths=pwa/coverage/lcov.info
