---
# Production overrides (monorepo root). Build context: ./api and ./pwa
#
# Secrets flow in via `--env-file .env.prod.local` (wired in make/config.mk).
# Required secrets use `${VAR:?msg}` so a missing value aborts `docker compose`
# by name instead of silently falling back to the weak dev defaults that
# compose.yaml keeps for `make app.dev`.
#
# Runtime hardening on every service: `no-new-privileges`, all Linux caps
# dropped then the minimum re-added, and parametrizable CPU/memory ceilings
# (override via the *_CPU_LIMIT / *_MEM_LIMIT knobs in .env.prod.local).
# Minimal caps are a starting point — widen only if a service fails to boot
# (that is an "Ask First" per the spec). Verify with a real `make deploy.local`.
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build:
      context: ./api
      target: frankenphp_prod
    environment:
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required in prod}
      # Require explicit DB identity + password; close the weak fallbacks
      # (erpify_user / erpify_db / erpify_password) that compose.yaml keeps for
      # `make app.dev`. serverVersion/charset stay defaulted — non-secret knobs.
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required in prod}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in prod}@database:5432/${POSTGRES_DB:?POSTGRES_DB is required in prod}?serverVersion=${POSTGRES_VERSION:-18}&charset=${POSTGRES_CHARSET:-utf8}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:?CADDY_MERCURE_JWT_SECRET is required in prod}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:?CADDY_MERCURE_JWT_SECRET is required in prod}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:?CADDY_MERCURE_JWT_SECRET is required in prod}
      # Non-public host served over Caddy's own CA. `tls internal` mints a cert
      # without ACME; clear CADDY_SERVER_EXTRA_DIRECTIVES on a public VPS to let
      # Caddy switch to automatic ACME with the same overlay.
      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME is required in prod}, php:80
      CADDY_SERVER_EXTRA_DIRECTIVES: ${CADDY_SERVER_EXTRA_DIRECTIVES-tls internal}
      DEFAULT_URI: ${DEFAULT_URI:-https://${SERVER_NAME:?SERVER_NAME is required in prod}}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-https://${SERVER_NAME:?SERVER_NAME is required in prod}/.well-known/mercure}
      # Sentry (error + performance monitoring) — REQUIRED in prod (test machine
      # and VPS). Set both in .env.prod.local (DSN from the Sentry MCP; rate ~0.2);
      # `make prod.env.check` and the `:?` guards abort the deploy if either is
      # missing. The Sentry "environment" tag is just APP_ENV (= prod).
      SENTRY_DSN: ${SENTRY_DSN:?SENTRY_DSN is required in prod}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:?SENTRY_TRACES_SAMPLE_RATE is required in prod}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # FrankenPHP/Caddy binds privileged ports 80/443.
      - NET_BIND_SERVICE
    volumes:
      # Flysystem object storage (STORAGE_LOCAL_PATH default). Without a
      # persistent volume uploads are lost on container recreation. Back it up
      # alongside the DB — see docs-info/object-storage.md.
      - storage_data:/app/api/storage
    deploy:
      resources:
        limits:
          cpus: ${PHP_CPU_LIMIT:-2.0}
          memory: ${PHP_MEM_LIMIT:-1g}
    networks:
      - frontend
      - backend

  pwa:
    image: ${IMAGES_PREFIX:-}app-pwa-prod
    build:
      context: ./pwa
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required in prod}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-prod}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:?NEXT_PUBLIC_SENTRY_DSN is required in prod (erpify-pwa-prod DSN)}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Next.js standalone serves from an immutable build, so the root filesystem
    # is read-only. The only runtime writes are scratch (/tmp) and the Next
    # cache (.next/cache: image-optimizer output, ISR/data-cache, fetch-cache).
    # Both are tmpfs (in-memory, wiped on restart) so the root FS stays
    # read-only. The cache is currently dormant — no next/image, no ISR — but
    # `images.remotePatterns` is already wired, so a future <Image remote/> or
    # `export const revalidate` would otherwise EROFS → 500 at runtime and slip
    # past a smoke test that only hits the static "/". The size cap keeps the
    # cache bounded inside the container's memory cgroup (PWA_MEM_LIMIT) so an
    # unbounded optimizer cache degrades to ENOSPC instead of OOM-killing pwa.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: tmpfs
        target: /app/pwa/.next/cache
        tmpfs:
          size: 67108864 # 64 MiB; raise if image optimization is used heavily
    deploy:
      resources:
        limits:
          cpus: ${PWA_CPU_LIMIT:-1.0}
          memory: ${PWA_MEM_LIMIT:-512m}
    networks:
      - frontend

  database:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in prod}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in prod}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Postgres entrypoint chowns the data dir and drops to the postgres user.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: ${DB_CPU_LIMIT:-2.0}
          memory: ${DB_MEM_LIMIT:-1g}
    # Backend-only network + no published port: Postgres is unreachable from
    # the host and the public internet under the prod profile. The pinned IP
    # (DB_BACKEND_IP, overridable) is a stable target for SSH-tunnelled DB GUI
    # clients against a remote box — see docs/vps-deployment.md. This changes
    # nothing about exposure: still internal-only, still no published port.
    networks:
      backend:
        ipv4_address: ${DB_BACKEND_IP:-10.89.0.10}

  messenger_worker:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build:
      context: ./api
      target: frankenphp_prod
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required in prod}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required in prod}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in prod}@database:5432/${POSTGRES_DB:?POSTGRES_DB is required in prod}?serverVersion=${POSTGRES_VERSION:-18}&charset=${POSTGRES_CHARSET:-utf8}
      # null mailer by default so an unset DSN can't break the worker boot.
      MAILER_DSN: ${MAILER_DSN:-null://null}
      # Sentry captures async handler failures too (same required gating as php).
      SENTRY_DSN: ${SENTRY_DSN:?SENTRY_DSN is required in prod}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:?SENTRY_TRACES_SAMPLE_RATE is required in prod}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No privileged port and no daemon — the console consumer needs no caps.
    volumes:
      # Same object-storage volume as the php service: async handlers must see
      # the same files the web container wrote (StoredObjectOrphanCleaner runs in
      # this worker too). See docs-info/object-storage.md for the shared-store requirement.
      - storage_data:/app/api/storage
    deploy:
      resources:
        limits:
          cpus: ${WORKER_CPU_LIMIT:-1.0}
          memory: ${WORKER_MEM_LIMIT:-512m}
    # frontend = outbound SMTP egress; backend = reach Postgres.
    networks:
      - frontend
      - backend
    # Consumes ONLY `async`. The Doctrine transport's FOR UPDATE SKIP LOCKED hands each queued
    # message to exactly one consumer, so this pool is safe to scale horizontally
    # (`docker compose up --scale messenger_worker=N`). The daily maintenance schedule is split
    # out to the single `scheduler_worker` below so it ticks once, not once per replica.
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--limit=10000", "--memory-limit=256M"]

  # Single-replica scheduler. Symfony Scheduler derives the daily maintenance tick
  # (PruneHandledDomainEventsMessage) from an in-process clock, so running it on the scaled
  # `messenger_worker` pool would emit one tick per replica — N redundant prunes a day.
  # Isolating the `scheduler_maintenance` transport on this single instance keeps exactly one
  # clock running. MUST stay at replicas: 1; scaling it reintroduces the duplicate-tick problem.
  # Lifting that constraint (lock the schedule, then scale freely) needs symfony/lock, which the
  # project deliberately does not install — tracked as a follow-up.
  scheduler_worker:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build:
      context: ./api
      target: frankenphp_prod
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      # Wait for php: its entrypoint runs the migration that creates handled_domain_event
      # before the first prune tick can DELETE from it.
      php:
        condition: service_healthy
    # Mirrors messenger_worker: a console consumer, not FrankenPHP, so the image's Caddy
    # healthcheck can't apply. Probe that PID 1 (the consume process) is alive — `up --wait`
    # requires a healthcheck on every waited service.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    working_dir: /app/api
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required in prod}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required in prod}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in prod}@database:5432/${POSTGRES_DB:?POSTGRES_DB is required in prod}?serverVersion=${POSTGRES_VERSION:-18}&charset=${POSTGRES_CHARSET:-utf8}
      # Set explicitly (no base service to inherit from); the async transport is never
      # consumed here but the receiver registry still resolves the DSN at boot.
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      # Sentry captures prune failures too (same required gating as php/messenger_worker).
      SENTRY_DSN: ${SENTRY_DSN:?SENTRY_DSN is required in prod}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:?SENTRY_TRACES_SAMPLE_RATE is required in prod}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # frontend = Sentry egress; backend = reach Postgres. No object-storage volume: the prune
    # is a pure DB DELETE and never touches Flysystem.
    networks:
      - frontend
      - backend
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: ${SCHEDULER_CPU_LIMIT:-0.25}
          memory: ${SCHEDULER_MEM_LIMIT:-256m}
    command: ["php", "bin/console", "messenger:consume", "scheduler_maintenance", "--time-limit=3600", "--memory-limit=256M"]

volumes:
  # Uploaded stored-objects (Flysystem local adapter). Survives container
  # recreation; include it in the backup plan next to database_data.
  storage_data:

# frontend: host-facing + inter-service. backend: internal-only (no egress,
# no host port) so the database is fully isolated. mailpit lives in the dev
# overlay only, so naming networks here never touches dev.
networks:
  frontend:
  backend:
    internal: true
    # Fixed subnet so the database keeps a stable IP across restarts (see the
    # `database` service's ipv4_address). Override DB_BACKEND_SUBNET (and
    # DB_BACKEND_IP within it) in .env.prod.local if it clashes with an existing
    # network on the host.
    ipam:
      config:
        - subnet: ${DB_BACKEND_SUBNET:-10.89.0.0/24}
