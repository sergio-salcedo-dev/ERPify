---
# Production overrides (monorepo root). Build context: ./api and ./pwa
#
# Secrets flow in via `--env-file .env.prod.local` (wired in make/config.mk).
# Required secrets use `${VAR:?msg}` so a missing value aborts `docker compose`
# by name instead of silently falling back to the weak dev defaults that
# compose.yaml keeps for `make app.dev`.
#
# Runtime hardening on every service: `no-new-privileges`, all Linux caps
# dropped then the minimum re-added, and parametrizable CPU/memory ceilings
# (override via the *_CPU_LIMIT / *_MEM_LIMIT knobs in .env.prod.local).
# Minimal caps are a starting point — widen only if a service fails to boot
# (that is an "Ask First" per the spec). Verify with a real `make deploy.local`.

# Same bound, and the values are literals for the same reason — see the note on compose.yaml's
# `x-logging`. Repeated rather than shared because a YAML anchor does not cross files: Compose merges
# the SERVICE maps, never the anchors, so each overlay has to spell the bound for the services it is
# the first to introduce. Services it merely overrides inherit compose.yaml's block untouched.
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build:
      context: ./api
      target: frankenphp_prod
    environment:
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required in prod}
      AUDIT_KEK: ${AUDIT_KEK:?AUDIT_KEK is required in prod (32-byte audit crypto-shredding key-encryption key)}
      # Require explicit DB identity + password; close the weak fallbacks
      # (erpify_user / erpify_db / erpify_password) that compose.yaml keeps for
      # `make app.dev`. serverVersion/charset stay defaulted — non-secret knobs.
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required in prod}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in prod}@database:5432/${POSTGRES_DB:?POSTGRES_DB is required in prod}?serverVersion=${POSTGRES_VERSION:-18}&charset=${POSTGRES_CHARSET:-utf8}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:?CADDY_MERCURE_JWT_SECRET is required in prod}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:?CADDY_MERCURE_JWT_SECRET is required in prod}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:?CADDY_MERCURE_JWT_SECRET is required in prod}
      # Non-public host served over Caddy's own CA. `tls internal` mints a cert
      # without ACME; clear CADDY_SERVER_EXTRA_DIRECTIVES on a public VPS to let
      # Caddy switch to automatic ACME with the same overlay.
      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME is required in prod}, php:80
      CADDY_SERVER_EXTRA_DIRECTIVES: ${CADDY_SERVER_EXTRA_DIRECTIVES-tls internal}
      DEFAULT_URI: ${DEFAULT_URI:-https://${SERVER_NAME:?SERVER_NAME is required in prod}}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-https://${SERVER_NAME:?SERVER_NAME is required in prod}/.well-known/mercure}
      # Sentry (error + performance monitoring) — REQUIRED in prod (test machine
      # and VPS). Set both in .env.prod.local (DSN from the Sentry MCP; rate ~0.2);
      # `make prod.env.check` and the `:?` guards abort the deploy if either is
      # missing. The Sentry "environment" tag is just APP_ENV (= prod).
      SENTRY_DSN: ${SENTRY_DSN:?SENTRY_DSN is required in prod}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:?SENTRY_TRACES_SAMPLE_RATE is required in prod}
      # This service sends the token-bearing security mail (invitation, password reset), and declared neither
      # of these, so prod inherited api/.env: the null:// discard transport, and a sender at a domain that
      # receives nothing. Required rather than defaulted for the same reason as on the two workers.
      MAILER_DSN: ${MAILER_DSN:?MAILER_DSN is required in prod (null://null discards mail silently)}
      MAILER_SECURITY_FROM: ${MAILER_SECURITY_FROM:?MAILER_SECURITY_FROM is required in prod (a monitored, replyable mailbox)}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # FrankenPHP/Caddy binds privileged ports 80/443.
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: ${PHP_CPU_LIMIT:-2.0}
          memory: ${PHP_MEM_LIMIT:-1g}
    networks:
      - frontend
      - backend

  pwa:
    image: ${IMAGES_PREFIX:-}app-pwa-prod
    build:
      context: ./pwa
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required in prod}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-prod}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:?NEXT_PUBLIC_SENTRY_DSN is required in prod (erpify-pwa-prod DSN)}
        # Not secrets — an org and a project slug. The token is NOT here on
        # purpose: a build arg is recorded in the image and `docker history`
        # prints it, so it rides the secret mount below instead.
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
      secrets:
        - sentry_auth_token
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Next.js standalone serves from an immutable build, so the root filesystem
    # is read-only. The only runtime writes are scratch (/tmp) and the Next
    # cache (.next/cache: image-optimizer output, ISR/data-cache, fetch-cache).
    # Both are tmpfs (in-memory, wiped on restart) so the root FS stays
    # read-only. The cache is currently dormant — no next/image, no ISR — but
    # `images.remotePatterns` is already wired, so a future <Image remote/> or
    # `export const revalidate` would otherwise EROFS → 500 at runtime and slip
    # past a smoke test that only hits the static "/". The size cap keeps the
    # cache bounded inside the container's memory cgroup (PWA_MEM_LIMIT) so an
    # unbounded optimizer cache degrades to ENOSPC instead of OOM-killing pwa.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: tmpfs
        target: /app/pwa/.next/cache
        tmpfs:
          size: 67108864 # 64 MiB; raise if image optimization is used heavily
    deploy:
      resources:
        limits:
          cpus: ${PWA_CPU_LIMIT:-1.0}
          memory: ${PWA_MEM_LIMIT:-512m}
    networks:
      - frontend

  database:
    # The other services declare this and this one did not, which is the asymmetry that bites: a
    # daemon restart brings php, pwa and messenger_worker back against a database that never
    # returns, because `depends_on` orders a `compose up` and has no say in the daemon's own
    # restart pass. The resulting shape was observed in dev, where a stack whose database was down
    # left php and messenger_worker looping on "Still waiting for database to be ready" for hours
    # while every container it depended on reported itself running.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in prod}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in prod}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Postgres entrypoint chowns the data dir and drops to the postgres user.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: ${DB_CPU_LIMIT:-2.0}
          memory: ${DB_MEM_LIMIT:-1g}
    # Backend-only network + no published port: Postgres is unreachable from
    # the host and the public internet under the prod profile. The pinned IP
    # (DB_BACKEND_IP, overridable) is a stable target for SSH-tunnelled DB GUI
    # clients against a remote box — see docs/vps-deployment.md. This changes
    # nothing about exposure: still internal-only, still no published port.
    networks:
      backend:
        ipv4_address: ${DB_BACKEND_IP:-10.89.0.10}

  messenger_worker:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build:
      context: ./api
      target: frankenphp_prod
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required in prod}
      AUDIT_KEK: ${AUDIT_KEK:?AUDIT_KEK is required in prod (32-byte audit crypto-shredding key-encryption key)}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required in prod}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in prod}@database:5432/${POSTGRES_DB:?POSTGRES_DB is required in prod}?serverVersion=${POSTGRES_VERSION:-18}&charset=${POSTGRES_CHARSET:-utf8}
      # Required, never defaulted: null://null accepts security mail and drops it while reporting success, so
      # a caller that records state on a confirmed send (the lockout notice stamps a 24h suppression window)
      # records it for mail that was never transmitted. An unsolicited notice produces no complaint when it
      # fails to arrive, so nothing else would ever contradict it. MAILER_SECURITY_FROM was in no compose
      # file: prod fell through to api/.env's seguridad@erpify.local, a domain that receives nothing.
      MAILER_DSN: ${MAILER_DSN:?MAILER_DSN is required in prod (null://null discards mail silently)}
      MAILER_SECURITY_FROM: ${MAILER_SECURITY_FROM:?MAILER_SECURITY_FROM is required in prod (a monitored, replyable mailbox)}
      # Sentry captures async handler failures too (same required gating as php).
      SENTRY_DSN: ${SENTRY_DSN:?SENTRY_DSN is required in prod}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:?SENTRY_TRACES_SAMPLE_RATE is required in prod}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No privileged port and no daemon — the console consumer needs no caps.
    deploy:
      resources:
        limits:
          cpus: ${WORKER_CPU_LIMIT:-1.0}
          memory: ${WORKER_MEM_LIMIT:-512m}
    # frontend = outbound SMTP egress; backend = reach Postgres.
    networks:
      - frontend
      - backend
    # Consumes `async` (domain events). The Doctrine transport's FOR UPDATE SKIP LOCKED hands each queued
    # message to exactly one consumer, so this pool is safe to scale horizontally
    # (`docker compose up --scale messenger_worker=N`). The daily maintenance schedule is split
    # out to the single `scheduler_worker` below so it ticks once, not once per replica. Audit `activity`
    # rows are written synchronously on kernel.terminate, so no audit queue is consumed here.
    # Below the ini's `memory_limit` on purpose. Equal to it, `StopWorkerOnMemoryLimitListener` can
    # only fire where PHP has already fatalled, so the graceful stop is unreachable and the worker is
    # taken down instead of retired. 224M keeps 32 MiB below the 256M ceiling and stays above the
    # 191 MiB peak the image pipeline measures at its configured ceiling, so an ordinary large upload
    # retires nothing while a genuine leak still does.
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--limit=10000", "--memory-limit=224M"]

  # Single-replica scheduler. Symfony Scheduler derives every maintenance tick
  # (PruneHandledDomainEventsMessage, the failure-transport PruneFailedMessagesMessage, the hourly
  # ReportDeadLetterBacklogMessage, the audit retention PruneAuditLogMessage, ReconcileSubjectErasuresMessage,
  # the person-reference ReconcilePersonReferencesMessage, the stored-identity InspectStoredIdentityMessage,
  # the session PruneRetiredSessionsMessage and the five-minute NotifyLockedIdentitiesMessage) from an
  # in-process clock, so running it on the scaled `messenger_worker` pool would emit one tick per replica.
  # This list is prose and nothing recomputes it: the schedule gate reasons by transport NAME, so a tick
  # missing here is invisible to every check. It has drifted twice; add yours when you add the message.
  #
  # THE STAKES OF THE PIN CHANGED with the lockout notice, and it is no longer only about waste. Every other
  # tick is an idempotent sweep, so N replicas cost N redundant runs a day. This one SENDS MAIL TO A
  # PERSON, and it sends before it stamps the suppression window (deliberately — stamping first would turn a
  # mailer outage into a day of silence about a live lock). Two clocks would therefore race send-then-stamp
  # and deliver the notice twice, at someone whose account an attacker is already driving. The schedules are
  # `->stateful()` but not `->lock()`ed, so the checkpoint does not serialise them: it is SHARED STATE, not
  # exclusion. `MessageGenerator` re-reads the pool each poll and suppresses a tick the other replica already
  # saved, so a second replica CAN duplicate rather than always duplicating — the window runs from the
  # winner's `acquire()` to its `save()`, which happens after the handler returns. The eight idempotent
  # sweeps would mostly collapse in that race; this one holds the window open for an SMTP exchange, which is
  # why it is the tick that decides the pin.
  # Isolating the `scheduler_maintenance` + `scheduler_audit_maintenance` + `scheduler_identity_maintenance`
  # transports on this single instance is what keeps the clock count at one. Every #[AsSchedule] in src/ owes
  # its transport a slot in BOTH consume commands (this one and the dev messenger_worker's) — a schedule whose
  # transport nobody consumes ships dead with every gate green, which is what
  # `make php.lint.schedule-consumption` exists to refuse.
  #
  # MUST stay at replicas: 1 — but read what that declaration is and is not. IT DOES NOT ENFORCE ANYTHING.
  # Measured by running it, not by planning it: two otherwise identical services, one with
  # `deploy.replicas: 1` and one with no count, both answered `docker compose up -d --scale svc=2` with TWO
  # RUNNING CONTAINERS and exit 0. Compose treats the value as a default, never as a ceiling.
  # What the declaration buys is a diff. `ScheduleConsumptionGateTest` refuses any of the three root compose
  # files giving this consumer more than one replica, and refuses THIS file declaring none — so a duplicated
  # clock committed to the repository goes red, while one asked for on a command line leaves no trace any
  # gate here can read.
  # Closing that second vector needs `->lock()`, hence symfony/lock, which the project deliberately does not
  # install. Decided in #261 (wontfix), whose closing comment carries this asymmetry as the recorded cost:
  # the dependency buys freedom to scale a worker nothing is saturating, and the invariant it would protect
  # has no live violator — the deploy path (`make deploy.local`, or `ENV=prod make docker.up.wait`;
  # docs/vps-deployment.md) passes no `--scale`.
  scheduler_worker:
    image: ${IMAGES_PREFIX:-}app-php-prod
    logging: *bounded-logging
    build:
      context: ./api
      target: frankenphp_prod
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      # Wait for php: its entrypoint runs the migration that creates handled_domain_event
      # before the first prune tick can DELETE from it.
      php:
        condition: service_healthy
    # Mirrors messenger_worker: a console consumer, not FrankenPHP, so the image's Caddy
    # healthcheck can't apply. Probe that PID 1 (the consume process) is alive — `up --wait`
    # requires a healthcheck on every waited service.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    working_dir: /app/api
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required in prod}
      AUDIT_KEK: ${AUDIT_KEK:?AUDIT_KEK is required in prod (32-byte audit crypto-shredding key-encryption key)}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required in prod}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in prod}@database:5432/${POSTGRES_DB:?POSTGRES_DB is required in prod}?serverVersion=${POSTGRES_VERSION:-18}&charset=${POSTGRES_CHARSET:-utf8}
      # Set explicitly (no base service to inherit from); the async transport is never
      # consumed here but the receiver registry still resolves the DSN at boot.
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
      # Required for the same reason as on php: this is the worker that sends the lockout notice.
      MAILER_DSN: ${MAILER_DSN:?MAILER_DSN is required in prod (null://null discards mail silently)}
      MAILER_SECURITY_FROM: ${MAILER_SECURITY_FROM:?MAILER_SECURITY_FROM is required in prod (a monitored, replyable mailbox)}
      # Set explicitly for the same reason as the DSN above: no base service to inherit it from. This is
      # the tick that mails a person every five minutes on one replica, so a slow socket here costs the
      # clock rather than a request. Per socket operation, not per send — see api/.env for the arithmetic.
      MAILER_SMTP_TIMEOUT: ${MAILER_SMTP_TIMEOUT:-3}
      # Sentry captures prune failures too (same required gating as php/messenger_worker).
      SENTRY_DSN: ${SENTRY_DSN:?SENTRY_DSN is required in prod}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:?SENTRY_TRACES_SAMPLE_RATE is required in prod}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # frontend = Sentry egress; backend = reach Postgres.
    networks:
      - frontend
      - backend
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: ${SCHEDULER_CPU_LIMIT:-0.25}
          memory: ${SCHEDULER_MEM_LIMIT:-256m}
    # Below the ini's `memory_limit` on purpose. Equal to it, `StopWorkerOnMemoryLimitListener` can
    # only fire where PHP has already fatalled, so the graceful stop is unreachable and the worker is
    # taken down instead of retired. 224M keeps 32 MiB below the 256M ceiling and stays above the
    # 191 MiB peak the image pipeline measures at its configured ceiling, so an ordinary large upload
    # retires nothing while a genuine leak still does.
    command: ["php", "bin/console", "messenger:consume", "scheduler_maintenance", "scheduler_audit_maintenance", "scheduler_identity_maintenance", "--time-limit=3600", "--memory-limit=224M"]

# Build-time only. The Sentry auth token grants write access to the project, so
# it rides a BuildKit secret mount rather than a build arg: an arg is recorded in
# the image and `docker history` prints it to anyone who can pull. Sourced from
# the environment (.env.prod.local), where it is declared EMPTY by default —
# empty means "build without uploading source maps", which is not an error, so a
# rehearsal build on a machine with no Sentry credentials still succeeds.
secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN

# frontend: host-facing + inter-service. backend: internal-only (no egress,
# no host port) so the database is fully isolated. mailpit lives in the dev
# overlay only, so naming networks here never touches dev.
networks:
  frontend:
  backend:
    internal: true
    # Fixed subnet so the database keeps a stable IP across restarts (see the
    # `database` service's ipv4_address). Override DB_BACKEND_SUBNET (and
    # DB_BACKEND_IP within it) in .env.prod.local if it clashes with an existing
    # network on the host.
    ipam:
      config:
        - subnet: ${DB_BACKEND_SUBNET:-10.89.0.0/24}
