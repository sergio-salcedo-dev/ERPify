name: Full setup
description: Node + Docker
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: pwa/package-lock.json

    - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
