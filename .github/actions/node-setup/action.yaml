name: Node setup
description: Setup Node.js with cache
runs:
  using: "composite"
  steps:
    # 24.15.0 is the floor npm 12 declares for the 24.x line (engines:
    # ^22.22.2 || ^24.15.0 || >=26.0.0); a bare "24" can resolve lower and
    # fail the global install below.
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "24.15.0"
        cache: npm
        cache-dependency-path: pwa/package-lock.json

    # Node ships its own npm (11.x); pin explicitly so CI, the pwa image and
    # dev machines resolve dependencies with one npm. corepack is not an
    # option — Node no longer bundles it (absent from the pwa image).
    - run: npm install --global npm@12.0.1
      shell: bash
