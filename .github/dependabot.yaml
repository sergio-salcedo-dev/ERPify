version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /api
      - /pwa
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7

  # `docker-compose`, not a `/` entry on the `docker` lane above. The two are separate
  # ecosystems with separate file fetchers, and the docker one cannot see a compose file:
  # it globs `*.ya?ml` but then keeps only what `likely_kubernetes_resource?` accepts —
  # a mapping carrying BOTH `apiVersion` and `kind`. No compose file has either, so the
  # docker lane pointed at `/` fetches nothing and never opens a PR, the same silent
  # no-op documented on the composer lane below.
  #
  # This lane is what watches the root compose pins. It matters because compose.prod.yaml
  # declares no `image:` on its `database` service: production inherits the postgres pin
  # from compose.yaml, so before this entry the image running the production database was
  # the one image in the tree nothing was tracking.
  #
  # Reach: the fetcher's filename regex is /(docker-)?compose(-[\w]+)?(?>\.[\w-]+)?\.ya?ml/i
  # and the listing is non-recursive, so it takes compose.yaml, compose.dev.yaml and
  # compose.prod.yaml and nothing else. The locally-built `${IMAGES_PREFIX:-}app-*` services
  # parse to nothing and are dropped without error, so they generate no noise here.
  #
  # An image reference is only tracked if it yields a tag or a digest; a bare
  # `axllent/mailpit` yields neither and is skipped as silently as an interpolated tag.
  # Pin every image this lane is meant to watch.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7

  # `/api`, not `/`: the repo root holds no composer.json — the manifest is
  # api/composer.json. Pointed at `/` this lane produced ZERO routine PRs in
  # four months while npm produced ~40, and the only two composer PRs ever
  # (#138, #536) say "in the /api directory" because SECURITY updates walk the
  # dependency graph and ignore this `directory:` entirely. A version-update
  # lane aimed at a directory with no manifest fails silently: nothing goes
  # red, PRs simply never arrive.
  - package-ecosystem: composer
    directory: /api
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
    # Every tool here consumes phpstan/phpstan through its NON-public API, and
    # every one of those constraints is a LOWER BOUND — so the constraint admits
    # the release that breaks it and Composer never refuses. Only a `conflict`
    # entry would, and not one of them declares it. Measured: phpstan 2.2.5 ->
    # 2.2.8 moving ALONE (#738) dies in php.rector.dry-run with
    # MissingPrivatePropertyException on PHPStan\Parser\RichParser::$container,
    # which rector 2.5.7 reads via PrivatesAccessor; the co-moved pair (#739)
    # does not fatal at all. Grouping is what makes the fix land in the same
    # commit as the break. Full mechanism: /deps-update step 3B.
    #
    # Membership is what breaks together: rector/rector on that measurement, the
    # phpstan-* extensions and extension-installer because they exist only to
    # plug into phpstan. Deliberately OUT: phpstan/phpdoc-parser (a production
    # library that constrains phpstan not at all) and deptrac/deptrac — which
    # carries the loosest bound of the five (^2.0) and so is the most exposed,
    # but is an independent tool on its own cadence; it is named here rather
    # than grouped, and is the first candidate if this class bites again.
    #
    # Re-derive the exposure before trusting this list:
    #   jq -r '[.packages,."packages-dev"]|flatten|.[]
    #     |select(.require."phpstan/phpstan")
    #     |"\(.name) -> \(.require."phpstan/phpstan")"' api/composer.lock
    groups:
      phpstan-rector:
        patterns:
          - "phpstan/phpstan"
          - "phpstan/phpstan-*"
          - "phpstan/extension-installer"
          - "rector/rector"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
    # Dependabot treats each sub-path of an action repository as its own
    # dependency, so github/codeql-action/{init,analyze,upload-sarif} arrive as
    # three PRs. They cannot pass alone: init and analyze validate a shared
    # config version at runtime, and a job whose steps straddle two releases
    # dies with "Loaded a configuration file for version 'X', but running
    # version 'Y'". Grouping makes them move in one commit, which is the only
    # state in which they are green.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: npm
    directory: /pwa
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
