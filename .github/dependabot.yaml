version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /api
      - /pwa
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7

  # `/api`, not `/`: the repo root holds no composer.json — the manifest is
  # api/composer.json. Pointed at `/` this lane produced ZERO routine PRs in
  # four months while npm produced ~40, and the only two composer PRs ever
  # (#138, #536) say "in the /api directory" because SECURITY updates walk the
  # dependency graph and ignore this `directory:` entirely. A version-update
  # lane aimed at a directory with no manifest fails silently: nothing goes
  # red, PRs simply never arrive.
  - package-ecosystem: composer
    directory: /api
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
    # Dependabot treats each sub-path of an action repository as its own
    # dependency, so github/codeql-action/{init,analyze,upload-sarif} arrive as
    # three PRs. They cannot pass alone: init and analyze validate a shared
    # config version at runtime, and a job whose steps straddle two releases
    # dies with "Loaded a configuration file for version 'X', but running
    # version 'Y'". Grouping makes them move in one commit, which is the only
    # state in which they are green.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: npm
    directory: /pwa
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
