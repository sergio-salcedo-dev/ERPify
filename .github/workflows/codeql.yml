name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # CodeQL semantic analysis over the PWA's JavaScript/TypeScript and the GitHub
  # Actions workflows themselves. Findings land in the repo's Security ▸ Code
  # scanning tab (needs code scanning enabled).
  #
  # The Symfony api/ is NOT analysed here: CodeQL ships no PHP analyzer, and
  # make/codeql.mk targets the PWA source root. Its dataflow coverage is the
  # repo-owned Semgrep ruleset in the api-semgrep job of ci.yml, backed by the
  # security checklist in the root CLAUDE.md applied in review.
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      security-events: write # upload CodeQL SARIF to code scanning
      actions: read # read workflow run metadata for the actions analysis
      contents: read # checkout the source under analysis

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            source-root: pwa
          - language: actions
            source-root: .

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: ${{ matrix.language }}
          source-root: ${{ matrix.source-root }}
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/.next'
              - '**/dist'
              - '**/build'
              - '**/public/build'
              - '**/tests'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          category: "/language:${{ matrix.language }}"
