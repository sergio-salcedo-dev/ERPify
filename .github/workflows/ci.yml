name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly burn-in for flaky detection — Sundays 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  FRANKENPHP_WORKER_CONFIG: ""
  FRANKENPHP_SITE_CONFIG: ""

# Restrictive default: any job that forgets its own block inherits read-only.
permissions:
  contents: read

jobs:

  # -------------------------
  # API BUILD (single source of truth)
  # -------------------------
  api-build:
    name: API Build (Docker)
    # Skipped on dependabot pull requests, and every job downstream with it (api-test, api-lint,
    # api-behat, pwa-e2e, the report and sonar `need` this one). Those PRs are almost
    # never merged as opened: /deps-update re-resolves them into one batch PR, which
    # runs this workflow in full — measured over 30 days, 43 of 44 were closed unmerged
    # while their CI billed ~1,650 minutes that decided nothing. Keyed on the PR's
    # AUTHOR rather than `github.actor`, so a human re-running one does not change the
    # verdict; a bump that must merge as opened gets the full graph with
    # `gh workflow run ci.yml --ref <its branch>` (workflow_dispatch is not a PR event).
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/docker-setup

      - name: Build images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: "."
          pull: true
          load: true
          files: |
            compose.yaml
            compose.dev.yaml
          set: |
            php.cache-from=type=gha,scope=php-${{ github.ref_name }}
            php.cache-from=type=gha,scope=php-main
            php.cache-to=type=gha,scope=php-${{ github.ref_name }},mode=max

            pwa.cache-from=type=gha,scope=pwa-${{ github.ref_name }}
            pwa.cache-from=type=gha,scope=pwa-main
            pwa.cache-to=type=gha,scope=pwa-${{ github.ref_name }},mode=max

  # -------------------------
  # API TEST (fast feedback)
  # -------------------------
  api-test:
    name: API Tests (PHPUnit)
    needs: api-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/docker-setup

      - name: Build images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: "."
          pull: true
          load: true
          # API-only job: build the php image (shared by messenger_worker); skip pwa.
          targets: php
          files: |
            compose.yaml
            compose.dev.yaml
          set: |
            php.cache-from=type=gha,scope=php-${{ github.ref_name }}
            php.cache-from=type=gha,scope=php-main

      - name: Start API stack (backend only — no PWA)
        run: make docker.up.wait.no-build.api

      - name: Health check
        run: curl -skSf https://localhost/api/v1/health

      # The gate that decides a merge: the uninstrumented suite under
      # PHPUNIT_MEMORY_LIMIT (make/config.mk, 512M) with PHPUnit's strictness
      # intact — failOnWarning / failOnNotice / failOnDeprecation from
      # api/tools/phpunit/phpunit.dist.xml, and no
      # --do-not-fail-on-phpunit-warning. It runs BEFORE the coverage step so the
      # ceiling CI actually enforces is this 512M one rather than coverage's 1G,
      # and so a PHPUnit warning is red here instead of merely printed there.
      # Until it existed, both were exercised only on a developer's machine — and
      # that is how the suite grew past the image's 128M default with CI green.
      - name: PHPUnit (strict gate — 512M ceiling, warnings fatal)
        run: make php.unit

      # Runs the unit suite a second time under Xdebug coverage and emits the
      # Clover report the sonar job imports. Report generation, not the gate: the
      # limit is raised to 1G for the instrumentation and PHPUnit's own
      # coverage-target warnings (inherent to coverage mode) are relaxed, so a
      # green here proves less than the step above. Failures, deprecations and
      # notices still fail it.
      - name: PHPUnit (+ Clover coverage)
        run: make php.unit.coverage

      - name: Upload PHP coverage (clover)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-coverage
          path: api/var/coverage/clover.xml
          retention-days: 1
          if-no-files-found: error

      - name: Debug
        if: failure()
        run: |
          echo "=== ps ==="; docker compose ps
          echo "=== database state ==="; docker inspect "$(docker compose ps -q database)" --format '{{json .State}}' || true
          # OOMKilled and ExitCode live in .State, never in the log stream, and compose.dev.yaml caps
          # every service: without these a container killed at its cap reads as a flake downstream.
          for svc in php pwa messenger_worker; do
            echo "=== $svc state ==="; docker inspect "$(docker compose ps -aq "$svc")" --format '{{json .State}}' || true
          done
          echo "=== php (last 50 lines) ==="; docker compose logs --tail=50 php || true
          echo "=== database (last 50 lines) ==="; docker compose logs --tail=50 database || true
          echo "=== messenger_worker (last 50 lines) ==="; docker compose logs --tail=50 messenger_worker || true

      - name: Security check
        uses: symfonycorp/security-checker-action@258311ef7ac571f1310780ef3d79fc5abef642b5 # v5
        with:
          lock: ./api/composer.lock

  # -------------------------
  # API LINT (parallel)
  # -------------------------
  # Its own job rather than a step of api-test: the sweep (~3 min) and the two
  # PHPUnit passes (~3 min) share nothing — php.unit prepares its own test
  # database — and in series they would be the longest leg of the path to
  # ci-status. Apart, the sweep finishes inside api-test's shadow.
  api-lint:
    name: API Lint (PHP quality)
    needs: api-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/docker-setup

      - name: Build images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: "."
          pull: true
          load: true
          targets: php
          files: |
            compose.yaml
            compose.dev.yaml
          set: |
            php.cache-from=type=gha,scope=php-${{ github.ref_name }}
            php.cache-from=type=gha,scope=php-main

      # php.lint.doctrine and php.lint.error-contract reach the database and the console.
      - name: Start API stack (backend only — no PWA)
        run: make docker.up.wait.no-build.api

      - name: Health check
        run: curl -skSf https://localhost/api/v1/health

      # Check-only sweep (fails on drift instead of auto-fixing) fanned out
      # read-only. phpstan is the CPU-heavy target; the rest are light
      # or I/O-bound (doctrine + error-contract hit the DB/console). -j4 deliberately
      # oversubscribes the 2-core runner so the light targets fill the gaps while the
      # analyzer runs — GitHub runners have ~7GB RAM, so 4 PHP processes fit easily.
      # Revisit from the step timing if a run shows it's purely CPU-bound (then -j2/3).
      # --output-sync keeps logs grouped per-tool. (phpcs gated via php.cs.dry-run.)
      - name: PHP lint (check, parallel)
        run: make -j4 --output-sync=target php.quality.dry-run

      - name: Debug
        if: failure()
        run: |
          echo "=== ps ==="; docker compose ps
          for svc in php database; do
            echo "=== $svc state ==="; docker inspect "$(docker compose ps -aq "$svc")" --format '{{json .State}}' || true
          done
          echo "=== php (last 50 lines) ==="; docker compose logs --tail=50 php || true
          echo "=== database (last 50 lines) ==="; docker compose logs --tail=50 database || true

  # -------------------------
  # API BEHAT (parallel)
  # -------------------------
  api-behat:
    name: API Behat
    needs: api-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/docker-setup

      - name: Build images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: "."
          pull: true
          load: true
          # API-only job: build the php image (shared by messenger_worker); skip pwa.
          targets: php
          files: |
            compose.yaml
            compose.dev.yaml
          set: |
            php.cache-from=type=gha,scope=php-${{ github.ref_name }}
            php.cache-from=type=gha,scope=php-main

      - name: Start API stack (backend only — no PWA)
        run: make docker.up.wait.no-build.api

      - name: Health check
        run: curl -skSf https://localhost/api/v1/health

      # One run, instrumented: the `coverage` profile inherits the default one whole (suite, contexts,
      # strict result interpretation — an undefined step still exits non-zero under it), so this is the
      # gate AND the Clover report the sonar job imports. Measured locally at 93 s against 46 s
      # uninstrumented, which is cheaper than running the suite twice the way api-test does: PHPUnit
      # needs its uninstrumented pass to enforce a memory ceiling and warnings coverage mode relaxes,
      # and Behat has neither.
      - name: Run Behat (+ Clover coverage)
        run: make php.behat.coverage

      - name: Upload Behat coverage (clover)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-behat-coverage
          path: api/var/coverage/behat-clover.xml
          retention-days: 1
          if-no-files-found: error

      - name: Debug
        if: failure()
        run: |
          echo "=== ps ==="; docker compose ps
          echo "=== database state ==="; docker inspect "$(docker compose ps -q database)" --format '{{json .State}}' || true
          # OOMKilled and ExitCode live in .State, never in the log stream, and compose.dev.yaml caps
          # every service: without these a container killed at its cap reads as a flake downstream.
          for svc in php pwa messenger_worker; do
            echo "=== $svc state ==="; docker inspect "$(docker compose ps -aq "$svc")" --format '{{json .State}}' || true
          done
          echo "=== php (last 50 lines) ==="; docker compose logs --tail=50 php || true
          echo "=== database (last 50 lines) ==="; docker compose logs --tail=50 database || true
          echo "=== messenger_worker (last 50 lines) ==="; docker compose logs --tail=50 messenger_worker || true

  # -------------------------
  # STATIC (ShellCheck + the ERPify Semgrep rules — no stack, no application image)
  # -------------------------
  # One job rather than two because each takes seconds and a job is billed by the
  # started minute: apart they were 7 s and 33 s, billed 1 min each, ~630 min a
  # month for 40 s of work. They share nothing but the checkout, and ShellCheck runs
  # first so its gating verdict never waits on the scanner.
  static:
    name: Static (ShellCheck + Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Asserted rather than assumed: shellcheck ships in the runner image, and a
      # future image that drops it must fail here with a reason instead of the
      # gate quietly reporting nothing. The version is also the one thing that
      # explains a red appearing on a commit that touched no shell — see
      # make/shell.mk on why this is the runner's version and not a pin.
      - name: ShellCheck version
        run: shellcheck --version

      # One invocation over every tracked *.sh. Zero findings, no baseline; the
      # target itself explains why a per-file loop would report three findings
      # that are artefacts of the invocation.
      - name: Lint tracked shell scripts
        run: make shell.lint

      # The ruleset is local YAML and the scanner is a pinned container, so this
      # needs neither the registry nor a Semgrep account. It stays out of the
      # php.quality.dry-run sweep because it runs in its own container rather than
      # the php one.
      - name: Semgrep rule fixtures
        run: make semgrep.test

      # Non-gating while the rules bed in — findings are visible in code scanning
      # and in this job's log, but a false positive must not block a merge. Flip
      # to gating (drop continue-on-error) once a few PRs have run clean.
      - name: Semgrep scan of api/src
        continue-on-error: true
        run: make semgrep.sarif

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: .semgrep/erpify-rules.sarif
          category: erpify-semgrep

  # -------------------------
  # PWA NODE (isolated, fast)
  # -------------------------
  pwa-node:
    name: PWA (Node)
    # Skipped on dependabot pull requests for the reason api-build gives.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/node-setup

      - run: make pwa.install
      - run: make pwa.quality.dry-run
      # Unit suite + v8 coverage → pwa/coverage/lcov.info for the sonar job.
      - run: make pwa.test.unit.coverage
      - run: make pwa.production.build

      - name: Upload PWA coverage (lcov)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwa-coverage
          path: pwa/coverage/lcov.info
          retention-days: 1
          if-no-files-found: error

  # -------------------------
  # PWA E2E (sharded — depends on build)
  # -------------------------
  # Needs api-build only: it builds its own images and installs its own
  # dependencies, so nothing pwa-node produces reaches it. Waiting for pwa-node
  # would put the two (~6 + ~5 min) in series on the path to ci-status.
  pwa-e2e:
    name: PWA (E2E) [shard ${{ matrix.shard }}/${{ strategy.job-total }}]
    needs: api-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Single source of truth for E2E sharding. To scale, just extend this
        # list (e.g. [1, 2, 3]); the job name and CI_TOTAL_SHARDS both derive
        # the count from `strategy.job-total` automatically. Two shards split the
        # suite across isolated per-shard stacks (own DB/containers), so the
        # wall-clock halves without the shared-state flakiness that raising
        # in-shard workers would risk.
        shard: [1, 2]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/full-setup/

      - name: Build images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: "."
          pull: true
          load: true
          files: |
            compose.yaml
            compose.dev.yaml
          set: |
            php.cache-from=type=gha,scope=php-${{ github.ref_name }}
            php.cache-from=type=gha,scope=php-main
            pwa.cache-from=type=gha,scope=pwa-${{ github.ref_name }}
            pwa.cache-from=type=gha,scope=pwa-main

      - name: Install PWA dependencies (host)
        run: make pwa.install

      - name: Start full stack
        env:
          COMPOSE_PROJECT_NAME: erpify-e2e
        run: make docker.up.wait.no-build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./pwa/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # The ubuntu-latest image ships every Chromium system library (verified:
      # `playwright install-deps` reports each one already-installed) and the E2E
      # suite makes no font-dependent visual assertions, so we install the browser
      # binary alone and skip the apt pass entirely — no `--with-deps`, no separate
      # install-deps step. On a cache hit nothing runs here at all. If a future
      # runner image ever drops a required library, chromium launch fails loudly on
      # the next miss — re-add `--with-deps chromium` to restore the apt install.
      - name: Install Playwright Browser (deps preinstalled on runner)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd pwa && npx playwright install chromium

      - name: Run E2E
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: https://localhost
          # Same project as "Start full stack" so `make pwa.test.e2e`'s user-seed step (nested `make sf`)
          # execs into THIS stack's php container; without it the seed hits the default project (no running
          # stack), the E2E user is never created, and the login setup fails with a 401.
          COMPOSE_PROJECT_NAME: erpify-e2e
          # Indirect through env (not inline ${{ }}) so the run block never expands
          # a workflow expression into shell — the safe pattern used in ci-status.
          SHARD: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ strategy.job-total }}
        run: make pwa.test.e2e CI_SHARD="$SHARD" CI_TOTAL_SHARDS="$TOTAL_SHARDS"

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: pwa/blob-report/
          retention-days: 1
          if-no-files-found: error

      - name: Debug
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: erpify-e2e
        run: |
          echo "=== ps ==="; docker compose ps
          echo "=== database state ==="; docker inspect "$(docker compose ps -q database)" --format '{{json .State}}' || true
          # OOMKilled and ExitCode live in .State, never in the log stream, and compose.dev.yaml caps
          # every service: without these a container killed at its cap reads as a flake downstream.
          for svc in php pwa messenger_worker; do
            echo "=== $svc state ==="; docker inspect "$(docker compose ps -aq "$svc")" --format '{{json .State}}' || true
          done
          echo "=== php (last 50 lines) ==="; docker compose logs --tail=50 php || true
          echo "=== pwa (last 50 lines) ==="; docker compose logs --tail=50 pwa || true
          echo "=== database (last 50 lines) ==="; docker compose logs --tail=50 database || true
          echo "=== messenger_worker (last 50 lines) ==="; docker compose logs --tail=50 messenger_worker || true

  # -------------------------
  # PWA E2E REPORT (merge blob reports — always)
  # -------------------------
  pwa-e2e-report:
    name: PWA (E2E) Report
    if: always() && needs.pwa-e2e.result != 'skipped'
    needs: [pwa-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/node-setup

      - name: Install PWA dependencies
        run: make pwa.install

      - name: Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: pwa/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML report
        run: |
          mkdir -p pwa/all-blob-reports
          if [ -z "$(ls -A pwa/all-blob-reports 2>/dev/null)" ]; then
            echo "::warning::No blob reports found — upstream E2E shards produced none. Skipping merge."
            exit 0
          fi
          cd pwa && npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report--attempt-${{ github.run_attempt }}
          path: pwa/playwright-report/
          retention-days: 7

  # -------------------------
  # PWA BURN-IN (flaky detection — weekly schedule only)
  # -------------------------
  pwa-burn-in:
    name: PWA Burn-In (Flaky Detection)
    if: github.event_name == 'schedule'
    needs: [pwa-node, api-build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/full-setup/

      - name: Build images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: "."
          pull: true
          load: true
          files: |
            compose.yaml
            compose.dev.yaml
          set: |
            php.cache-from=type=gha,scope=php-${{ github.ref_name }}
            php.cache-from=type=gha,scope=php-main
            pwa.cache-from=type=gha,scope=pwa-${{ github.ref_name }}
            pwa.cache-from=type=gha,scope=pwa-main

      - name: Install PWA dependencies (host)
        run: make pwa.install

      - name: Start full stack
        env:
          COMPOSE_PROJECT_NAME: erpify-burnin
        run: make docker.up.wait.no-build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./pwa/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # The ubuntu-latest image ships every Chromium system library (verified:
      # `playwright install-deps` reports each one already-installed) and the E2E
      # suite makes no font-dependent visual assertions, so we install the browser
      # binary alone and skip the apt pass entirely — no `--with-deps`, no separate
      # install-deps step. On a cache hit nothing runs here at all. If a future
      # runner image ever drops a required library, chromium launch fails loudly on
      # the next miss — re-add `--with-deps chromium` to restore the apt install.
      - name: Install Playwright Browser (deps preinstalled on runner)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd pwa && npx playwright install chromium

      # Use Playwright's --repeat-each to detect flakiness in a single run
      # (avoids per-iteration stack-bring-up cost).
      - name: Burn-in (repeat-each=10)
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: https://localhost
        run: make pwa.test.e2e c='--repeat-each=10'

      - name: Upload burn-in artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: burn-in-report--attempt-${{ github.run_attempt }}
          path: |
            pwa/blob-report/
            pwa/playwright-report/
            pwa/test-results/
          retention-days: 7

      - name: Debug
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: erpify-burnin
        run: |
          echo "=== ps ==="; docker compose ps
          echo "=== database state ==="; docker inspect "$(docker compose ps -q database)" --format '{{json .State}}' || true
          # OOMKilled and ExitCode live in .State, never in the log stream, and compose.dev.yaml caps
          # every service: without these a container killed at its cap reads as a flake downstream.
          for svc in php pwa messenger_worker; do
            echo "=== $svc state ==="; docker inspect "$(docker compose ps -aq "$svc")" --format '{{json .State}}' || true
          done
          echo "=== php (last 50 lines) ==="; docker compose logs --tail=50 php || true
          echo "=== pwa (last 50 lines) ==="; docker compose logs --tail=50 pwa || true
          echo "=== database (last 50 lines) ==="; docker compose logs --tail=50 database || true
          echo "=== messenger_worker (last 50 lines) ==="; docker compose logs --tail=50 messenger_worker || true

  # -------------------------
  # SONARCLOUD (static analysis — informational, non-gating)
  # -------------------------
  # CI-based analysis on SonarCloud (sergio-salcedo-dev_ERPify). Requires the
  # project's "Automatic Analysis" to be turned OFF in the SonarCloud UI
  # (Project Settings ▸ Analysis Method) — the two are mutually exclusive and a
  # scan errors out while AA is enabled. Deliberately kept out of the ci-status
  # gate: a red Quality Gate informs, it does not block merges.
  #
  # Token hygiene: SONAR_TOKEN (a project-scoped analysis token) is a repo
  # secret, injected only into the scan step's env, never echoed and never placed
  # in sonar-project.properties. The job is skipped on fork PRs, where the secret
  # is absent by design — so it can never leak to untrusted PR code. We use the
  # plain `pull_request` trigger (never pull_request_target) for the same reason.
  # Dependabot PRs are skipped on the same grounds: GitHub scopes those runs to a
  # separate Dependabot secret store, so SONAR_TOKEN resolves empty and the scan
  # can only ever fail "Not authorized". Skipping forfeits no analysis — Dependabot
  # touches lockfiles and pinned action digests, never analysed source.
  # Imports the coverage reports produced by api-test and api-behat (Clover) and
  # pwa-node (lcov) as build artifacts, so the scan reports Coverage on New Code.
  # All three reports carry repo-root-relative file paths (api/src/…, pwa/src/…) that
  # resolve against this job's checkout. Still non-gating.
  sonar:
    name: SonarCloud
    needs: [api-test, api-behat, pwa-node]
    if: >-
      (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so SonarCloud can attribute new code / blame accurately.
          fetch-depth: 0
          persist-credentials: false

      - name: Download PHP coverage (clover)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: php-coverage
          path: api/var/coverage

      - name: Download Behat coverage (clover)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: php-behat-coverage
          path: api/var/coverage

      - name: Download PWA coverage (lcov)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pwa-coverage
          path: pwa/coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # -------------------------
  # CI STATUS (summary + the strict gate, one job — burn-in reported, never gating)
  # -------------------------
  # One job rather than a summary and a gate apart: each took 3 s and was billed a
  # minute. Also stricter than the gate it replaces, which ran only when every need
  # succeeded — so a red upstream left it SKIPPED, and a skipped check reads as green.
  # This one always runs and decides from the results: a gating job that failed or
  # was cancelled fails it, and so does api-build, because a failed build SKIPS the
  # jobs that need it rather than failing them.
  ci-status:
    name: CI Status
    if: always()
    needs: [api-build, api-test, api-lint, api-behat, static, pwa-node, pwa-e2e, pwa-burn-in, sonar]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}

    steps:
      - name: Render summary and decide
        env:
          R_API_BUILD: ${{ needs.api-build.result }}
          R_API_TEST: ${{ needs.api-test.result }}
          R_API_LINT: ${{ needs.api-lint.result }}
          R_API_BEHAT: ${{ needs.api-behat.result }}
          R_STATIC: ${{ needs.static.result }}
          R_PWA_NODE: ${{ needs.pwa-node.result }}
          R_PWA_E2E: ${{ needs.pwa-e2e.result }}
          R_PWA_BURNIN: ${{ needs.pwa-burn-in.result }}
          R_SONAR: ${{ needs.sonar.result }}
          DEPENDABOT_PR: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          {
            echo "## CI Execution Summary"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| API Build       | $R_API_BUILD |"
            echo "| API Tests       | $R_API_TEST |"
            echo "| API Lint        | $R_API_LINT |"
            echo "| API Behat       | $R_API_BEHAT |"
            echo "| Static          | $R_STATIC |"
            echo "| PWA (Node)      | $R_PWA_NODE |"
            echo "| PWA (E2E)       | $R_PWA_E2E |"
            echo "| PWA (Burn-In)   | $R_PWA_BURNIN |"
            echo "| SonarCloud      | $R_SONAR |"
            echo ""
            if [ "$R_PWA_BURNIN" = "failure" ]; then
              echo "> ⚠️ **Flaky tests detected** — review the burn-in artifact."
            fi
            if [ "$R_SONAR" = "failure" ]; then
              echo "> ⚠️ **SonarCloud quality gate failed** — informational only, does not block merge. See the SonarCloud dashboard."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # A dependabot PR ran only the static job, so it is NOT validated — and saying
          # so in red is the point: a skipped graph would otherwise read as a green one.
          if [ "$DEPENDABOT_PR" = "true" ]; then
            echo "::error::Dependabot PR: the test graph was skipped on purpose. Batch it with /deps-update, or run the full CI on its branch (gh workflow run ci.yml --ref <branch>) before merging it as opened."
            exit 1
          fi

          status=0
          for pair in "api-build:$R_API_BUILD" "api-test:$R_API_TEST" "api-lint:$R_API_LINT" \
                      "api-behat:$R_API_BEHAT" \
                      "static:$R_STATIC" "pwa-node:$R_PWA_NODE" "pwa-e2e:$R_PWA_E2E"; do
            case "${pair#*:}" in
              success) ;;
              *) echo "::error::${pair%%:*} is ${pair#*:}"; status=1 ;;
            esac
          done
          exit "$status"
