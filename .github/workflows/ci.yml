name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly burn-in for flaky detection — Sundays 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  FRANKENPHP_WORKER_CONFIG: ""
  FRANKENPHP_SITE_CONFIG: ""

# Restrictive default: any job that forgets its own block inherits read-only.
permissions:
  contents: read

jobs:

  # -------------------------
  # API BUILD (single source of truth)
  # -------------------------
  api-build:
    name: API Build (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/docker-setup

      - name: Build images
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: "."
          pull: true
          load: true
          files: |
            compose.yaml
            compose.dev.yaml
          set: |
            php.cache-from=type=gha,scope=php-${{ github.ref_name }}
            php.cache-from=type=gha,scope=php-main
            php.cache-to=type=gha,scope=php-${{ github.ref_name }},mode=max

            pwa.cache-from=type=gha,scope=pwa-${{ github.ref_name }}
            pwa.cache-from=type=gha,scope=pwa-main
            pwa.cache-to=type=gha,scope=pwa-${{ github.ref_name }},mode=max

  # -------------------------
  # API TEST (fast feedback)
  # -------------------------
  api-test:
    name: API Tests (PHPUnit + Lint)
    needs: api-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/docker-setup

      - name: Build images
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: "."
          pull: true
          load: true
          # API-only job: build the php image (shared by messenger_worker); skip pwa.
          targets: php
          files: |
            compose.yaml
            compose.dev.yaml
          set: |
            php.cache-from=type=gha,scope=php-${{ github.ref_name }}
            php.cache-from=type=gha,scope=php-main

      - name: Start API stack (backend only — no PWA)
        run: make docker.up.wait.no-build.api

      - name: Health check
        run: curl -skSf https://localhost/api/v1/health

      # Check-only sweep (fails on drift instead of auto-fixing) fanned out
      # read-only. phpstan is the CPU-heavy target; the rest are light
      # or I/O-bound (doctrine + error-contract hit the DB/console). -j4 deliberately
      # oversubscribes the 2-core runner so the light targets fill the gaps while the
      # analyzer runs — GitHub runners have ~7GB RAM, so 4 PHP processes fit easily.
      # Revisit from the step timing if a run shows it's purely CPU-bound (then -j2/3).
      # --output-sync keeps logs grouped per-tool. (phpcs gated via php.cs.dry-run.)
      - name: PHP lint (check, parallel)
        run: make -j4 --output-sync=target php.quality.dry-run

      # Runs the unit suite under Xdebug coverage and emits the Clover report the
      # sonar job imports. Still the unit-test gate: failures, deprecations and
      # notices fail it — only PHPUnit's own coverage-target warnings (inherent
      # to coverage mode) are relaxed.
      - name: PHPUnit (+ Clover coverage)
        run: make php.unit.coverage

      - name: Upload PHP coverage (clover)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: php-coverage
          path: api/var/coverage/clover.xml
          retention-days: 1
          if-no-files-found: error

      - name: Debug
        if: failure()
        run: |
          echo "=== ps ==="; docker compose ps
          echo "=== database state ==="; docker inspect "$(docker compose ps -q database)" --format '{{json .State}}' || true
          echo "=== php (last 50 lines) ==="; docker compose logs --tail=50 php || true
          echo "=== database (last 50 lines) ==="; docker compose logs --tail=50 database || true
          echo "=== messenger_worker (last 50 lines) ==="; docker compose logs --tail=50 messenger_worker || true

      - name: Security check
        uses: symfonycorp/security-checker-action@258311ef7ac571f1310780ef3d79fc5abef642b5 # v5
        with:
          lock: ./api/composer.lock

  # -------------------------
  # API BEHAT (parallel)
  # -------------------------
  api-behat:
    name: API Behat
    needs: api-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/docker-setup

      - name: Build images
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: "."
          pull: true
          load: true
          # API-only job: build the php image (shared by messenger_worker); skip pwa.
          targets: php
          files: |
            compose.yaml
            compose.dev.yaml
          set: |
            php.cache-from=type=gha,scope=php-${{ github.ref_name }}
            php.cache-from=type=gha,scope=php-main

      - name: Start API stack (backend only — no PWA)
        run: make docker.up.wait.no-build.api

      - name: Health check
        run: curl -skSf https://localhost/api/v1/health

      - name: Run Behat
        run: make php.behat

      - name: Debug
        if: failure()
        run: |
          echo "=== ps ==="; docker compose ps
          echo "=== database state ==="; docker inspect "$(docker compose ps -q database)" --format '{{json .State}}' || true
          echo "=== php (last 50 lines) ==="; docker compose logs --tail=50 php || true
          echo "=== database (last 50 lines) ==="; docker compose logs --tail=50 database || true
          echo "=== messenger_worker (last 50 lines) ==="; docker compose logs --tail=50 messenger_worker || true

  # -------------------------
  # API SECURITY (ERPify Semgrep taint rules — parallel, non-gating for now)
  # -------------------------
  api-semgrep:
    name: API Security (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No stack and no application image: the ruleset is local YAML and the
      # scanner is a pinned container, so this job needs neither the registry nor
      # a Semgrep account. It stays out of the php.quality.dry-run sweep because
      # it runs in its own container rather than the php one.
      - name: Rule fixtures
        run: make semgrep.test

      # Non-gating while the rules bed in — findings are visible in code scanning
      # and in this job's log, but a false positive must not block a merge. Flip
      # to gating (drop continue-on-error) once a few PRs have run clean.
      - name: Scan api/src
        continue-on-error: true
        run: make semgrep.sarif

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: .semgrep/erpify-rules.sarif
          category: erpify-semgrep

  # -------------------------
  # UPSTREAM PIN WATCH (scheduled only — observes upstream state, not this diff)
  # -------------------------
  # Deliberately absent from ci-summary/ci-success: it is not a PR gate. A red
  # run means upstream tagged symfony/mercure-bundle past v0.4.2 — retire the
  # 0.4.x-dev pin (issue #593); the failure log prints the steps.
  upstream-pin-watch:
    name: Upstream Pin Watch (mercure-bundle)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for a qualifying upstream tag
        run: make composer.check.mercure-pin

  # -------------------------
  # PWA NODE (isolated, fast)
  # -------------------------
  pwa-node:
    name: PWA (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/node-setup

      - run: make pwa.install
      - run: make pwa.quality.dry-run
      # Unit suite + v8 coverage → pwa/coverage/lcov.info for the sonar job.
      - run: make pwa.test.unit.coverage
      - run: make pwa.production.build

      - name: Upload PWA coverage (lcov)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pwa-coverage
          path: pwa/coverage/lcov.info
          retention-days: 1
          if-no-files-found: error

  # -------------------------
  # PWA E2E (sharded — depends on build)
  # -------------------------
  pwa-e2e:
    name: PWA (E2E) [shard ${{ matrix.shard }}/${{ strategy.job-total }}]
    needs: [pwa-node, api-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Single source of truth for E2E sharding. To scale, just extend this
        # list (e.g. [1, 2, 3]); the job name and CI_TOTAL_SHARDS both derive
        # the count from `strategy.job-total` automatically. Two shards split the
        # suite across isolated per-shard stacks (own DB/containers), so the
        # wall-clock halves without the shared-state flakiness that raising
        # in-shard workers would risk.
        shard: [1, 2]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/full-setup/

      - name: Build images
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: "."
          pull: true
          load: true
          files: |
            compose.yaml
            compose.dev.yaml
          set: |
            php.cache-from=type=gha,scope=php-${{ github.ref_name }}
            php.cache-from=type=gha,scope=php-main
            pwa.cache-from=type=gha,scope=pwa-${{ github.ref_name }}
            pwa.cache-from=type=gha,scope=pwa-main

      - name: Install PWA dependencies (host)
        run: make pwa.install

      - name: Start full stack
        env:
          COMPOSE_PROJECT_NAME: erpify-e2e
        run: make docker.up.wait.no-build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./pwa/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # The ubuntu-latest image ships every Chromium system library (verified:
      # `playwright install-deps` reports each one already-installed) and the E2E
      # suite makes no font-dependent visual assertions, so we install the browser
      # binary alone and skip the apt pass entirely — no `--with-deps`, no separate
      # install-deps step. On a cache hit nothing runs here at all. If a future
      # runner image ever drops a required library, chromium launch fails loudly on
      # the next miss — re-add `--with-deps chromium` to restore the apt install.
      - name: Install Playwright Browser (deps preinstalled on runner)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd pwa && npx playwright install chromium

      - name: Run E2E
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: https://localhost
          # Same project as "Start full stack" so `make pwa.test.e2e`'s user-seed step (nested `make sf`)
          # execs into THIS stack's php container; without it the seed hits the default project (no running
          # stack), the E2E user is never created, and the login setup fails with a 401.
          COMPOSE_PROJECT_NAME: erpify-e2e
          # Indirect through env (not inline ${{ }}) so the run block never expands
          # a workflow expression into shell — the safe pattern used in ci-summary.
          SHARD: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ strategy.job-total }}
        run: make pwa.test.e2e CI_SHARD="$SHARD" CI_TOTAL_SHARDS="$TOTAL_SHARDS"

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ matrix.shard }}
          path: pwa/blob-report/
          retention-days: 1
          if-no-files-found: error

      - name: Debug
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: erpify-e2e
        run: |
          echo "=== ps ==="; docker compose ps
          echo "=== database state ==="; docker inspect "$(docker compose ps -q database)" --format '{{json .State}}' || true
          echo "=== php (last 50 lines) ==="; docker compose logs --tail=50 php || true
          echo "=== pwa (last 50 lines) ==="; docker compose logs --tail=50 pwa || true
          echo "=== database (last 50 lines) ==="; docker compose logs --tail=50 database || true
          echo "=== messenger_worker (last 50 lines) ==="; docker compose logs --tail=50 messenger_worker || true

  # -------------------------
  # PWA E2E REPORT (merge blob reports — always)
  # -------------------------
  pwa-e2e-report:
    name: PWA (E2E) Report
    if: always() && needs.pwa-e2e.result != 'skipped'
    needs: [pwa-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/node-setup

      - name: Install PWA dependencies
        run: make pwa.install

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: pwa/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML report
        run: |
          mkdir -p pwa/all-blob-reports
          if [ -z "$(ls -A pwa/all-blob-reports 2>/dev/null)" ]; then
            echo "::warning::No blob reports found — upstream E2E shards produced none. Skipping merge."
            exit 0
          fi
          cd pwa && npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report--attempt-${{ github.run_attempt }}
          path: pwa/playwright-report/
          retention-days: 7

  # -------------------------
  # PWA BURN-IN (flaky detection — weekly schedule only)
  # -------------------------
  pwa-burn-in:
    name: PWA Burn-In (Flaky Detection)
    if: github.event_name == 'schedule'
    needs: [pwa-node, api-build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/full-setup/

      - name: Build images
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: "."
          pull: true
          load: true
          files: |
            compose.yaml
            compose.dev.yaml
          set: |
            php.cache-from=type=gha,scope=php-${{ github.ref_name }}
            php.cache-from=type=gha,scope=php-main
            pwa.cache-from=type=gha,scope=pwa-${{ github.ref_name }}
            pwa.cache-from=type=gha,scope=pwa-main

      - name: Install PWA dependencies (host)
        run: make pwa.install

      - name: Start full stack
        env:
          COMPOSE_PROJECT_NAME: erpify-burnin
        run: make docker.up.wait.no-build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./pwa/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # The ubuntu-latest image ships every Chromium system library (verified:
      # `playwright install-deps` reports each one already-installed) and the E2E
      # suite makes no font-dependent visual assertions, so we install the browser
      # binary alone and skip the apt pass entirely — no `--with-deps`, no separate
      # install-deps step. On a cache hit nothing runs here at all. If a future
      # runner image ever drops a required library, chromium launch fails loudly on
      # the next miss — re-add `--with-deps chromium` to restore the apt install.
      - name: Install Playwright Browser (deps preinstalled on runner)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd pwa && npx playwright install chromium

      # Use Playwright's --repeat-each to detect flakiness in a single run
      # (avoids per-iteration stack-bring-up cost).
      - name: Burn-in (repeat-each=10)
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: https://localhost
        run: make pwa.test.e2e c='--repeat-each=10'

      - name: Upload burn-in artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: burn-in-report--attempt-${{ github.run_attempt }}
          path: |
            pwa/blob-report/
            pwa/playwright-report/
            pwa/test-results/
          retention-days: 7

      - name: Debug
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: erpify-burnin
        run: |
          echo "=== ps ==="; docker compose ps
          echo "=== database state ==="; docker inspect "$(docker compose ps -q database)" --format '{{json .State}}' || true
          echo "=== php (last 50 lines) ==="; docker compose logs --tail=50 php || true
          echo "=== pwa (last 50 lines) ==="; docker compose logs --tail=50 pwa || true
          echo "=== database (last 50 lines) ==="; docker compose logs --tail=50 database || true
          echo "=== messenger_worker (last 50 lines) ==="; docker compose logs --tail=50 messenger_worker || true

  # -------------------------
  # SONARCLOUD (static analysis — informational, non-gating)
  # -------------------------
  # CI-based analysis on SonarCloud (sergio-salcedo-dev_ERPify). Requires the
  # project's "Automatic Analysis" to be turned OFF in the SonarCloud UI
  # (Project Settings ▸ Analysis Method) — the two are mutually exclusive and a
  # scan errors out while AA is enabled. Deliberately kept out of the ci-success
  # gate: a red Quality Gate informs, it does not block merges.
  #
  # Token hygiene: SONAR_TOKEN (a project-scoped analysis token) is a repo
  # secret, injected only into the scan step's env, never echoed and never placed
  # in sonar-project.properties. The job is skipped on fork PRs, where the secret
  # is absent by design — so it can never leak to untrusted PR code. We use the
  # plain `pull_request` trigger (never pull_request_target) for the same reason.
  # Dependabot PRs are skipped on the same grounds: GitHub scopes those runs to a
  # separate Dependabot secret store, so SONAR_TOKEN resolves empty and the scan
  # can only ever fail "Not authorized". Skipping forfeits no analysis — Dependabot
  # touches lockfiles and pinned action digests, never analysed source.
  # Imports the coverage reports produced by api-test (Clover) and pwa-node
  # (lcov) as build artifacts, so the scan reports Coverage on New Code. Both
  # reports carry repo-root-relative file paths (api/src/…, pwa/src/…) that
  # resolve against this job's checkout. Still non-gating.
  sonar:
    name: SonarCloud
    needs: [api-test, pwa-node]
    if: >-
      (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so SonarCloud can attribute new code / blame accurately.
          fetch-depth: 0
          persist-credentials: false

      - name: Download PHP coverage (clover)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: php-coverage
          path: api/var/coverage

      - name: Download PWA coverage (lcov)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pwa-coverage
          path: pwa/coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # -------------------------
  # CI SUMMARY (aggregate — always renders)
  # -------------------------
  ci-summary:
    name: CI Summary
    if: always()
    needs: [api-build, api-test, api-behat, api-semgrep, pwa-node, pwa-e2e, pwa-burn-in, sonar]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}

    steps:
      - name: Render summary
        env:
          R_API_BUILD: ${{ needs.api-build.result }}
          R_API_TEST: ${{ needs.api-test.result }}
          R_API_BEHAT: ${{ needs.api-behat.result }}
          R_API_SEMGREP: ${{ needs.api-semgrep.result }}
          R_PWA_NODE: ${{ needs.pwa-node.result }}
          R_PWA_E2E: ${{ needs.pwa-e2e.result }}
          R_PWA_BURNIN: ${{ needs.pwa-burn-in.result }}
          R_SONAR: ${{ needs.sonar.result }}
        run: |
          {
            echo "## CI Execution Summary"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| API Build       | $R_API_BUILD |"
            echo "| API Tests       | $R_API_TEST |"
            echo "| API Behat       | $R_API_BEHAT |"
            echo "| API Semgrep     | $R_API_SEMGREP |"
            echo "| PWA (Node)      | $R_PWA_NODE |"
            echo "| PWA (E2E)       | $R_PWA_E2E |"
            echo "| PWA (Burn-In)   | $R_PWA_BURNIN |"
            echo "| SonarCloud      | $R_SONAR |"
            echo ""
            if [ "$R_PWA_BURNIN" = "failure" ]; then
              echo "> ⚠️ **Flaky tests detected** — review the burn-in artifact."
            fi
            if [ "$R_SONAR" = "failure" ]; then
              echo "> ⚠️ **SonarCloud quality gate failed** — informational only, does not block merge. See the SonarCloud dashboard."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------
  # FINAL STATUS (strict gate — burn-in deliberately excluded)
  # -------------------------
  ci-success:
    name: CI Status
    needs: [api-test, api-behat, pwa-node, pwa-e2e]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Success
        run: echo "All checks passed successfully!"
